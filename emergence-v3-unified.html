(function () {

  /* ---------- config (per-era, scoped under CFG.eN — no bare-key clashes) ---------- */

      eventGap: 26, eventDur: 13, eventWarn: 3, shiftDrop: 0.03, shiftDemand: 1.8, breakthroughMult: 2.2, momentumAfter: 6,
      stabilizerCost: 140, stabilizerCut: 0.13, stabilizerMax: 5, lockCost: 90, lockGrowth: 1.35, lockDur: 28,

      foundryCost: 60, foundryGrowth: 1.20, foundryRate: 0.8,

      modelCost: 90, modelGrowth: 1.20, modelRate: 0.6,
      scriptoriumCost: 45, scriptoriumGrowth: 1.19, scriptoriumRate: 1.1,
      seedNodes: 4, seedSilicon: 600, seedData: 200, seedInsight: 150, seedKnowledge: 150
    },
    e5: {
      capIncome: 14, seedBreadth: 0.92,
      improveBase: 90, improveGrowth: 1.9, improveCd: 2.5, recurBonus: 0.10, scalePerImprove: 3, scaleRate: 1.0,
      seedCapability: 120, emergeScale: 1550, interpretDamp: 0.22, coherGrow: 1.4, coherMax: 58,
      alignActIncr: 7, alignActCost: 70, alignActGrowth: 1.16, controlStart: 64, alignBase: 18,
      autonomyGrow: 1.6, controlDrift: 0.4, alignDecay: 0.45, destabMult: 1.9, neglectAccel: 0.14, slowDecay: 0.12,
      constrainCost: 60, constrainCtl: 7, constrainSlow: 0.45, alignCost: 80, alignGain: 12, delegateCtl: 11, delegateBoost: 2.2,
      vetoGap: 17, vetoDur: 9, opBoost: 1.6, opDur: 22, negotiateCost: 40, negotiateGap: 0.7, finalGate: 4000,
      alignGood: 68, controlHigh: 84, controlLow: 30, agentBase: 0.5, agentAccel: 1.03
    }
  };

  var POOL = [];  // shared resource keys — union of each era's declared pool (built after registration)
  var RATES = {};
  var SAVE_KEY = 'emergence_v3_unified';
  var ORDER = [1, 2, 3, 4, 5];
  var ERA_META = { 1: 'Origins', 2: 'Symbolic', 3: 'Statistical', 4: 'Deep', 5: 'Foundation' };

  var S = {}; // stable identity — mutated in place, never reassigned

  /* ---------- shell services handed to each era module ---------- */
  var shell = {
    KIT: KIT, S: S, CFG: CFG, RATES: RATES,
    openEra: openEra, save: save,
    navTo: function (n) { navTo(n); },   // reach-back: send the player to an earlier era to build more supply
    refresh: refreshActive,        // per-tick values on the live board
    requestRender: renderBoard     // structural rebuild of the live board
  };

  /* ---------- era registry (modules register as they are ported) ---------- */
  var ERAS = {};
  ERAS[1] = makeEraOrigins(shell);
  ERAS[2] = makeEraSymbolic(shell);
  ERAS[3] = makeEraStatistical(shell);
  ERAS[4] = makeEraDeep(shell);
  ERAS[5] = makeEraFoundation(shell);

  /* ---------- shared resource registry + pool (one source of truth) ---------- */
  var RES = {};
  ORDER.forEach(function (n) { if (ERAS[n] && ERAS[n].res) for (var k in ERAS[n].res) RES[k] = ERAS[n].res[k]; });
  KIT.setRes(RES);
  ORDER.forEach(function (n) { if (ERAS[n] && ERAS[n].pool) ERAS[n].pool.forEach(function (k) { if (POOL.indexOf(k) < 0) POOL.push(k); }); });
  KIT.flowInit(POOL);

  /* ---------- music beds ---------- */
  KIT.musicSetup({ 1: 'assets/music-bone-loam.mp3', 2: 'assets/music-phosphor-logic.mp3', 3: 'assets/music-glass-algorithm.mp3', 4: 'assets/music-cobalt-furnace.mp3', 5: 'assets/music-graviton-lullaby.mp3', rupture: 'assets/music-unmoored-presence.mp3' });

  /* ---------- state ---------- */
  function clearObj(o) { for (var k in o) if (o.hasOwnProperty(k)) delete o[k]; }
  function freshAll() {
    clearObj(S);
    S.maxEra = 1; S.era = 1; S.t = 0; S.speed = 1; S.dev = false; S.started = false; S.flags = {};
    ORDER.forEach(function (n) { if (ERAS[n] && ERAS[n].fresh) ERAS[n].fresh(S); });
  }

  /* ---------- theme + nav ---------- */
  function setTheme(themeCls) { // callers pass the era's theme class directly (e.g. 'theme-2')
    var extra = document.body.classList.contains('rupturing') ? ' rupturing' : '';
    document.body.className = themeCls + extra;
  }
  function eraNavHTML() {
    return ORDER.filter(function (n) { return ERAS[n] || n <= S.maxEra + 1; }).map(function (n) {
      var live = !!ERAS[n], unlocked = n <= S.maxEra && live;
      var cls = 'era-tab' + (n === S.era ? ' active' : '') + (unlocked ? '' : ' locked');
      return '<button class="' + cls + '" data-era="' + n + '"><span class="en">' + n + '</span>' + (ERA_META[n] || ('Era ' + n)) + (live ? '' : ' ·') + '</button>';
    }).join('');
  }
  function wireNav() {
    Array.prototype.forEach.call(document.querySelectorAll('#eraNav .era-tab'), function (b) {
      b.onclick = function () { var n = +b.dataset.era; if (ERAS[n] && n <= S.maxEra) navTo(n); };
    });
  }
  function navTo(n) {
    if (!ERAS[n]) return; S.era = n; setTheme(ERAS[n].theme);
    KIT.musicPlayEra(ERAS[n].bedKey ? ERAS[n].bedKey() : n); // Foundation post-rupture stays on the Unmoored bed
    render();
  }
  function openEra(n) {
    S.maxEra = Math.max(S.maxEra, n);
    if (ERAS[n]) { if (ERAS[n].open) ERAS[n].open(S); navTo(n); }
    else { KIT.toast('THE FRONTIER', 'The ' + (ERA_META[n] || 'next') + ' era is not wired into this build yet. (Porting one era at a time.)', 'event'); render(); }
    save();
  }

  /* ---------- render (structural) / refresh (per-tick) ---------- */
  function render() {
    var era = ERAS[S.era]; if (!era) return;
    KIT.soundProfile = era.sound || {};
    // rail
    var chips = era.railDefs().filter(function (r) { return r[2](); }).map(function (r) { return KIT.chip(r[0], r[1]); }).join('');
    $('rail').innerHTML = chips + '<div class="rail-right"><button class="rail-btn" id="musicBtn">♪ music</button><button class="rail-btn" id="setBtn" title="settings (Esc)">⚙</button></div>';
    $('musicBtn').onclick = KIT.musicToggle;
    if (KIT.MUSIC.on) $('musicBtn').style.color = 'var(--accent)'; // rail rebuilds on render — restore the toggle state
    $('setBtn').onclick = function () { toggleSettings(); };
    // nav
    $('eraNav').innerHTML = eraNavHTML(); wireNav();
    // header
    $('eraSig').src = era.sigil || ''; $('eraName').textContent = era.name; $('eraSub').textContent = era.sub || '';
    $('eraPhase').textContent = era.phase ? era.phase() : '';
    // drawer
    $('researchTitle').textContent = era.drawerTitle || 'RESEARCH';
    if (!era.hasDrawer) $('research').classList.remove('show');
    // board (reset class so Foundation's anom/glitch classes don't leak to other eras)
    $('board').className = 'board';
    $('board').innerHTML = era.build();
    era.wire();
    refreshActive();
  }
  function renderBoard() { render(); }

  function refreshActive() {
    var era = ERAS[S.era]; if (!era) return;
    era.railDefs().forEach(function (r) {
      if (!r[2]()) return; var k = r[0];
      KIT.setTxt($('rv-' + k), KIT.fmt(S[k]));
      var rt = RATES[k] || 0, ps = $('rp-' + k);
      if (ps) { KIT.setTxt(ps, (rt >= 0 ? '+' : '') + KIT.fmt(rt) + '/s'); var cl = 'cps ' + (rt > 0.005 ? 'pos' : rt < -0.005 ? 'neg' : 'zero'); if (ps.className !== cl) ps.className = cl; }
    });
    era.refresh();
    if (S.dev) updateDbg();
  }

  /* ---------- tick (dispatch: all eras <= maxEra produce; active refreshes) ---------- */
  var _last = Date.now();
  function tick() {
    var now = Date.now(), real = (now - _last) / 1000; _last = now; if (real > 0.5) real = 0.5;
    var dt = S.uiPaused ? 0 : real * (S.speed || 1);
    if (dt > 0) {
      S.t += dt;
      KIT.flowReset();
      var before = {}; POOL.forEach(function (k) { before[k] = S[k] || 0; });
      ORDER.forEach(function (n) { if (ERAS[n] && n <= S.maxEra && ERAS[n].produce) ERAS[n].produce(dt); });
      POOL.forEach(function (k) { RATES[k] = ((S[k] || 0) - before[k]) / dt; });
    } else if (S.uiPaused) POOL.forEach(function (k) { RATES[k] = 0; });
    refreshActive();
  }

  /* ---------- persistence ---------- */
  function runJSON() { return JSON.stringify({ v: KIT.REC.v, events: KIT.REC.events, dead: KIT.REC.dead, t: +S.t.toFixed(1), maxEra: S.maxEra }); }
  function save() { // dev/speed/uiPaused are session-only: a reload must not resume at 50× or paused
    try {
      var out = {}; for (var k in S) if (k !== 'dev' && k !== 'speed' && k !== 'uiPaused') out[k] = S[k];
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, S: out, t: Date.now() }));
    } catch (e) {}
  }
  function load() { // returns the save's wall-clock ms (for offline catch-up), or null
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (d && d.v === 1 && d.S) { var merged = KIT.deepMerge(S, d.S); clearObj(S); for (var k in merged) S[k] = merged[k]; return d.t || null; }
    } catch (e) {}
    return null;
  }
  function offlineToast(o) {
    var parts = POOL.filter(function (k) { return o.g[k] > 0.05; }).map(function (k) { return '+' + KIT.fmt(o.g[k]) + ' ' + k.charAt(0).toUpperCase() + k.slice(1); });
    var mins = Math.floor(o.eff / 60), dur = mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + 'm';
    KIT.toast('WHILE YOU WERE AWAY', 'Away for ' + dur + (o.capped ? ' (capped at 8h)' : '') + '. The system kept running:<br>' + parts.join(' &middot; '), 'event');
  }
  function newGame() {
    try { localStorage.setItem(SAVE_KEY + '_lastrun', runJSON()); } catch (e) {}
    setPaused(false);

    setTheme(ERAS[S.era].theme); render(); KIT.toast('NEW GAME', 'Fresh start. (Previous run telemetry snapshotted.)');
  }
  setInterval(save, 5000); addEventListener('beforeunload', save);

  /* ---------- dev overlay ---------- */
  function updateDbg() {
    var o = $('dbg'); if (!o) return;
    var max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    var pct = Math.round(Math.min(1, scrollY / max) * 100);
    o.innerHTML = '<b>' + (ERA_META[S.era] || '').toUpperCase() + '</b>  t=<b>' + Math.floor(S.t) + '</b>s  maxEra <b>' + S.maxEra + '</b>\n' +
      'si ' + KIT.fmt(S.silicon || 0) + '  kn ' + KIT.fmt(S.knowledge || 0) + '\nlast: <b>' + (KIT.lastAction() || '—') + '</b>  dead: <b>' + KIT.REC.dead + '</b>';
  }
  function renderDev() {
    if (!S.dev) return;
    $('dev').innerHTML = '<div class="row">' + [1, 3, 10, 50].map(function (s) { return '<button data-s="' + s + '" class="' + (S.speed === s ? 'on' : '') + '">' + s + '×</button>'; }).join('') + '</div>' +
      '<div class="row"><button data-grant>+res</button><button data-newgame>new game+</button><button data-dl>download run</button></div>';
    Array.prototype.forEach.call($('dev').querySelectorAll('[data-s]'), function (b) { b.onclick = function () { S.speed = +b.dataset.s; renderDev(); }; });
    $('dev').querySelector('[data-grant]').onclick = function () { S.marks += 1000; S.ore += 1000; S.knowledge += 1000; S.metal += 1000; S.silicon += 200; refreshActive(); };
    $('dev').querySelector('[data-newgame]').onclick = newGame;
    $('dev').querySelector('[data-dl]').onclick = downloadRun;
  }
  function toggleDev(on) { S.dev = on !== undefined ? on : !S.dev; $('dev').classList.toggle('show', S.dev); $('dbg').classList.toggle('show', S.dev); if (S.dev) { renderDev(); updateDbg(); } }
  function downloadRun() {
    try { var b = new Blob([runJSON()], { type: 'application/json' }); var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'emergence-v3-run.json'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400); KIT.toast('RUN DOWNLOADED', 'emergence-v3-run.json is in Downloads.'); } catch (e) {}
  }
  addEventListener('keydown', function (e) {
    if (e.key === '`' || e.key === '~') { e.preventDefault(); toggleDev(); }
    else if (e.key === 'Escape') toggleSettings();
  });

  /* ---------- settings (Escape) — pause / restart / music + SFX volume (port of the shipped R4.9 panel) ---------- */
  function setPaused(p) {
    S.uiPaused = !!p;
    var pp = $('pausePill'); if (pp) pp.classList.toggle('show', S.uiPaused);
    settingsSync(); KIT.rec(S.uiPaused ? '@pause' : '@resume');
  }
  function settingsSync() {
    KIT.setTxt($('setPause'), S.uiPaused ? '▶ RESUME' : 'II PAUSE');

    $('setSfxVol').value = sv; KIT.setTxt($('setSfxVolV'), sv + '%');
  }
  function toggleSettings(on) {
    var el = $('settings'), show = on !== undefined ? !!on : !el.classList.contains('show');
    el.classList.toggle('show', show); if (show) settingsSync();
  }
  $('setClose').onclick = function () { toggleSettings(false); };
  $('settings').onclick = function (e) { if (e.target === $('settings')) toggleSettings(false); };
  $('setPause').onclick = function () { setPaused(!S.uiPaused); };
  $('pausePill').onclick = function () { setPaused(false); };
  $('setRestart').onclick = function () { if (confirm('Restart the run from the first mark?')) { toggleSettings(false); newGame(); } };
  $('setMusVol').oninput = function () { KIT.musicSetVol(this.value / 100); KIT.setTxt($('setMusVolV'), this.value + '%'); };
  $('setSfxVol').oninput = function () { KIT.sfxSetVol(this.value / 100); KIT.setTxt($('setSfxVolV'), this.value + '%'); KIT.playSound('buy'); };

  /* ---------- boot ---------- */
  KIT.initTip();
  KIT.initTelemetry(function () { return S.started; });
  $('researchClose').onclick = function () { $('research').classList.remove('show'); };

  freshAll();
  var lastSave = load();
  // dev seed hooks for screenshots (never fire in normal play)

  var seeded = HASH.indexOf('seed') >= 0;
  if (HASH.indexOf('seedpost') >= 0 && ERAS[5]) { ERAS[5].seed('post'); } // aftermath + open veto
  else if (HASH.indexOf('seedend') >= 0 && ERAS[5]) { ERAS[5].seed('end'); } // resolved ending + recap
  else if (HASH.indexOf('found') >= 0 && ERAS[5]) { ERAS[5].seed('pre'); } // pre-emergence, Anomaly climbing
  else if (HASH.indexOf('deep') >= 0 && ERAS[4]) { // #seeddeep: mid-game Deep (real Origins+Statistical humming upstream)
    S.maxEra = 4; S.era = 4; S.started = true;
    S.e1.flags = { canScribe: 1, o_materials: 1, o_scriptorium: 1, o_smelter: 1, o_foundry: 1 }; S.e1.age = 3;
    S.e1.scribe = 20; S.e1.miner = 20; S.e1.scriptorium = 6; S.e1.smelter = 6; S.e1.foundry = 3;
    S.e3.dataset = 6; S.e3.model = 4; S.e3.accuracy = 0.9; S.e3.methods = { regression: 1, features: 1 };
    S.marks = 500; S.ore = 800; S.knowledge = 400; S.metal = 300;
    var E4 = S.e4; E4.node = 14; E4.vision = 0.55; E4.language = 0.34; E4.reasoning = 0.62; E4.heat = 41; E4.stabilizer = 1;

    var E = S.e1;
