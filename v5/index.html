<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>EMERGENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital@0;1&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=Rajdhani:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="render/hud.css">
<style>
/* Origins stratum surfaces (WO-02). The HUD frame is render/hud.css; these are the pieces this
   stratum adds: the goal's age image, the commission card, the left-column controls, the research
   drawer and the floating yield. Palette arrives as the CSS custom properties hud.js sets. */

/* the goal wears the age it has reached: stone, bronze, silicon, then the machine */
.o-age { display: block; width: 76px; height: 76px; margin: 0 auto 5px; object-fit: contain; filter: drop-shadow(0 3px 9px rgba(0, 0, 0, 0.55)); }

/* the timed commission: beside the goal, under it, never over a button */
.comm {
  margin-top: 10px; padding: 10px 11px; border-radius: 13px;
  border: 1px solid var(--edge, #4a3720); background: var(--panel, #1c140c);
  opacity: 0; transform: translateY(-5px); pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
}
.comm.show { opacity: 1; transform: none; pointer-events: auto; border-color: var(--accent, #d6a85f); box-shadow: 0 0 22px rgba(214, 168, 95, 0.22); }
.cm-need { font-family: var(--mono, monospace); font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.cm-need b { font-size: 23px; font-weight: 600; }
.cm-name { font-family: var(--era-font, serif); font-size: 11.5px; color: var(--dim, #b6a583); margin: 3px 0 4px; }
.cm-rew { font-family: var(--mono, monospace); font-size: 11px; color: var(--good, #8fd39a); }
.cm-bar { height: 5px; margin: 8px 0; border-radius: 3px; background: rgba(0, 0, 0, 0.5); overflow: hidden; }
.cm-bar i { display: block; height: 100%; background: var(--accent, #d6a85f); }
.cm-acts { display: flex; gap: 6px; }
.cm-acts .buy { flex: 1; }

/* the left column below the verbs: research, the hands lever, refine */
.o-side { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
.side-btn {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border-radius: 11px; cursor: pointer;
  font-family: var(--era-font, serif); font-size: 12px; letter-spacing: 0.1em; color: var(--text, #eadfce);
  background: var(--panel-2, #231910); border: 1px solid var(--edge, #4a3720);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.side-btn:hover { border-color: var(--accent, #d6a85f); }
.sb-n { min-width: 21px; padding: 1px 5px; border-radius: 6px; text-align: center; font-family: var(--mono, monospace); font-size: 11px; color: var(--dimmer, #7d6f56); border: 1px solid var(--line, #3a2a17); }
.sb-n.hot { color: #14100a; background: var(--accent, #d6a85f); border-color: var(--accent, #d6a85f); }
.ctl { padding: 8px 10px 9px; border-radius: 11px; border: 1px solid var(--line, #3a2a17); background: rgba(0, 0, 0, 0.24); }
.ctl-lab { font-family: var(--era-font, serif); font-size: 9.5px; letter-spacing: 0.13em; color: var(--dimmer, #7d6f56); margin-bottom: 6px; }
.lev { display: flex; align-items: center; gap: 6px; }
.lv-a, .lv-b { font-family: var(--mono, monospace); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 40px; }
.lv-b { text-align: right; }
.lv-s { flex: 1; height: 14px; accent-color: var(--accent, #d6a85f); cursor: pointer; }
.lev-tags { display: flex; justify-content: space-between; margin-top: 3px; }
.lt { font-family: var(--era-font, serif); font-size: 8.5px; letter-spacing: 0.11em; color: var(--dimmer, #7d6f56); }
.ref-row { display: flex; align-items: center; gap: 7px; }
.ref-eff { flex: 1; font-family: var(--mono, monospace); font-size: 11.5px; color: var(--good, #8fd39a); }
.ref-buy { flex: none; min-width: 86px; }

/* the research drawer: one tile per discovery, revealed along its chain */
.drawer {
  position: fixed; left: 248px; top: 68px; width: 498px; max-height: calc(100vh - 96px); z-index: 40;
  display: flex; flex-direction: column; border-radius: 14px;
  background: var(--tip-bg, rgba(14, 10, 6, 0.97)); border: 1px solid var(--edge, #4a3720);
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.62);
  opacity: 0; transform: translateX(-16px); pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease;
}
.drawer.show { opacity: 1; transform: none; pointer-events: auto; }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-bottom: 1px solid var(--line, #3a2a17); }
.dr-t { flex: 1; font-family: var(--era-font, serif); font-size: 12px; letter-spacing: 0.16em; color: var(--accent, #d6a85f); }
.dr-n { font-family: var(--mono, monospace); font-size: 11.5px; color: var(--dim, #b6a583); }
.dr-x { padding: 0 3px; border: none; background: none; color: var(--dimmer, #7d6f56); font-size: 13px; cursor: pointer; }
.dr-x:hover { color: var(--text, #eadfce); }
.dr-body { padding: 11px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; align-content: start; }
.d-tile { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px 10px; border-radius: 11px; border: 1px solid var(--line, #3a2a17); background: var(--panel, #1c140c); }
.d-cost { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-c { font-family: var(--mono, monospace); font-size: 13px; font-variant-numeric: tabular-nums; opacity: 0.4; }
.chip-c.met { opacity: 1; }
.chip-c.hold { border-bottom: 1px dotted currentColor; }
.d-name { font-family: var(--era-font, serif); font-size: 13px; }
.d-mech { min-height: 30px; font-size: 11.5px; line-height: 1.28; color: var(--dim, #b6a583); }
.d-buy { margin-top: 4px; }

/* the yield leaves the button when you press it */
.floats { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.flt { position: absolute; font-family: var(--mono, monospace); font-size: 16px; font-weight: 600; text-shadow: 0 2px 7px rgba(0, 0, 0, 0.75); animation: fltUp 0.85s ease-out forwards; }
@keyframes fltUp { 0% { opacity: 0; transform: translateY(0) scale(0.92); } 18% { opacity: 1; } 100% { opacity: 0; transform: translateY(-44px) scale(1.06); } }
@keyframes fltFade { 0% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .flt { animation: fltFade 0.5s linear forwards; }
  .comm, .drawer { transition: none; }
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"></div>
<script type="module" src="app.js"></script>
</body>
</html>
