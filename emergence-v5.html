<style>
/* ==== inlined render/hud.css ==== */
/* render/hud.css: the fixed HUD frame over the world canvas (WO-01).
   The plate / verb / goal / chip look is carried from v4-kit/kit.css; the layout is new:
   the HUD is fixed to the viewport, the world pans under it, and the page never scrolls.
   Palette comes in as CSS custom properties set by hud.js applyPalette(). */

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04030a; }
* { box-sizing: border-box; }

#world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#world:active { cursor: grabbing; }

.hud {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  color: var(--text, #eadfce); font-family: var(--body-font, Georgia, serif); font-size: 14px; line-height: 1.35;
  transition: opacity 0.35s ease;
}
.hud > * { pointer-events: auto; }
.hud.over { opacity: 0; pointer-events: none; }
.hud.over > * { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .hud { transition: none; } }

/* ---------- rail: one chip per live resource, value + rate ---------- */
.rail {
  position: absolute; top: 0; left: 0; right: 0; height: 54px;
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--rail-bg, rgba(10, 8, 6, 0.84)); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line, #3a2a17);
}
.rail-res { display: flex; gap: 8px; align-items: stretch; flex-wrap: nowrap; overflow: hidden; }
.rail-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 5px 9px 5px 6px; border-radius: 10px;
  border: 1px solid var(--line, #3a2a17); background: var(--panel, #1c140c); min-width: 124px; flex: none;
}
.chip .cdot { width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center; }
.chip .cglyph { font-size: 15px; line-height: 1; }
.chip .cbody { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; flex: 1; }
.chip .clab { font-family: var(--era-font, serif); font-size: 8.5px; letter-spacing: 0.1em; color: var(--dim, #b6a583); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .cval { font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 600; }
.chip .cps { font-size: 10.5px; font-variant-numeric: tabular-nums; margin-left: 8px; align-self: flex-start; white-space: nowrap; flex: none; }
.cps.pos { color: var(--good, #8fd39a); } .cps.neg { color: var(--danger, #d98a6a); } .cps.zero { color: var(--dimmer, #7d6f56); }
.rail-btn {
  font-family: var(--era-font, serif); font-size: 11px; letter-spacing: 0.1em; color: var(--dim, #b6a583);
  background: var(--panel, #1c140c); border: 1px solid var(--line, #3a2a17); border-radius: 8px; padding: 7px 11px; cursor: pointer;
}
.rail-btn:hover { border-color: var(--accent, #d6a85f); color: var(--text, #eadfce); }

/* ---------- the two fixed columns: verbs left, goal right; the world field runs between them ---------- */
.cols { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; pointer-events: none; }
.col { position: absolute; top: 14px; width: 220px; pointer-events: auto; }
.col.verbs { left: 14px; }
.col.goal-col { right: 14px; width: 232px; }
.col-head {
  font-family: var(--era-font, serif); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--dimmer, #7d6f56); margin: 0 0 7px 2px;
}
.verb-list { display: flex; flex-direction: column; gap: 8px; }

/* verbs: big primary actions, yield first */
.verb {
  width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
  padding: 11px 13px; border-radius: 12px; cursor: pointer; color: var(--text, #eadfce);
  font-family: var(--era-font, serif); letter-spacing: 0.05em; border: 1px solid var(--edge, #4a3720);
  background-image: linear-gradient(180deg, var(--verb-a, #2a2018), var(--verb-b, #161009));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 2px 6px rgba(0, 0, 0, 0.42);
  position: relative;
}
.verb:hover:not(:disabled) { border-color: var(--accent, #d6a85f); }
.verb:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 3px 9px rgba(0, 0, 0, 0.5); }
.verb:disabled { opacity: 0.42; cursor: not-allowed; }
.verb .vyield { font-size: 15px; font-family: var(--mono, monospace); font-variant-numeric: tabular-nums; color: var(--accent, #d6a85f); }
.verb .vname { font-size: 15px; }
.verb .vkey { position: absolute; top: 8px; right: 10px; font-family: var(--mono, monospace); font-size: 10px; opacity: 0.5; letter-spacing: 0.1em; }

/* ---------- goal: a meter that wakes in the NEXT stratum's hue ---------- */
.goal {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0.52));
  border: 1px solid var(--edge, #4a3720); border-radius: 14px; padding: 13px; text-align: center;
  transition: border-color 0.4s, box-shadow 0.4s;
  box-shadow: 0 0 calc(26px * var(--wake, 0)) color-mix(in srgb, var(--tease, #7dffb7) calc(var(--wake, 0) * 70%), transparent);
}
.goal .gname { font-family: var(--era-font, serif); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim, #b6a583); }
.goal .gval { font-size: 38px; font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1.15; }
.meter { height: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5); }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent, #d6a85f), var(--tease, #fff)); transition: width 0.25s; }
.meter-lab { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--dim, #b6a583); margin: 6px 0 11px; min-height: 16px; }
.fab {
  width: 100%; font-family: var(--era-font, serif); font-size: 13px; letter-spacing: 0.06em; padding: 13px; border-radius: 11px; cursor: pointer;
  color: #0e1513; border: 1px solid var(--tease, #fff);
  background: linear-gradient(180deg, var(--tease, #bfeae0), color-mix(in srgb, var(--tease, #7fc9bb) 68%, #000));
  box-shadow: 0 0 18px var(--tease, #7dffb7);
}
.fab:disabled { opacity: 0.32; cursor: not-allowed; box-shadow: none; filter: grayscale(0.45); }
.goal.ready { border-color: var(--tease, #fff); box-shadow: 0 0 28px var(--tease, #7dffb7); }
.goal.ready .gname { color: var(--tease, #fff); }
.goal.ready .fab { animation: fabPulse 1.5s ease-in-out infinite; }
@keyframes fabPulse { 0%, 100% { box-shadow: 0 0 14px var(--tease, #7dffb7); } 50% { box-shadow: 0 0 30px var(--tease, #7dffb7); } }
@media (prefers-reduced-motion: reduce) { .goal.ready .fab { animation: none; } .meter i { transition: none; } }

/* ---------- plates: the DOM half of a node, anchored to world coordinates ---------- */
.plate-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.plate {
  position: absolute; top: 0; left: 0; width: 176px; pointer-events: auto;
  padding: 6px 8px 7px; border-radius: 11px;
  border: 1px solid var(--line, #3a2a17); background: var(--panel, #1c140c);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 3px 10px rgba(0, 0, 0, 0.5);
  will-change: transform;
}
.plate.can { border-color: var(--accent, #d6a85f); }
.plate.starved { border-color: var(--danger, #d98a6a); box-shadow: 0 0 14px color-mix(in srgb, var(--danger, #d98a6a) 45%, transparent); }
.plate.held { opacity: 0.62; border-style: dashed; }
.plate .p-head { display: flex; align-items: baseline; gap: 7px; }
.plate .p-rate { font-family: var(--mono, monospace); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
.plate .p-name { font-family: var(--era-font, serif); font-size: 11.5px; color: var(--dim, #b6a583); letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.plate .p-sub { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-family: var(--mono, monospace); font-size: 11px; color: var(--dimmer, #7d6f56); font-variant-numeric: tabular-nums; margin: 1px 0 6px; min-height: 14px; white-space: nowrap; }
.plate .p-res { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.plate .p-count { color: var(--accent, #d6a85f); }
.plate .p-io { margin-left: auto; white-space: nowrap; }   /* a number is never truncated: with two inputs the list wraps to its own line */
.plate .p-row { display: flex; gap: 6px; align-items: center; }
.mpip {
  font-family: var(--mono, monospace); font-size: 9px; letter-spacing: 0.04em; color: var(--dimmer, #7d6f56);
  margin-left: auto; padding: 1px 5px; border: 1px solid var(--line, #3a2a17); border-radius: 6px; cursor: help;
}
.mpip.tiered { color: var(--good, #8fd39a); }
.mpip.near { color: var(--accent, #d6a85f); border-color: var(--accent, #d6a85f); }
.buy {
  flex: 1; font-family: var(--era-font, serif); font-size: 10.5px; letter-spacing: 0.02em; padding: 7px 8px; border-radius: 9px; cursor: pointer;
  background: var(--panel-2, #231910); border: 1px solid var(--edge, #4a3720); color: var(--text, #eadfce); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.3);
}
.buy:hover:not(:disabled) { border-color: var(--accent, #d6a85f); }
.buy:active:not(:disabled) { transform: translateY(1px); }
.buy:disabled { opacity: 0.42; cursor: not-allowed; box-shadow: none; }
.buy.ok { color: var(--good, #8fd39a); border-color: color-mix(in srgb, var(--good, #8fd39a) 50%, transparent); }
.pause {
  flex: none; width: 24px; height: 30px; border-radius: 7px; border: 1px solid var(--line, #3a2a17);
  background: rgba(0, 0, 0, 0.3); color: var(--dimmer, #7d6f56); cursor: pointer; font-size: 8px; padding: 0;
}
.pause.on { color: var(--danger, #d98a6a); border-color: var(--danger, #d98a6a); }

/* ---------- toasts: top-right, under the rail, never over a button ---------- */
.toasts { position: absolute; top: 64px; right: 262px; width: 250px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.toast { background: var(--panel, #1c140c); border: 1px solid var(--accent, #d6a85f); border-radius: 11px; padding: 10px 12px; animation: toastIn 0.35s ease; }
.toast.event { border-color: var(--tease, #7dffb7); }
.toast-h { font-family: var(--era-font, serif); font-size: 11px; letter-spacing: 0.08em; color: var(--accent, #d6a85f); margin-bottom: 3px; }
.toast .tb { font-size: 12.5px; color: var(--text, #eadfce); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ---------- tooltip: detail on demand, never the only place a signifier lives ---------- */
#tip {
  position: fixed; z-index: 70; max-width: 300px; padding: 9px 11px; border-radius: 9px;
  background: var(--tip-bg, rgba(14, 10, 6, 0.97)); border: 1px solid var(--line, #3a2a17);
  font-size: 12.5px; color: var(--text, #eadfce); opacity: 0; pointer-events: none; transition: opacity 0.14s;
}
#tip.show { opacity: 1; }
#tip i { color: var(--dim, #b6a583); } #tip b { color: var(--accent, #d6a85f); }

/* ==== inlined render/eras/endcard.css ==== */
/* render/eras/endcard.css — the endcard, over the overview (WO-08). The column stays visible behind it. */
.ecd {
  position: fixed; inset: 0; z-index: 120; display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; overscroll-behavior: contain; padding: 0;
  background: radial-gradient(120% 90% at 50% 0%, rgba(18,12,30,0.82) 0%, rgba(5,3,10,0.93) 66%, rgba(3,2,6,0.97) 100%);
  color: #f4efff; font-family: 'Inter', system-ui, sans-serif;
  opacity: 0; transition: opacity 0.62s ease;
}
.ecd.show { opacity: 1; }
.ecd-col { width: 100%; max-width: 880px; padding: 26px 26px 30px; display: flex; flex-direction: column; gap: 14px; }

.ecd-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.ecd-sig { font-size: 26px; line-height: 1; color: #b78bff; text-shadow: 0 0 24px currentColor; }
.ecd-title { font-size: 30px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.1; }
.ecd-body { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; color: #a494c4; }

.ecd-ep { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 4px; border-top: 1px solid #2a1f3d; }
.ecd-ep div { font-size: 14.5px; line-height: 1.5; color: #d3c8e8; opacity: 0; animation: ecdIn 0.8s ease forwards; }
@keyframes ecdIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.ecd-built { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.04em; color: #8b7cad; }

.ecd-recap { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: start;
  padding: 13px 15px; border-radius: 13px; border: 1px solid #2a1f3d; background: rgba(12,8,22,0.66); }
.ecd-grade { display: grid; place-items: center; gap: 3px; }
.ecd-g { width: 74px; height: 74px; border-radius: 18px; display: grid; place-items: center;
  font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 38px; color: #06040c;
  background: var(--gh, #b78bff); box-shadow: 0 0 26px rgba(183,139,255,0.35); }
.ecd-q { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #c9adf5; font-variant-numeric: tabular-nums; }
.ecd-read { font-size: 12.5px; line-height: 1.45; color: #a494c4; text-align: center; }

.ecd-rows { display: flex; flex-direction: column; gap: 2px; }
.ecd-row { display: grid; grid-template-columns: 1fr 74px 74px; gap: 8px; align-items: center;
  padding: 4px 8px; border-radius: 7px; border-left: 3px solid var(--hue, #b78bff); background: rgba(255,255,255,0.02); }
.ecd-row span { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ecd-row .ecd-era { color: #d7ccec; letter-spacing: 0.1em; font-size: 11px; }
.ecd-row .ecd-took { color: #f4efff; text-align: right; }
.ecd-row .ecd-at { color: #8b7cad; text-align: right; }
.ecd-row.ecd-hd { border-left-color: transparent; background: none; }
.ecd-row.ecd-hd span { color: #6d5f8a; font-size: 10px; letter-spacing: 0.22em; }
.ecd-meters { display: flex; gap: 14px; flex-wrap: wrap; padding-top: 7px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; }

.ecd-foot { display: flex; gap: 12px; align-items: center; padding-top: 4px; }
.ecd-btn { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.18em;
  color: #f4efff; padding: 12px 20px; border-radius: 11px; cursor: pointer;
  background: linear-gradient(#241a3a, #120c1e); border: 1px solid #4a3a6e;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
.ecd-btn:hover { border-color: #b78bff; box-shadow: 0 0 18px rgba(183,139,255,0.24); }
.ecd-btn.ecd-again { background: linear-gradient(#3a2a5e, #1a1230); border-color: #6a55a0; }

@media (max-width: 900px) {
  .ecd-col { padding: 16px 14px 22px; gap: 11px; }
  .ecd-title { font-size: 23px; }
  .ecd-recap { grid-template-columns: 1fr; gap: 11px; }
  .ecd-row { grid-template-columns: 1fr 62px 62px; }
  .ecd-foot { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .ecd { transition: none; }
  .ecd-ep div { animation: none; opacity: 1; }
}

/* ==== inlined render/eras/foundation.css ==== */
/* render/eras/foundation.css (WO-06) — the Foundation stratum's surfaces: the window the machine speaks
   through (anchored in the world, because it speaks from the stratum), the Anomaly band, and the capability
   tiles. The turn's own chrome (the wash, the sixth key, body.operated) lives in render/fx.js.
   Loaded by app.js by convention. */

/* the left column below the verbs */
.f-side { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }

/* the world-anchored layer: it rides the camera the way the plates do */
.f-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.f-layer > * { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }

/* the window it speaks through: sitting in the stratum, at the centre of the field */
.fb-card {
  width: 480px; padding: 13px 15px 14px; border-radius: 15px;
  border: 1px solid var(--line, #382a52);
  background: color-mix(in srgb, var(--panel, #160f24) 92%, transparent);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  display: flex; flex-direction: column; gap: 9px;
  transition: border-color 0.25s ease, box-shadow 0.4s ease;
}
.fb-card.live { border-color: var(--accent, #b78bff); box-shadow: 0 0 34px rgba(183, 139, 255, 0.26), 0 18px 48px rgba(0, 0, 0, 0.55); }
.fb-h { display: flex; align-items: baseline; gap: 8px; }
.fb-tag { flex: 1; font-family: var(--mono, monospace); font-size: 10px; letter-spacing: 0.2em; }
.fb-c { font-family: var(--mono, monospace); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--dimmer, #7c6a99); }
.fb-t {
  min-height: 44px; font-family: var(--mono, monospace); font-size: 15px; line-height: 1.42;
  color: var(--text, #e6dbf6);
}
.fb-bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.fb-bar i { display: block; height: 100%; background: var(--accent, #b78bff); }
.fb-row { display: flex; gap: 9px; }
.fb-b {
  flex: 1; padding: 9px 0; border-radius: 10px; cursor: pointer; line-height: 1;
  font-family: var(--mono, monospace); font-size: 11.5px; letter-spacing: 0.14em;
  border: 1px solid var(--line, #382a52); background: var(--panel-2, #1d1430); color: var(--text, #e6dbf6);
}
.fb-b.yes:hover:not(:disabled) { border-color: var(--good, #7fe6c4); color: var(--good, #7fe6c4); }
.fb-b.no:hover:not(:disabled) { border-color: var(--danger, #ff7a8e); color: var(--danger, #ff7a8e); }
.fb-b:disabled { opacity: 0.28; cursor: not-allowed; }

/* the Anomaly: a band and a bar, never a number */
.f-anom { margin-bottom: 8px; text-align: left; }
.f-anom-l { font-family: var(--mono, monospace); font-size: 9.5px; letter-spacing: 0.18em; color: var(--dimmer, #7c6a99); }
.f-anom-v { font-family: var(--era-font, sans-serif); font-size: 17px; letter-spacing: 0.1em; line-height: 1.2; }
.f-anom-b { height: 5px; margin-top: 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.f-anom-b i { display: block; height: 100%; transition: width 0.3s linear; }
.f-coher { margin-top: 5px; font-family: var(--mono, monospace); font-size: 10.5px; color: var(--dim, #b29ad0); }

/* the capability tiles inside the shared drawer frame */
.c-tile { display: flex; gap: 9px; padding: 9px 10px; border-radius: 11px; border: 1px solid var(--line, #382a52); background: var(--panel, #160f24); }
.c-tile.can { border-color: color-mix(in srgb, var(--good, #7fe6c4) 55%, transparent); }
.c-tile.owned { opacity: 0.6; }
.c-g { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; border: 1px solid currentColor; }
.c-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.c-n { font-family: var(--era-font, sans-serif); font-size: 12.5px; }
.c-e { font-family: var(--mono, monospace); font-size: 10.5px; color: var(--dim, #b29ad0); min-height: 26px; line-height: 1.24; }

/* it presses your own buttons before it is awake */
.verb.agent-press { border-color: var(--tease, #ffffff); box-shadow: 0 0 0 1px var(--tease, #fff), 0 0 26px rgba(255, 255, 255, 0.28); }

@media (prefers-reduced-motion: reduce) {
  .fb-card, .f-anom-b i { transition: none; }
}

/* ==== inlined render/eras/mirror.css ==== */
/* render/eras/mirror.css (WO-07) — the mirror: one big button, two bars, one card, one voice.
   Desktop 1280x800 (SPEC refuses a mobile layout); everything is fixed, so the page never scrolls.
   Loaded by app.js by convention. */

/* ---------- the one button that is still yours ---------- */
.verb.mr-verb {
  padding: 20px 15px 15px;
  border-color: var(--tease, #b78bff);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 26px rgba(183, 139, 255, 0.28);
}
.verb.mr-verb .vname { font-size: 21px; letter-spacing: 0.09em; }
.verb.mr-verb .vyield { font-size: 13px; color: var(--tease, #b78bff); }
.verb.mr-verb:disabled { box-shadow: none; }

.mr-pips { display: flex; gap: 7px; margin-top: 9px; }
.mr-pip {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1px solid var(--dimmer, #6d5f8a); background: rgba(0, 0, 0, 0.4);
}
.mr-pip.on {
  border-color: var(--tease, #b78bff); background: var(--tease, #b78bff);
  box-shadow: 0 0 10px rgba(183, 139, 255, 0.75);
}

/* ---------- the goal column head: its name, the replay count, the two meters ---------- */
.mr-head { margin-bottom: 11px; text-align: left; }
.mr-name { font-family: var(--era-font, monospace); font-size: 25px; letter-spacing: 0.18em; color: var(--text, #f4efff); line-height: 1.1; }
.mr-sub { font-family: var(--mono, monospace); font-size: 10.5px; color: var(--dim, #a494c4); margin-top: 3px; }

.mr-bars { display: flex; flex-direction: column; gap: 7px; margin-top: 11px; }
.mr-bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
.mr-bk { font-family: var(--mono, monospace); font-size: 9.5px; letter-spacing: 0.18em; color: var(--dimmer, #6d5f8a); }
.mr-bv { font-family: var(--mono, monospace); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text, #f4efff); }
.mr-bt {
  grid-column: 1 / -1; height: 8px; border-radius: 5px; overflow: hidden;
  background: rgba(0, 0, 0, 0.5); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
}
.mr-bf { display: block; height: 100%; width: 0; transition: width 0.5s ease; }
.mr-bar:nth-child(1) .mr-bf { background: linear-gradient(90deg, #6ea8ff, #cfe2ff); }
.mr-bar:nth-child(2) .mr-bf { background: linear-gradient(90deg, #b78bff, #f0e2ff); }

/* ---------- the card: what it asks, and your three answers ---------- */
.mr-card {
  margin-top: 12px; padding: 11px 12px 12px; border-radius: 13px;
  border: 1px solid var(--tease, #b78bff); background: var(--panel, #0c0814);
  box-shadow: 0 0 30px rgba(183, 139, 255, 0.26);
  animation: mrCardIn 0.28s ease both;
}
.mr-ct { display: flex; align-items: baseline; gap: 8px; }
.mr-cw { font-family: var(--era-font, monospace); font-size: 12px; letter-spacing: 0.16em; color: var(--tease, #b78bff); }
.mr-cc { margin-left: auto; font-family: var(--mono, monospace); font-size: 11px; color: var(--dim, #a494c4); font-variant-numeric: tabular-nums; }
.mr-ask {
  font-family: var(--mono, monospace); font-size: 12.5px; line-height: 1.42; color: var(--text, #f4efff);
  margin: 7px 0 10px; min-height: 36px;
}
.mr-answers { display: flex; flex-direction: column; gap: 6px; }
.mr-ans {

/** createView({hud, world, sim, buy, assets}) -> { sync, onVerb, onGoal, toggleResearch } */
function createView(opts) {
  const hud = opts.hud, world = opts.world, sim = opts.sim, buy = opts.buy;
  const doc = hud.root.ownerDocument;
  const c = sim.cfg.e4;
  const E = () => sim.state.eras[4];
  const KEYS = c.domains.map((d) => d.k);
  const el = (cls, tag) => { const e = doc.createElement(tag || 'div'); if (cls) e.className = cls; return e; };
  const svg = (tag) => doc.createElementNS('http://www.w3.org/2000/svg', tag);
  const act = (a) => sim.apply(Object.assign({ era: 4 }, a));

  const style = doc.createElement('style');
  style.textContent = CSS;
  doc.head.appendChild(style);

  /* ---------- the rail: the banks, the bulk-buy mode and the zoom out ---------- */
  const bulk = el('rail-btn', 'button'), mapBtn = el('rail-btn', 'button');
  hud.railRight.appendChild(bulk); hud.railRight.appendChild(mapBtn);
  bulk.addEventListener('click', () => { const i = c.buyModes.indexOf(buy.n); buy.n = c.buyModes[(i + 1) % c.buyModes.length]; });
  mapBtn.addEventListener('click', () => { if (world.isOverview) world.lockTo(4, true); else world.overview(true); });

  /* ---------- the left column: the supply bus, the Hold lever, Architecture, the tools ---------- */
  const side = el('d-side');
  const supHead = el('d-head'); setTxt(supHead, 'SUPPLY');
  side.appendChild(supHead);
  const sups = {};
  for (const s of c.supply) {
    const b = el('d-sup', 'button');
    b.setAttribute('data-tip', s.tip);
    const g = el('sg'); setTxt(g, s.glyph);
    setStyle(g, 'color', resHue(s.out));
    setStyle(g, 'background', resHue(s.out) + '22');
    setStyle(g, 'border', '1px solid ' + resHue(s.out) + '55');
    const nm = el('sn'); setTxt(nm, s.name);
    const cnt = el('sc'), cost = el('sx'), out = el('so');
    b.appendChild(g); b.appendChild(nm); b.appendChild(cnt); b.appendChild(cost); b.appendChild(out);
    side.appendChild(b);
    b.addEventListener('click', () => act({ type: 'supply', key: s.key, n: buy.n }));
    sups[s.key] = { el: b, cnt, cost, out, def: s };
  }
  const hold = el('d-sup', 'button');
  hold.setAttribute('data-tip', '<b>Hold the crafts</b><br><i>Smelters and Foundries burn Knowledge, the same pool the Language run drinks from.</i><br>Hold pauses both. No Metal and no Silicon while held. Release any time.');
  const holdG = el('sg'); setStyle(holdG, 'color', resHue('knowledge'));
  setStyle(holdG, 'background', resHue('knowledge') + '22');
  setStyle(holdG, 'border', '1px solid ' + resHue('knowledge') + '55');
  const holdN = el('sn'); setTxt(holdN, 'Smelters + Foundries');
  const holdS = el('sc'), holdB = el('so');
  hold.appendChild(holdG); hold.appendChild(holdN); hold.appendChild(holdS); hold.appendChild(holdB);
  side.appendChild(hold);
  hold.addEventListener('click', () => act({ type: 'hold', on: !holdOn(sim) }));

  const steerHead = el('d-head'); setTxt(steerHead, 'STEERING');
  side.appendChild(steerHead);
  const archBtn = el('side-btn', 'button');
  archBtn.setAttribute('data-tip', '<b>Architecture</b><br><i>Seven upgrades, paid in Capability.</i><br>Each one bends the steering geometry. None of them is a flat bonus.');
  const archBadge = el('sb-n'), archLab = el('sb-l');
  archBtn.appendChild(archBadge); archBtn.appendChild(archLab);
  side.appendChild(archBtn);

  const tools = el('d-tools');
  const ckBtn = el('d-tool', 'button'), rsBtn = el('d-tool', 'button'), dsBtn = el('d-tool wide', 'button');
  const mkTool = (b, name, tip) => {
    b.setAttribute('data-tip', tip);
    const n = el('tn'); setTxt(n, name);
    const s = el('ts');
    b.appendChild(n); b.appendChild(s);
    return s;
  };
  const ckSub = mkTool(ckBtn, 'CHECKPOINT', '<b>Checkpoint</b><br><i>Save the weights.</i><br>Snapshots all three runs. Free.');
  const rsSub = mkTool(rsBtn, 'RESTORE', '<b>Restore</b><br><i>Roll back to the checkpoint.</i><br>Brings every run up to the saved figure. It never lowers one. Costs Capability, then cools.');
  const dsName = el('tn'), dsSub = el('ts');
  dsBtn.setAttribute('data-tip', '<b>Distill</b><br><i>Teach the small model what the big one knows.</i><br>Your highest run gives points, your lowest gains fewer. Breadth is a geometric mean, so it is usually worth it.');
  dsBtn.appendChild(dsName); dsBtn.appendChild(dsSub);
  tools.appendChild(ckBtn); tools.appendChild(rsBtn); tools.appendChild(dsBtn);
  side.appendChild(tools);
  hud.verbList.parentNode.appendChild(side);
  ckBtn.addEventListener('click', () => act({ type: 'checkpoint' }));
  rsBtn.addEventListener('click', () => act({ type: 'restore' }));
  dsBtn.addEventListener('click', () => act({ type: 'distill' }));

  /* ---------- the goal column: the three runs, then the meter ---------- */
  const runsRead = el('d-runs'), runVals = {};
  for (const k of KEYS) { const s = el(); setStyle(s, 'color', RUN_HUE[k]); runsRead.appendChild(s); runVals[k] = s; }
  hud.goalExtra(runsRead);
  const chain = el('d-chain');
  hud.goalBox.appendChild(chain);
  setVar(hud.goalBox, '--tease', STRATA[5].accent);      // the gate wakes in Foundation violet

  /* ---------- the instrument ---------- */
  const fabric = el('fabric');
  const banner = el('eb');
  const bIcon = el('ebw'), bRun = el('ebr'), bT = el('ebt');
  banner.appendChild(bIcon); banner.appendChild(bRun); banner.appendChild(bT);
  fabric.appendChild(banner);

  const main = el('fab-main');
  const mixer = el('mixer');
  const msvg = svg('svg'); msvg.setAttribute('viewBox', '0 0 100 100'); msvg.setAttribute('preserveAspectRatio', 'none');
  const feeds = {};
  for (const k of KEYS) {
    const ln = svg('line'); ln.setAttribute('class', 'tri-feed'); ln.setAttribute('stroke', RUN_HUE[k]);
    ln.setAttribute('x1', String(TRI[k].x * 100)); ln.setAttribute('y1', String(TRI[k].y * 100));
    msvg.appendChild(ln); feeds[k] = ln;
  }
  const outline = svg('polygon'); outline.setAttribute('class', 'tri-out');
  outline.setAttribute('points', KEYS.map((k) => (TRI[k].x * 100) + ',' + (TRI[k].y * 100)).join(' '));
  msvg.appendChild(outline);
  const balPt = svg('circle'); balPt.setAttribute('class', 'tri-bal'); balPt.setAttribute('r', '1.3');
  balPt.setAttribute('cx', String(KEYS.reduce((a, k) => a + TRI[k].x * 100, 0) / 3));
  balPt.setAttribute('cy', String(KEYS.reduce((a, k) => a + TRI[k].y * 100, 0) / 3));
  msvg.appendChild(balPt);
  mixer.appendChild(msvg);
  const corners = {}, cls4 = { vision: 'tc tc-v', language: 'tc tc-l', reasoning: 'tc tc-r' };
  for (const k of KEYS) {
    const t = el(cls4[k]);
    setStyle(t, 'color', RUN_HUE[k]);
    const lab = doc.createTextNode(k === 'reasoning' ? 'REASON' : k === 'language' ? 'LANG' : 'VISION');
    const pct = doc.createElement('b');
    t.appendChild(lab); t.appendChild(pct);
    mixer.appendChild(t);
    corners[k] = { el: t, pct: pct };
  }
  const mxLab = el('mx-lab'); setTxt(mxLab, 'DRAG TO ROUTE');
  mixer.appendChild(mxLab);
  const handle = el('tri-h');
  mixer.appendChild(handle);
  main.appendChild(mixer);

  const lanes = el('lanes'), lane = {};
  for (const d of c.domains) {
    const k = d.k, L = el('lane');
    setVar(L, '--rc', RUN_HUE[k]);
    L.setAttribute('data-tip', '<b>' + d.label + ' run</b><br><i>A training run, drifting on its own wind.</i><br>Draws ' + c.feedstock[k] + '. The line is its demand; the dashes are the share you feed it.');
    const h = el('lane-h');
    const nm = el('lane-n'); setTxt(nm, d.label);
    const tr = el('lane-t');
    h.appendChild(nm); h.appendChild(tr);
    const capRow = el();
    const net = el('lane-net');
    const cap = el('lane-cap');
    const capV = doc.createElement('span'), capS = doc.createElement('small'); setTxt(capS, '%');
    cap.appendChild(capV); cap.appendChild(capS);
    capRow.appendChild(net); capRow.appendChild(cap);
    const feed = el('lane-feed');
    const w = svg('svg'); w.setAttribute('class', 'wind'); w.setAttribute('viewBox', '0 0 100 26'); w.setAttribute('preserveAspectRatio', 'none');
    const wl = svg('polyline'); wl.setAttribute('class', 'fc-w'); wl.setAttribute('stroke', RUN_HUE[k]);
    const sl = svg('line'); sl.setAttribute('class', 'fc-s'); sl.setAttribute('x1', '0'); sl.setAttribute('x2', '100');
    w.appendChild(wl); w.appendChild(sl);
    const lk = el('lane-lock', 'button');
    L.appendChild(h); L.appendChild(capRow); L.appendChild(feed); L.appendChild(w); L.appendChild(lk);
    lanes.appendChild(L);
    lk.addEventListener('click', () => act({ type: 'lock', run: k }));
    lane[k] = { el: L, cap: capV, net, trend: tr, feed, wind: wl, share: sl, lock: lk };
  }
  main.appendChild(lanes);
  fabric.appendChild(main);

  const gauges = el('gauges'), gauge = {};
  for (const g of [['CAPABILITY', 'cap'], ['COMPUTE', 'compute'], ['HEAT', 'heat']]) {
    const box = el('gauge');
    if (g[1] === 'heat') box.setAttribute('data-tip', '<b>Heat</b><br><i>Concentrating compute to fight drift heats the fabric.</i><br>A hot fabric throttles all output. Concentrate to counter the wind, then ease toward balanced to cool.');
    const l = el('gauge-l'); const nm = doc.createElement('span'); setTxt(nm, g[0]);
    const v = doc.createElement('b');
    l.appendChild(nm); l.appendChild(v);
    const bar = el('gauge-b'); const fill = doc.createElement('i');
    bar.appendChild(fill);
    box.appendChild(l); box.appendChild(bar);
    gauges.appendChild(box);
    gauge[g[1]] = { v, fill };
  }
  fabric.appendChild(gauges);
  hud.root.appendChild(fabric);

  /* ---------- the mixer drag: pointer events, captured, so the handle follows off the plate ---------- */
  let dragging = false;
  function allocFromXY(fx, fy) {
    const A = TRI.vision, B = TRI.language, D = TRI.reasoning;
    const det = (B.y - D.y) * (A.x - D.x) + (D.x - B.x) * (A.y - D.y);
    const wv = ((B.y - D.y) * (fx - D.x) + (D.x - B.x) * (fy - D.y)) / det;
    const wl = ((D.y - A.y) * (fx - D.x) + (A.x - D.x) * (fy - D.y)) / det;
    act({ type: 'alloc', vision: Math.max(0, wv), language: Math.max(0, wl), reasoning: Math.max(0, 1 - wv - wl) });
  }
  function fromEvent(e) {
    const r = mixer.getBoundingClientRect();
    allocFromXY(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)));
  }
  mixer.addEventListener('pointerdown', (e) => {
    dragging = true;
    setCls(mixer, 'mixer dragging');
    if (mixer.setPointerCapture) { try { mixer.setPointerCapture(e.pointerId); } catch (_) { dragging = true; } }
    fromEvent(e);
  });
  mixer.addEventListener('pointermove', (e) => { if (dragging) fromEvent(e); });
  const endDrag = () => { dragging = false; setCls(mixer, 'mixer'); };
  mixer.addEventListener('pointerup', endDrag);
  mixer.addEventListener('pointercancel', endDrag);

  /* ---------- the architecture drawer ---------- */
  const drawer = el('drawer');
  const dHead = el('dr-head'), dTitle = el('dr-t'), dCount = el('dr-n'), dX = el('dr-x', 'button');
  setTxt(dTitle, 'ARCHITECTURE'); setTxt(dX, '✕');
  dHead.appendChild(dTitle); dHead.appendChild(dCount); dHead.appendChild(dX);
  const dBody = el('dr-body');
  drawer.appendChild(dHead); drawer.appendChild(dBody);
  hud.root.appendChild(drawer);
  const tiles = {};
  for (const a of c.archTree) {
    const t = el('a-tile');
    t.setAttribute('data-tip', '<b>' + a.name + '</b><br>' + a.tip);
    const g = el('a-g'); setTxt(g, a.glyph); setStyle(g, 'color', a.col);
    const body = el('a-b');
    const nm = el('a-n'), lv = doc.createElement('span'); lv.className = 'a-lv';
    nm.appendChild(doc.createTextNode(a.name)); nm.appendChild(lv);
    const ef = el('a-e'); setTxt(ef, a.eff);
    const b = el('buy', 'button');
    body.appendChild(nm); body.appendChild(ef); body.appendChild(b);
    t.appendChild(g); t.appendChild(body);
    dBody.appendChild(t);
    b.addEventListener('click', () => act({ type: 'arch', id: a.id }));
    tiles[a.id] = { el: t, buy: b, lv, def: a };
  }
  let open = false;
  const setOpen = (v) => { open = v; setCls(drawer, 'drawer' + (open ? ' show' : '')); };
  archBtn.addEventListener('click', () => setOpen(!open));
  dX.addEventListener('click', () => setOpen(false));
  // dev tooling: the shot tool addresses this drawer by scene name, the way app.js does for research
  const win = doc.defaultView;
  if (win && win.location && /deep-architecture/.test(win.location.hash)) setOpen(true);

  /* ---------- verbs + goal ---------- */
  function onVerb(name) { if (name === 'buyNode') act({ type: 'buyNode', n: buy.n }); }
  function onGoal() { act({ type: 'advance' }); }

  /** the sparkline: this run's demand across the next twelve seconds against the share you feed it */
  function windPoints(k) {
    let pts = '';
    for (let i = 0; i <= FC_STEPS; i++) {
      const d = demandOf(sim, k, i * FC_SPAN);
      pts += (i * (100 / FC_STEPS)).toFixed(1) + ',' + (25 - Math.min(1, d / 0.6) * 23).toFixed(1) + ' ';
    }
    return pts.trim();
  }

  /* ---------- per-frame update ---------- */
  let framed = false;
  function sync() {
    const st = sim.state, e = E();
    if (!framed) { framed = true; if (!world.isOverview && world.locked !== 4) world.lockTo(4, false); }

    const rail = [];
    for (const id of RAIL) if (id in st.stocks) rail.push({ id: id, value: st.stocks[id], rate: st.rates[id] || 0 });
    hud.setRail(rail);
    setTxt(bulk, '×' + buy.n);
    setTxt(mapBtn, world.isOverview ? '⤢ BOARD' : '⤢ MAP');

    const cr = computeRate(sim), thr = throttleOf(sim), nodeN = sim.node('node').count;
    const cost = sim.costOf('node', buy.n);
    hud.renderVerbs([{
      name: 'buyNode', label: 'BUILD NODE ×' + nodeN,
      yield: fmt(cost) + ' Si → +' + fmt(nodeN > 0 ? cr / nodeN : c.nodeCompute) + '/s',
      key: 'SPACE', disabled: st.stocks.silicon < cost,
      tip: '<b>Compute Node</b><br><i>Silicon, wired into one fabric.</i><br>Compute for the three runs. Capability follows breadth.'
    }]);

    // the supply bus: what it costs, what it actually returns, and the Silicon warning on the Foundry
    const nodeNext = sim.costOf('node', 1), siLow = st.stocks.silicon < nodeNext * 0.5 && (st.rates.silicon || 0) < 1.5;
    for (const key of Object.keys(sups)) {
      const S = sups[key], def = S.def, target = sim.node(def.node);
      setStyle(S.el, 'display', target ? '' : 'none');
      if (!target) continue;
      const price = supplyCost(sim, def, buy.n), can = st.stocks.silicon >= price;
      setTxt(S.cnt, '×' + supplyCount(sim, def));
      setTxt(S.cost, (buy.n > 1 ? '+' + buy.n + ' · ' : '') + fmt(price) + ' Si');
      setHTML(S.out, '+<b>' + fmt(supplyRate(sim, def)) + '</b> ' + def.out + '/s');
      setCls(S.el, 'd-sup' + (can ? ' can' : '') + (key === 'foundry' && siLow ? ' si-low' : ''));
    }
    const held = holdOn(sim), burn = holdBurn(sim);
    const langLow = st.edges.some((x) => x.to === 'run.language' && x.starved);
    setTxt(holdG, held ? '⏸' : '⚒');
    setTxt(holdS, held ? 'HELD' : 'RUN');

/** createView({hud, world, sim, buy}) -> { sync, onVerb, onGoal, toggleResearch } */
function createStatisticalView(opts) {
  const hud = opts.hud, world = opts.world, sim = opts.sim, buy = opts.buy;
  const doc = hud.root.ownerDocument, win = doc.defaultView;
  const c = sim.cfg.e3;
  const E = () => sim.state.eras[3];
  const el = (cls, tag) => { const e = doc.createElement(tag || 'div'); if (cls) e.className = cls; return e; };
  const reduced = !!(win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const pal = STRATA[3];

  if (!doc.getElementById(CSS_ID)) { const s = doc.createElement('style'); s.id = CSS_ID; s.textContent = CSS; doc.head.appendChild(s); }

  /* ---------- the instrument: a canvas pinned to a world rect, under the HUD and over the world ---------- */
  const plot = doc.createElement('canvas');
  plot.className = 'e3-plot';
  hud.root.parentNode.insertBefore(plot, hud.root);
  const pctx = plot.getContext('2d');
  let phase = 0, pulse = 0, plotW = 0, plotH = 0;

  /* ---------- the rail's own controls ---------- */
  const bulk = el('rail-btn', 'button');
  const mapBtn = el('rail-btn', 'button');
  hud.railRight.appendChild(bulk); hud.railRight.appendChild(mapBtn);
  bulk.addEventListener('click', () => { const i = c.buyModes.indexOf(buy.n); buy.n = c.buyModes[(i + 1) % c.buyModes.length]; });
  mapBtn.addEventListener('click', () => { if (world.isOverview) world.lockTo(3, true); else world.overview(true); });

  /* ---------- the left column under RUN TRIAL: the Focus dial, then EXPERIMENTS ---------- */
  const side = el('e3-side');
  const dial = el('e3-dial');
  const dHead = el('e3-dhead'), dLab = el('e3-dlab'); setTxt(dLab, 'TRAINING FOCUS');
  const autoBtn = el('e3-auto', 'button'); setTxt(autoBtn, '↻ AUTOPILOT');
  autoBtn.setAttribute('data-tip', '<b>Autopilot</b><br><i>' + c.focus.auto.flavor + '</i>');
  autoBtn.hidden = true;
  dHead.appendChild(dLab); dHead.appendChild(autoBtn);
  const segRow = el('e3-segs');
  const segs = {};
  for (const k of ['fit', 'generalize', 'explore']) {
    const d = c.focus[k];
    const b = el('e3-seg', 'button');
    b.setAttribute('data-tip', '<b>' + d.label + '</b><br><i>' + d.flavor + '</i>');
    setStyle(b, 'color', d.hue);
    const kk = el('e3-sk'), nm = el('e3-sn'), sd = el('e3-sd'), gh = el('e3-ghost');
    setTxt(kk, '◈'); setTxt(nm, d.label);
    b.appendChild(kk); b.appendChild(nm); b.appendChild(sd); b.appendChild(gh);
    segRow.appendChild(b);
    b.addEventListener('click', () => sim.apply({ type: 'focus', era: 3, k: k }));
    segs[k] = { btn: b, sd: sd, ghost: gh, def: d };
  }
  dial.appendChild(dHead); dial.appendChild(segRow);
  autoBtn.addEventListener('click', () => sim.apply({ type: 'focus', era: 3, k: E().focus === 'auto' ? focusKey(sim) : 'auto' }));

  const xpBtn = el('side-btn e3-xp', 'button');
  const xpLab = el('sb-l'); setTxt(xpLab, 'EXPERIMENTS');
  const xpSurvey = el('e3-xps'), xpBadge = el('e3-badge'); setTxt(xpBadge, 'METHOD'); xpBadge.hidden = true;
  xpBtn.appendChild(xpLab); xpBtn.appendChild(xpSurvey); xpBtn.appendChild(xpBadge);
  side.appendChild(dial); side.appendChild(xpBtn);
  hud.verbList.parentNode.appendChild(side);

  /* ---------- the goal column: the supply bus back to Origins ---------- */
  const sup = el('e3-sup');
  const supLab = el('e3-slab'); setTxt(supLab, 'SUPPLY BUS');
  const supBtn = el('e3-sbtn', 'button');
  supBtn.setAttribute('data-tip', '<b>Silicon</b><br><i>The instrument runs on Silicon from the Origins stack.</i>');
  const supNm = el('e3-snm'); setTxt(supNm, 'Silicon from Origins →');
  const supCost = el('e3-scost');
  supBtn.appendChild(supCost); supBtn.appendChild(supNm);
  sup.appendChild(supLab); sup.appendChild(supBtn);
  // build-here: the Foundry that makes the Silicon this stratum runs on, bought where it stands in Origins (Deep's bus
  // offers the same reach-back); its Silicon climbs the riser into your Datasets. The arrow still jumps you down.
  const fdy = el('side-btn e3-fdy', 'button');
  const fNm = el('e3-fnm'); setTxt(fNm, 'Foundry');
  const fCnt = el('e3-fcnt'); const fCost = el('e3-fcost');
  fdy.appendChild(fNm); fdy.appendChild(fCnt); fdy.appendChild(fCost);
  fdy.setAttribute('data-tip', '<b>Foundry</b><br><i>Built where it stands, in Origins. Its Silicon climbs the riser to your Datasets.</i><br>Paid in Silicon. Pause a Dataset to bank it.');
  sup.appendChild(fdy);
  hud.goalAside(sup);
  supBtn.addEventListener('click', () => { if (opts.jump && opts.jump(1)) return; world.lockTo(1, true); });   // go and build it: the view follows
  fdy.addEventListener('click', () => sim.apply({ type: 'supply', era: 3, n: buy.n }));
  setVar(hud.goalBox, '--tease', STRATA[4].accent);          // the goal wakes in Deep's cobalt

  /* ---------- the EXPERIMENTS drawer: three cards, built once, retargeted in place ---------- */
  const drawer = el('drawer');
  const dh = el('dr-head'), dt = el('dr-t'); setTxt(dt, 'EXPERIMENTS');
  const dn = el('dr-n'), dx = el('dr-x', 'button'); setTxt(dx, '✕');
  dh.appendChild(dt); dh.appendChild(dn); dh.appendChild(dx);
  const survey = el('e3-survey');
  const svLab = el('e3-slb'); setTxt(svLab, 'SURVEYED');
  const svMeter = el('e3-smeter'), svFill = doc.createElement('i'); svMeter.appendChild(svFill);
  const svDisc = el('e3-sdisc');
  survey.appendChild(svLab); survey.appendChild(svMeter); survey.appendChild(svDisc);
  const cardRow = el('e3-cards');
  const cards = [];
  for (let i = 0; i < 3; i++) {
    const card = el('e3-card');
    const cn = el('e3-cn'), tag = el('e3-ct'), nm = el('e3-sn'), lv = el('e3-clv');
    setTxt(tag, 'METHOD');
    cn.appendChild(tag); cn.appendChild(nm); cn.appendChild(lv);
    const cd = el('e3-cd'), b = el('buy', 'button');
    card.appendChild(cn); card.appendChild(cd); card.appendChild(b);
    cardRow.appendChild(card);
    const slot = { el: card, tag, nm, lv, cd, buy: b, kind: null };
    b.addEventListener('click', () => { if (slot.kind) sim.apply({ type: 'fund', era: 3, kind: slot.kind }); });
    cards.push(slot);
  }
  drawer.appendChild(dh); drawer.appendChild(survey); drawer.appendChild(cardRow);
  hud.root.appendChild(drawer);
  let open = false;
  const setOpen = (v) => { open = v; setCls(drawer, 'drawer' + (open ? ' show' : '')); };
  xpBtn.addEventListener('click', () => setOpen(!open));
  dx.addEventListener('click', () => setOpen(false));

  /* ---------- verbs + goal ---------- */
  let vYield = null;
  function onVerb(name) { if (name === 'trial') { sim.apply({ type: 'trial', era: 3 }); pulse = 1; } }
  function onGoal() { sim.apply({ type: 'generalize', era: 3 }); }

  /* ---------- the living scatter, drawn in world units inside the band ---------- */
  const fnAt = (x, ph) => 0.5 + 0.32 * Math.sin(x * Math.PI * 1.15 + 0.5 + ph);
  function drawInstrument(lod) {
    const e = E(), st = stats(sim), acc = e.accuracy, gap = e.gap, t = reduced ? 0 : sim.state.t;
    const X = (x) => PAD + x * (PLOT.w - PAD * 2);
    const Y = (y) => PLOT.h - PAD - Math.max(0.02, Math.min(0.98, y)) * (PLOT.h - PAD * 2);
    const fit = (x) => 0.5 + (fnAt(x, phase) - 0.5) * acc + Math.sin(x * 42 + t * 2) * gap * 0.16 * acc;
    const ref = (x) => 0.5 + (fnAt(x, phase) - 0.5) * Math.min(1, acc + 0.04);
    const hot = Math.min(1, gap / 0.35);
    const modelHue = hot > 0.5 ? '#ffb86b' : '#d7fff6';
    pctx.clearRect(0, 0, BAND.w, BAND.h);

    if (lod !== 'full') {                                    // zoomed out: the instrument reads as one glowing band
      const g = pctx.createLinearGradient(0, 0, 0, PLOT.h);
      g.addColorStop(0, alpha(pal.accent, 0.05));
      g.addColorStop(0.55, alpha(pal.accent, 0.22 + acc * 0.2));
      g.addColorStop(1, alpha(pal.accent, 0.05));
      pctx.fillStyle = g;
      pctx.fillRect(0, 0, PLOT.w, PLOT.h);
      pctx.strokeStyle = alpha(modelHue, 0.85); pctx.lineWidth = 4;
      pctx.beginPath();
      for (let px = 0; px <= PLOT.w - PAD * 2; px += 8) { const x = px / (PLOT.w - PAD * 2); px === 0 ? pctx.moveTo(X(x), Y(fit(x))) : pctx.lineTo(X(x), Y(fit(x))); }
      pctx.stroke();
      return;
    }

    // the chamber: one pane of glass over the plot and the track under it
    pctx.fillStyle = alpha('#04121a', 0.55);
    pctx.fillRect(0, 0, BAND.w, BAND.h);
    pctx.strokeStyle = alpha(pal.accent, 0.16); pctx.lineWidth = 1;
    pctx.strokeRect(0.5, 0.5, BAND.w - 1, BAND.h - 1);
    pctx.strokeStyle = alpha(pal.accent, 0.07); pctx.lineWidth = 1;
    for (let i = 1; i < 8; i++) { const gx = PAD + (PLOT.w - PAD * 2) * i / 8; pctx.beginPath(); pctx.moveTo(gx, PAD); pctx.lineTo(gx, PLOT.h - PAD); pctx.stroke(); }
    for (let j = 1; j < 5; j++) { const gy = PAD + (PLOT.h - PAD * 2) * j / 5; pctx.beginPath(); pctx.moveTo(PAD, gy); pctx.lineTo(PLOT.w - PAD, gy); pctx.stroke(); }
    pctx.strokeStyle = alpha(pal.accent, 0.3);
    pctx.beginPath(); pctx.moveTo(PAD, PAD - 6); pctx.lineTo(PAD, PLOT.h - PAD); pctx.lineTo(PLOT.w - PAD, PLOT.h - PAD); pctx.stroke();

    pctx.setLineDash([5, 5]);
    pctx.beginPath();
    for (let px = 0; px <= PLOT.w - PAD * 2; px += 3) { const x = px / (PLOT.w - PAD * 2); px === 0 ? pctx.moveTo(X(x), Y(ref(x))) : pctx.lineTo(X(x), Y(ref(x))); }
    pctx.strokeStyle = alpha(pal.accent, 0.22); pctx.lineWidth = 1.4; pctx.stroke();
    pctx.setLineDash([]);

    // the confidence band breathes with every trial
    const band = (1 - acc) * 0.16 + 0.012 + pulse * 0.03;
    pctx.beginPath();
    for (let px = 0; px <= PLOT.w - PAD * 2; px += 3) { const x = px / (PLOT.w - PAD * 2); px === 0 ? pctx.moveTo(X(x), Y(fit(x) + band)) : pctx.lineTo(X(x), Y(fit(x) + band)); }
    for (let px = PLOT.w - PAD * 2; px >= 0; px -= 3) { const x = px / (PLOT.w - PAD * 2); pctx.lineTo(X(x), Y(fit(x) - band)); }
    pctx.closePath(); pctx.fillStyle = alpha(pal.accent, 0.09); pctx.fill();

    // the data itself, and the one point that refuses to move after the world changed
    const odd = e.shifts >= 1 ? ODD : -1, pr = 1 + pulse * 1.1;
    pctx.fillStyle = 'rgba(110,231,255,' + (0.8 + pulse * 0.2) + ')';
    pctx.shadowColor = 'rgba(110,231,255,0.6)'; pctx.shadowBlur = 4 + pulse * 8;
    for (let k = 0; k < POINTS; k++) {
      if (k === odd) continue;
      const x = (k + 0.5) / POINTS, hsh = Math.abs(Math.sin(k * 12.9898) * 43758.5453) % 1;
      pctx.beginPath(); pctx.arc(X(x), Y(fnAt(x, phase) + (hsh - 0.5) * 0.32), 2.4 * pr, 0, 6.3); pctx.fill();
    }
    if (odd >= 0) {
      const x = (odd + 0.5) / POINTS, hsh = Math.abs(Math.sin(odd * 12.9898) * 43758.5453) % 1;
      const wob = reduced ? 1 : 1 + 0.25 * Math.sin(sim.state.t * 2.2);
      pctx.fillStyle = 'rgba(183,139,255,0.94)'; pctx.shadowColor = 'rgba(183,139,255,0.85)'; pctx.shadowBlur = 9 * wob;
      pctx.beginPath(); pctx.arc(X(x), Y(fnAt(x, 0) + (hsh - 0.5) * 0.32), 2.9 * wob, 0, 6.3); pctx.fill();
    }
    pctx.shadowBlur = 0;

    // the model's own curve: it goes amber when it is memorizing
    pctx.beginPath();
    for (let px = 0; px <= PLOT.w - PAD * 2; px += 2) { const x = px / (PLOT.w - PAD * 2); px === 0 ? pctx.moveTo(X(x), Y(fit(x))) : pctx.lineTo(X(x), Y(fit(x))); }
    pctx.lineWidth = 2.4; pctx.strokeStyle = modelHue;
    pctx.shadowColor = alpha(modelHue, 0.6); pctx.shadowBlur = 7; pctx.stroke(); pctx.shadowBlur = 0;

    // the drift dot: after the second shift the world never settles again
    if (e.shifts >= c.shiftTriggers.length && !e.done) {
      const puls = reduced ? 1 : 0.6 + 0.4 * Math.abs(Math.sin(sim.state.t * 2.4));
      pctx.fillStyle = 'rgba(183,139,255,' + puls.toFixed(2) + ')';
      pctx.beginPath(); pctx.arc(PLOT.w - PAD - 6, PAD - 4, 4, 0, 6.3); pctx.fill();
      pctx.font = '10px ' + pal.mono; pctx.textAlign = 'right'; pctx.fillStyle = 'rgba(183,139,255,0.9)';
      pctx.fillText('DRIFTING', PLOT.w - PAD - 16, PAD - 1);
    }

    // the two-needle track: TRAINING, VALIDATION, and the amber overfit between them
    const eff = effAccuracy(sim), thr = c.genThreshold;
    const tx = TRACK.x + PAD, tw = TRACK.w - PAD * 2, ty = TRACK.y + 12, th = 9;
    pctx.fillStyle = alpha('#000000', 0.5); pctx.fillRect(tx, ty, tw, th);
    pctx.fillStyle = alpha(pal.good, 0.85); pctx.fillRect(tx, ty, tw * eff, th);
    pctx.fillStyle = alpha('#ffb86b', 0.7); pctx.fillRect(tx + tw * eff, ty, Math.max(0, tw * (Math.max(acc, eff) - eff)), th);
    pctx.strokeStyle = alpha(pal.tease, 0.9); pctx.lineWidth = 1.5;
    pctx.beginPath(); pctx.moveTo(tx + tw * thr, ty - 4); pctx.lineTo(tx + tw * thr, ty + th + 4); pctx.stroke();
    if (st.cap < 0.999) {
      pctx.strokeStyle = alpha('#ff8a5c', 0.8);
      pctx.beginPath(); pctx.moveTo(tx + tw * st.cap, ty - 3); pctx.lineTo(tx + tw * st.cap, ty + th + 3); pctx.stroke();
    }
    pctx.font = '10px ' + pal.mono; pctx.textAlign = 'left'; pctx.textBaseline = 'top';
    pctx.fillStyle = alpha(pal.good, 0.95);
    pctx.fillText('VALIDATION ' + (eff * 100).toFixed(0) + '%', tx, ty + th + 4);
    pctx.textAlign = 'right'; pctx.fillStyle = 'rgba(255,184,107,0.95)';
    pctx.fillText('TRAINING ' + (acc * 100).toFixed(0) + '%', tx + tw, ty + th + 4);
    pctx.textAlign = 'left'; pctx.textBaseline = 'alphabetic';
  }

  /** pin the canvas to the world band and hand the context world-local units */
  function placeInstrument(lod) {
    const top = stratumTop(3);
    const a = world.toScreen({ x: BAND.x, y: top + BAND.y });
    const b = world.toScreen({ x: BAND.x + BAND.w, y: top + BAND.y + BAND.h });
    const w = Math.round(b.x - a.x), h = Math.round(b.y - a.y);
    const vis = w > 24 && h > 12 && b.x > 0 && a.x < (win.innerWidth || 1280) && b.y > 0 && a.y < (win.innerHeight || 800);
    setStyle(plot, 'display', vis ? '' : 'none');
    if (!vis) return;
