/* ==== inlined v3-kit/kit.css ==== */
/* ============================================================================
   FLOW-BOARD KIT — shared CSS (v3 · Phase 2)
   Extracted from emergence-v3.html (Origins canon), generalized across all 5 slices.
   Everything here is THEME-AGNOSTIC: it reads CSS vars only. Each era ships a
   `body.theme-N` block that sets the vars (see THEME CONTRACT below) + its own
   Tier-3 mechanic CSS (theorem tree / scatter stage / ternary mixer / phase machine).

   THEME CONTRACT — every era's body.theme-N MUST define:
     --bg --panel --panel-2 --line --edge --text --dim --dimmer --accent
     --good --danger                 (rail +/- rates, buy-affordable, starved)
     --tease                          (goal-wake color that previews the NEXT era)
     --era-font                       (display slot: Cinzel/VT323/Space Grotesk/Rajdhani/Inter)
     --body-font                      (body slot)
     --mono                           (numeric/terminal slot)
     --field                          (background texture: per-era noise/grid SVG)
   Per-resource hues come from the JS RES registry (not CSS vars) and are written
   inline by the builders, so one registry stays the single source of truth.
   ============================================================================ */

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background: var(--field,none), var(--bg);
  color:var(--text); font-family:var(--body-font,Georgia,serif); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:1180px; margin:0 auto; padding:14px 18px 40px; position:relative; z-index:1; }
h1,h2,h3,.disp{ font-family:var(--era-font,serif); letter-spacing:0.04em; }

/* ---------- Resource rail (color-coded, persistent, condensable) ---------- */
.rail{ position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; gap:8px; align-items:stretch;
  padding:7px 8px; margin:0 -8px 8px; background:var(--rail-bg,rgba(10,8,6,0.84)); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); }
.chip{ display:flex; align-items:center; gap:9px; padding:7px 12px 7px 9px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel); min-width:128px; position:relative; }
.chip .cdot{ width:26px; height:26px; border-radius:7px; flex:none; display:grid; place-items:center; font-size:15px; }
.chip img{ width:22px; height:22px; object-fit:contain; }         /* image resource */
.chip .cglyph{ font-size:16px; line-height:1; }                    /* glyph resource */
.chip .cbody{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
.chip .clab{ font-family:var(--era-font); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }
.chip .cval{ font-size:19px; font-variant-numeric:tabular-nums; font-weight:600; }
.chip .cps{ font-size:11px; font-variant-numeric:tabular-nums; margin-left:auto; align-self:flex-start; opacity:0.9; }
.cps.pos{ color:var(--good); } .cps.neg{ color:var(--danger); } .cps.zero{ color:var(--dimmer); }
.rail-right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
.rail-btn{ font-family:var(--era-font); font-size:11px; letter-spacing:0.1em; color:var(--dim); background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
.rail-btn:hover{ border-color:var(--accent); color:var(--text); }

header.era{ display:flex; align-items:baseline; gap:14px; margin:2px 2px 8px; }
header.era .sig{ width:34px; height:34px; object-fit:contain; opacity:0.9; align-self:center; filter:drop-shadow(0 0 8px var(--accent)); }
header.era h1{ font-size:26px; margin:0; color:var(--text); }
header.era .sub{ color:var(--dim); font-style:italic; font-size:15px; }
header.era .phase{ margin-left:auto; font-family:var(--era-font); font-size:11px; letter-spacing:0.16em; color:var(--accent); text-transform:uppercase; }

/* ---------- The board: verbs | pipeline | goal (canonical 220/244) ---------- */
.board{ display:grid; grid-template-columns: 220px 1fr 244px; gap:12px; align-items:start; }
.board > div{ min-width:0; }   /* let the center column shrink + WRAP the pipe (no "running off the side") */
@media(max-width:940px){ .board{ grid-template-columns:1fr; } }
.col-head{ font-family:var(--era-font); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--dimmer); margin:1px 0 5px; }

/* ---------- verbs (big primary actions) ---------- */
.verb{ width:100%; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
  padding:16px; margin-bottom:10px; border-radius:13px; cursor:pointer; color:#fff;
  font-family:var(--era-font); letter-spacing:0.06em; border:1px solid var(--edge);
  background-image: var(--field,none), linear-gradient(180deg,var(--verb-a,#2a2018),var(--verb-b,#161009));
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), inset 0 -6px 14px rgba(0,0,0,0.32), 0 5px 14px rgba(0,0,0,0.45); }
.verb:hover:not(:disabled){ border-color:var(--accent); }
.verb:active:not(:disabled){ transform:translateY(2px); box-shadow: inset 0 3px 9px rgba(0,0,0,0.5); }
.verb:disabled{ opacity:0.45; cursor:not-allowed; }
.verb .vname{ font-size:16px; }
.verb .vyield{ font-size:13px; font-family:var(--body-font); font-variant-numeric:tabular-nums; }
.verb .vkey{ font-size:10px; opacity:0.6; letter-spacing:0.1em; }   /* keyboard hint (Symbolic) */
.side-btn{ width:100%; display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:11px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); color:var(--text); font-family:var(--era-font); font-size:13px; letter-spacing:0.08em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 4px rgba(0,0,0,0.3); }
.side-btn:hover{ border-color:var(--accent); }
.side-btn img{ width:22px; height:22px; object-fit:contain; }
.side-btn .badge{ margin-left:auto; min-width:20px; text-align:center; font-size:12px; background:var(--accent); color:#140d06; border-radius:9px; padding:1px 6px; font-family:var(--body-font); }

/* ---------- pipeline lanes: sources → converters → outputs ---------- */
.lane{ background:linear-gradient(180deg,var(--lane-a,rgba(30,21,12,0.6)),var(--lane-b,rgba(18,12,7,0.7))); border:1px solid var(--line);
  border-radius:14px; padding:9px 11px 10px; margin-bottom:10px; position:relative; }
.lane-lab{ font-family:var(--era-font); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin-bottom:7px; display:flex; gap:8px; align-items:center; }
.lane-lab .ldash{ flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
.pipe{ display:flex; align-items:stretch; gap:6px; flex-wrap:wrap; }
.seg{ display:flex; align-items:stretch; gap:6px; min-width:0; flex:1 1 300px; } /* converter + connectors wrap as one unit — no dangling connector */
.stock{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; min-width:80px;
  padding:8px 6px; border-radius:11px; border:1px solid var(--line); background:rgba(0,0,0,0.22); }
.stock img{ width:26px; height:26px; object-fit:contain; }
.stock .sglyph{ font-size:22px; line-height:1; }
.stock .cglyph{ font-size:20px; line-height:1; }
.stock .sv{ font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
.stock .sl{ font-family:var(--era-font); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); }

/* flow connector — the signature "see systems affect each other" invention: brightens with throughput (--thru) */
.flow{ align-self:center; width:38px; height:22px; position:relative; flex:none; }
.flow svg{ width:100%; height:100%; overflow:visible; }
.flow .track{ stroke:var(--fc,#8a7350); stroke-width:2; opacity:0.28; }
.flow .pulse{ stroke:var(--fc,#e6d2a4); stroke-width:2.4; stroke-dasharray:5 9; opacity:calc(0.22 + 0.78*var(--thru,0));
  animation:flowmove 0.9s linear infinite; filter:drop-shadow(0 0 4px var(--fc)); }
.flow.idle .pulse{ animation:none; opacity:0.12; }
.flow.blocked .pulse{ stroke:var(--danger); animation:none; opacity:0.5; }
@keyframes flowmove{ to{ stroke-dashoffset:-14; } }

/* converter node = per-row dashboard: icon, +out/s, owned, cost, BUY, pause */
.node{ flex:1; min-width:160px; display:grid; grid-template-columns:auto 1fr auto; grid-template-rows:auto auto; gap:2px 10px;
  padding:7px 10px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); position:relative; }
.node.can{ border-color:var(--accent); }
.node.starved{ border-color:var(--danger); }
.node .nic{ grid-row:1/3; width:40px; height:40px; object-fit:contain; align-self:center; }
.node .nname{ font-family:var(--era-font); font-size:14px; }
.node .ncount{ color:var(--accent); font-size:12px; font-variant-numeric:tabular-nums; }
.node .nrate{ grid-column:2/4; font-size:12px; font-variant-numeric:tabular-nums; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
.node .nrate .up{ color:var(--good); } .node .nrate .dn{ color:var(--danger); }
.node .nbuy{ grid-row:1/3; grid-column:3; align-self:center; }

.buy,.act{ font-family:var(--era-font); font-size:12px; letter-spacing:0.04em; padding:9px 12px; border-radius:9px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--edge); color:var(--text); white-space:nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 1px 2px rgba(0,0,0,0.3); }
.buy:hover:not(:disabled),.act:hover:not(:disabled){ border-color:var(--accent); }
.buy:active:not(:disabled),.act:active:not(:disabled){ transform:translateY(1px); }
.buy:disabled,.act:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }
.buy .c{ color:var(--accent); } .buy:disabled .c{ color:inherit; }
.buy.ok .c{ color:var(--good); }
.pause{ display:inline-block; vertical-align:middle; width:18px; height:18px; border-radius:5px; border:1px solid var(--line);
  background:rgba(0,0,0,0.3); color:var(--dim); cursor:pointer; font-size:9px; line-height:15px; text-align:center; padding:0; margin-left:5px; }
.pause.on{ color:var(--danger); border-color:var(--danger); }
.auto{ display:flex; align-items:center; gap:8px; margin-top:6px; padding:6px 9px; border-radius:10px; background:rgba(0,0,0,0.18); border:1px solid var(--line); }
.auto img{ width:26px; height:26px; object-fit:contain; }
.auto .an{ font-family:var(--era-font); font-size:12px; }
.auto .ar{ font-size:12px; color:var(--good); font-variant-numeric:tabular-nums; }
.auto .abuy{ margin-left:auto; }

/* ---------- goal (always visible; WAKES to tease the next era) ---------- */
.goal{ background:linear-gradient(180deg,var(--goal-a,rgba(40,28,15,0.7)),var(--goal-b,rgba(20,13,7,0.8)));
  border:1px solid color-mix(in srgb, var(--tease,#fff) calc(var(--wake,0) * 60%), var(--edge));
  border-radius:14px; padding:12px; text-align:center; transition:border-color 0.4s, box-shadow 0.4s;
  /* --wake (0..1, set per-era from goal progress) makes the goal glow BUILD as the bar fills, then .ready pulses */
  box-shadow:0 0 calc(26px * var(--wake,0)) color-mix(in srgb, var(--tease,#7dffb7) calc(var(--wake,0) * 72%), transparent); }
.goal img.lm{ width:96px; height:96px; object-fit:contain; filter:drop-shadow(0 0 12px var(--accent)); }
.goal .gname{ font-family:var(--era-font); font-size:14px; letter-spacing:0.08em; margin:6px 0 2px; }
.goal .gsub{ font-size:12px; color:var(--dim); font-style:italic; margin-bottom:10px; }
.goal .gval{ font-size:40px; font-variant-numeric:tabular-nums; font-weight:600; }
.meter{ height:12px; border-radius:6px; background:rgba(0,0,0,0.4); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,0.5); }
.meter i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--tease,#fff)); transition:width 0.25s; }
.meter-lab{ font-size:12px; font-variant-numeric:tabular-nums; color:var(--dim); margin:5px 0 12px; }
.fab{ width:100%; font-family:var(--era-font); font-size:14px; letter-spacing:0.06em; padding:14px; border-radius:11px; cursor:pointer;
  color:#0e1513; border:1px solid var(--tease,#fff); background:linear-gradient(180deg,var(--tease,#bfeae0),color-mix(in srgb,var(--tease,#7fc9bb) 70%, #000));
  box-shadow:0 0 18px var(--tease); }
.fab:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; filter:grayscale(0.4); }
/* the goal sits dormant, then WAKES (pulse in the NEXT era's --tease hue) when the gate is reachable */
.goal.ready{ border-color:var(--tease); box-shadow:0 0 28px var(--tease); }
.goal.ready .gname{ color:var(--tease); }
.goal.ready img.lm{ animation:lmWake 1.8s ease-in-out infinite; }
.goal.ready .fab{ animation:fabPulse 1.5s ease-in-out infinite; }
@keyframes lmWake{ 0%,100%{ filter:drop-shadow(0 0 10px var(--tease)); } 50%{ filter:drop-shadow(0 0 24px var(--tease)); } }
@keyframes fabPulse{ 0%,100%{ box-shadow:0 0 14px var(--tease); } 50%{ box-shadow:0 0 30px var(--tease); } }
@media (prefers-reduced-motion: reduce){ .goal.ready img.lm,.goal.ready .fab{ animation:none; } }
.locked{ color:var(--dimmer); font-style:italic; font-size:13px; padding:20px 6px; }

/* ---------- standing decisions (levers / repeatable sinks) ---------- */
.standing{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
@media(max-width:940px){ .standing{ grid-template-columns:1fr; } }
.ctrl{ background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:9px 12px; }
.ctrl-lab{ font-family:var(--era-font); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:9px; }
.lever{ display:flex; align-items:center; gap:10px; }
.lever span{ font-family:var(--era-font); font-size:10px; letter-spacing:0.1em; color:var(--dim); }
.lever input{ flex:1; accent-color:var(--accent); cursor:pointer; }

/* ---------- event card (timed decision: commission / contradiction / shift / veto) ---------- */
.card-event{ grid-column:1/-1; display:none; align-items:center; gap:14px; margin-top:6px; padding:13px 16px;
  border-radius:13px; border:1px solid var(--accent); background:linear-gradient(180deg,var(--card-a,rgba(60,42,18,0.7)),var(--card-b,rgba(35,24,11,0.8)));
  animation:cardGlow 2.6s ease-in-out infinite; }
.card-event.show{ display:flex; }
@keyframes cardGlow{ 0%,100%{ box-shadow:0 0 0 rgba(0,0,0,0); } 50%{ box-shadow:0 0 24px var(--accent); } }
@media (prefers-reduced-motion: reduce){ .card-event{ animation:none; box-shadow:0 0 15px var(--accent); } .flow .pulse{ animation:none; } }
.card-event .cm-i{ flex:1; }
.card-event .cm-name{ font-family:var(--era-font); font-size:15px; }
.card-event .cm-need{ font-size:13px; color:var(--dim); }
.card-event .cm-timer{ height:6px; border-radius:3px; background:rgba(0,0,0,0.4); overflow:hidden; margin-top:6px; }
.card-event .cm-timer i{ display:block; height:100%; background:var(--accent); }
.card-event .cm-acts{ display:flex; gap:8px; }

/* ---------- research / discovery drawer ---------- */
#research{ position:fixed; top:0; right:0; width:340px; max-width:88vw; height:100%; z-index:40;
  background:linear-gradient(180deg,var(--panel),var(--bg)); border-left:1px solid var(--edge); transform:translateX(102%);
  transition:transform 0.28s ease; box-shadow:-16px 0 40px rgba(0,0,0,0.5); display:flex; flex-direction:column; }
#research.show{ transform:translateX(0); }
.rh{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
.rh h3{ margin:0; font-size:14px; letter-spacing:0.1em; }
.rh .x{ margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; background:none; border:none; }
.rbody{ overflow:auto; padding:12px 14px; }
.rsec{ font-family:var(--era-font); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dimmer); margin:12px 0 8px; }
.disco{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:11px; border:1px solid var(--line); background:var(--panel); margin-bottom:8px; }
.disco.can{ border-color:var(--accent); box-shadow:0 0 12px var(--accent); }
.disco img{ width:34px; height:34px; object-fit:contain; }
.disco .di{ flex:1; min-width:0; }
.disco .dn{ font-family:var(--era-font); font-size:13px; }
.disco .de{ font-size:12px; color:var(--good); }
.disco .dbuy{ width:100%; margin-top:7px; white-space:normal; height:auto; line-height:1.5; }
.cost-res{ color:var(--dim); white-space:nowrap; } .cost-res.ok{ color:var(--good); }

/* ---------- floating +N, tooltip, toasts ---------- */
#fx{ position:fixed; inset:0; pointer-events:none; z-index:60; }
.float{ position:absolute; font-family:var(--era-font); font-size:16px; font-weight:600; animation:floatUp 0.9s ease-out forwards; text-shadow:0 1px 3px #000; }
@keyframes floatUp{ to{ transform:translateY(-34px); opacity:0; } }
#tip{ position:fixed; z-index:70; max-width:300px; padding:10px 12px; border-radius:9px; background:var(--tip-bg,rgba(14,10,6,0.97));
  border:1px solid var(--edge); font-size:13px; line-height:1.45; color:var(--text); pointer-events:none; opacity:0; transition:opacity 0.1s; }
#tip.show{ opacity:1; } #tip i{ color:var(--dim); } #tip b{ color:var(--accent); }
#toasts{ position:fixed; right:16px; bottom:16px; z-index:65; display:flex; flex-direction:column; gap:8px; width:330px; max-width:80vw; }
.toast{ background:var(--panel); border:1px solid var(--accent); border-radius:11px; padding:11px 13px; animation:toastIn 0.35s ease; }
.toast.event{ border-color:var(--tease,var(--accent)); }        /* kind → themed border */
.toast.edu{ border-color:var(--good); }
.toast-h{ font-family:var(--era-font); font-size:12px; letter-spacing:0.08em; color:var(--accent); margin-bottom:3px; }  /* namespaced (Symbolic's .th = theorem card) */
.toast .tb{ font-size:13px; color:var(--text); }
@keyframes toastIn{ from{ transform:translateX(20px); opacity:0; } }

/* ---------- dev overlay + debug readout ---------- */
#dev{ position:fixed; left:14px; bottom:14px; z-index:80; display:none; flex-direction:column; gap:7px;
  background:rgba(8,6,3,0.92); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
#dev.show{ display:flex; } #dev .row{ display:flex; gap:6px; flex-wrap:wrap; } #dev button{ font-family:inherit; font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; }
#dev button.on{ color:var(--accent); border-color:var(--accent); }
#dbg{ position:fixed; left:14px; bottom:120px; z-index:79; display:none; font-family:var(--mono,ui-monospace,Menlo,monospace); font-size:11px; line-height:1.5;
  color:var(--text); background:rgba(8,6,3,0.82); border:1px solid var(--accent); border-radius:8px; padding:8px 10px; white-space:pre; pointer-events:none; }
#dbg.show{ display:block; } #dbg b{ color:var(--accent); }
.note{ text-align:center; color:var(--dimmer); font-size:12px; margin-top:26px; font-style:italic; }

    var recM = (CFG.leverFloor + CFG.leverSwing * lv) * (1 + CFG.commBonus * E.commRec);
    var fge = (CFG.leverFloor + CFG.leverSwing * (1 - lv)) * (1 + CFG.commBonus * E.commForge);
    inscribe *= recM; scribeY *= recM; quarry *= fge; minerY *= fge;
    var g = (1 + E.refine * CFG.refineBonus);
    return { inscribe: inscribe * g, quarry: quarry * g, scribeY: scribeY * g, minerY: minerY * g, scrR: scrR * g, smR: smR * g, foR: foR * g };
  }

  /* ---------- production ---------- */
  function produce(dt) {
    sync(); var os = oStats();
    if (E.scribe > 0) { var a = E.scribe * os.scribeY * dt; S.marks += a; K.fIn('marks', a); }
    if (E.miner > 0) { var b = E.miner * os.minerY * dt; S.ore += b; K.fIn('ore', b); }
    if (E.scriptorium > 0 && !E.paused.scriptorium) {
      var out = Math.min(S.marks, E.scriptorium * os.scrR * dt);
      var up = out * CFG.scriptoriumUpkeep; if (up > S.ore) out *= (up > 0 ? S.ore / up : 0);
      S.marks -= out; S.ore -= out * CFG.scriptoriumUpkeep; S.knowledge += out;
      K.fOut('marks', out); K.fOut('ore', out * CFG.scriptoriumUpkeep); K.fIn('knowledge', out);
    }
    if (E.smelter > 0 && !E.paused.smelter) {
      var out2 = Math.min(S.ore, E.smelter * os.smR * dt);
      var up2 = out2 * CFG.smelterUpkeep; if (up2 > S.knowledge) out2 *= (up2 > 0 ? S.knowledge / up2 : 0);
      S.ore -= out2; S.knowledge -= out2 * CFG.smelterUpkeep; S.metal += out2;
      K.fOut('ore', out2); K.fOut('knowledge', out2 * CFG.smelterUpkeep); K.fIn('metal', out2);
    }
    if (E.foundry > 0 && !E.paused.foundry) {
      var c = Math.min(S.metal, S.knowledge, E.foundry * os.foR * dt); S.metal -= c; S.knowledge -= c; S.silicon += c;
      K.fOut('metal', c); K.fOut('knowledge', c); K.fIn('silicon', c);
    }
    // commissions — live play only (K.MUTE = offline catch-up; timed offers freeze, they don't cycle silently)
    if (!K.MUTE && E.flags.o_smelter && E.flags.o_scriptorium && !E.done) {
      if (E.comm) { E.comm.t -= dt; if (E.comm.t <= 0) { E.comm = null; E.commCool = CFG.commCool; K.toast('THE CARAVAN MOVES ON', 'The commission lapsed. Another will come.', 'event'); shell.requestRender(); } }
      else {
        E.commCool -= dt; if (E.commCool <= 0) {
          var cdef = CFG.comms[E.commN % CFG.comms.length]; E.commN++;
          var cap = { marks: E.scribe * os.scribeY, ore: E.miner * os.minerY, metal: E.smelter * os.smR * 0.5, knowledge: E.scriptorium * os.scrR * 0.5 };
          var need = Math.ceil(Math.max(cdef.base, (cap[cdef.res] || 0) * 45));
          E.comm = { i: CFG.comms.indexOf(cdef), res: cdef.res, need: need, t: CFG.commDur };
          K.toast('A COMMISSION ARRIVES', cdef.name + ': <b>' + fmt(need) + ' ' + cdef.res + '</b>. Fulfilling it boosts a craft permanently.', 'event'); shell.requestRender();
        }
      }
    }
  }

  /* ---------- buy / disco / commission / fabricate ---------- */
  var unitCost = function (k) { return Math.floor(BUYS[k].base * Math.pow(BUYS[k].growth, E[k])); };
  var canBuy = function (k) { return S[BUYS[k].res] >= unitCost(k); };
  function buy(k) { sync(); if (!canBuy(k)) return; S[BUYS[k].res] -= unitCost(k); E[k]++; K.rec('buy:' + k); K.playSound('buy'); shell.refresh(); }

  var discoVisible = function (n) { return n.req.every(function (r) { return E.disco[r]; }); };
  function canDisco(n) {
    if (E.disco[n.id] || !discoVisible(n)) return false;
    if (n.reqRes) { for (var k in n.reqRes) if (S[k] < n.reqRes[k]) return false; }
    if (n.costs) { for (var j in n.costs) if (S[j] < n.costs[j]) return false; return true; }
    return S[n.res] >= n.cost;
  }
  function doDisco(n) {
    sync(); if (!canDisco(n)) return;
    if (n.costs) { for (var k in n.costs) S[k] -= n.costs[k]; } else S[n.res] -= n.cost;
    E.disco[n.id] = true; if (n.fn) n.fn(); K.rec('disco:' + n.id);
    K.toast('DISCOVERED · ' + n.name, '<i>' + n.flavor + '</i><br>' + n.eff);
    shell.requestRender();
  }

  function fulfillComm() {
    sync(); var c = E.comm; if (!c || S[c.res] < c.need) return; var def = CFG.comms[c.i];
    S[c.res] -= c.need; E.comm = null; E.commCool = CFG.commCool; E.commDone++;
    if (def.reward === 'rec') { E.commRec++; K.toast('COMMISSION FULFILLED', def.flavor + '<br>The Record gains <b>+' + Math.round(CFG.commBonus * 100) + '%</b>, permanently.'); }
    else if (def.reward === 'forge') { E.commForge++; K.toast('COMMISSION FULFILLED', def.flavor + '<br>The Forge gains <b>+' + Math.round(CFG.commBonus * 100) + '%</b>, permanently.'); }
    else { E.scribe += 2; E.miner += 2; K.toast('COMMISSION FULFILLED', def.flavor + '<br>They send <b>hands</b>: +2 Scribes, +2 Miners.'); }
    K.rec('comm:' + def.id); K.playSound('buy'); shell.requestRender();
  }
  function declineComm() { sync(); if (!E.comm) return; E.comm = null; E.commCool = CFG.commCool; K.toast('YOU WAVE THEM ON', 'Another will come.'); shell.requestRender(); }

  function fabricate() {
    sync(); if (S.silicon < CFG.siliconGate || E.done) return; S.silicon -= CFG.siliconGate; E.done = true; K.rec('fabricate');
    K.toast('THE LOGIC MACHINE', 'You built a machine that follows rules you set. The Symbolic era begins.');
    shell.openEra(2); // real handoff (seeds Symbolic with carried Knowledge)
  }

  /* ---------- verbs ---------- */
  function inscribe(ev) {
    sync(); var g = oStats().inscribe; S.marks += g; S.started = true; K.playSound('buy');
    if (ev && ev.currentTarget) { var r = ev.currentTarget.getBoundingClientRect(); K.floatNum('+' + fmt(g), HUE.marks, r.right - 40, r.top + 10); }
    shell.refresh();
  }
  function quarry(ev) {
    sync(); var g = oStats().quarry; S.ore += g; S.started = true; K.playSound('buy');
    if (ev && ev.currentTarget) { var r = ev.currentTarget.getBoundingClientRect(); K.floatNum('+' + fmt(g), HUE.ore, r.right - 40, r.top + 10); }
    shell.refresh();
  }

  /* ---------- board builders ---------- */
  var RAIL = [
    ['marks', 'Marks', function () { return true; }], ['ore', 'Ore', function () { return E.flags.o_materials; }], ['knowledge', 'Knowledge', function () { return E.flags.o_scriptorium; }],
    ['metal', 'Metal', function () { return E.flags.o_smelter; }], ['silicon', 'Silicon', function () { return E.flags.o_foundry; }]
  ];
  function railDefs() { sync(); return RAIL; }

  function node1(key, name, tip) { return K.node(key, name, tip, { icon: ICON[key], pausable: true }); }

  function buildLanes() {
    var h = '';
    h += '<div class="lane"><div class="lane-lab">The Record · Marks become Knowledge<div class="ldash"></div></div><div class="pipe">';
    h += K.stock('marks', 'Marks');
    if (E.flags.o_scriptorium) { h += '<div class="seg">' + K.connector('marks') + node1('scriptorium', 'Scriptorium', '<i>Where marks are ordered and made to mean something.</i><br>Marks (+ a little Ore) → Knowledge. Pausable.') + K.connector('knowledge') + K.stock('knowledge', 'Knowledge') + '</div>'; }
    h += '</div>';
    if (E.flags.canScribe) h += '<div class="auto" id="auto-scribe" data-tip="' + esc('<i>A trained hand that never tires.</i><br>Automates Marks.') + '"><img src="' + ICON.scribe + '"><span class="an">Scribe <span class="ncount" id="cnt-scribe"></span></span><span class="ar" id="ar-scribe"></span><button class="buy abuy" id="buy-scribe"></button></div>';
    h += '</div>';
    if (E.flags.o_materials) {
      h += '<div class="lane"><div class="lane-lab">The Forge · Ore becomes Metal, then Silicon<div class="ldash"></div></div><div class="pipe">';
      h += K.stock('ore', 'Ore');
      if (E.flags.o_smelter) { h += '<div class="seg">' + K.connector('ore') + node1('smelter', 'Smelter', '<i>Fire coaxes metal out of stone.</i><br>Ore (+ a little Knowledge) → Metal. Pausable.') + K.connector('metal') + K.stock('metal', 'Metal') + '</div>'; }
      if (E.flags.o_foundry) { h += '<div class="seg">' + K.connector('metal') + node1('foundry', 'Foundry', '<i>A recipe and a furnace.</i><br>Metal + Knowledge → Silicon. Pausable.') + K.connector('silicon') + K.stock('silicon', 'Silicon') + '</div>'; }
      h += '</div>';
      h += '<div class="auto" id="auto-miner" data-tip="' + esc('<i>Picks against the rock, hour after hour.</i><br>Automates Ore.') + '"><img src="' + ICON.miner + '"><span class="an">Miner <span class="ncount" id="cnt-miner"></span></span><span class="ar" id="ar-miner"></span><button class="buy abuy" id="buy-miner"></button></div>';
      h += '</div>';
    }
    return h;
  }

  function buildResearchBody() {
    var vis = DISCO.filter(function (n) { return discoVisible(n) && !E.disco[n.id]; });
    var have = DISCO.filter(function (n) { return E.disco[n.id]; }).length;
    var h = '<div class="rsec">Tablets of knowing — kept forever (' + have + '/' + DISCO.length + ')</div>';
    if (!vis.length) h += '<div class="locked" style="text-align:center">All current research made. Keep building to reveal more.</div>';
    vis.forEach(function (n) { h += '<div class="disco" id="disco-' + n.id + '" data-tip="' + esc('<i>' + n.flavor + '</i>') + '"><img src="' + (ICON[n.id] || 'assets/era1-sigil.png') + '"><div class="di"><div class="dn">' + n.name + '</div><div class="de">' + n.eff + '</div><button class="buy dbuy" id="dbuy-' + n.id + '"></button></div></div>'; });
    return { html: h, vis: vis };
  }

  // build() returns the full board HTML (verbs | pipeline | goal + standing + event card)
  function build() {
    sync();
    var h = '';
    h += '<div class="col-verbs"><div class="col-head">Your hands</div>' +
      '<button class="verb marks" id="inscribe"><span class="vname">Inscribe a mark</span><span class="vyield" id="inscribeY"></span></button>' +
      '<button class="verb ore" id="quarry" style="display:' + (E.flags.o_materials ? 'flex' : 'none') + '"><span class="vname">Quarry ore</span><span class="vyield" id="quarryY"></span></button>' +
      '<button class="side-btn" id="researchBtn"><img src="assets/era1-sigil.png" alt="">RESEARCH<span class="badge" id="researchBadge">1</span></button></div>';
    h += '<div class="col-pipe"><div class="col-head">The work — sources flow into converters, converters into the next thing</div><div id="lanes">' + buildLanes() + '</div></div>';
    h += '<div class="col-goal"><div class="col-head">The goal</div><div class="goal" id="goal">' +
      '<img class="lm" src="assets/logic-machine.png" alt=""><div class="gname">The Logic Machine</div>' +
      '<div class="gsub" id="goalSub">first, learn to make Silicon</div>' +
      '<div class="meter"><i id="siMeter"></i></div><div class="meter-lab" id="siLab"></div>' +
      '<button class="fab" id="fabricate" disabled>FABRICATE</button></div></div>';
    // standing decisions
    h += '<div class="standing" id="standing" style="display:' + ((E.flags.o_scriptorium || E.flags.o_materials) ? 'grid' : 'none') + '">' +
      '<div class="ctrl" id="handsCtrl" style="display:' + (E.flags.o_materials ? 'block' : 'none') + '">' +
      '<div class="ctrl-lab" data-tip="' + esc('<i>One workforce, split between the crafts.</i><br>Lean toward the craft that is starving; the other slows. Centered is even.') + '">The Hands · one workforce, split</div>' +
      '<div class="lever"><span style="color:var(--marks,#e6d2a4)">THE RECORD</span><input type="range" id="hands" min="0" max="100" value="' + Math.round((1 - E.lever) * 100) + '"><span style="color:var(--metal,#ef9f56)">THE FORGE</span></div></div>' +
      '<div class="ctrl" id="refineCtrl" style="display:' + (E.flags.o_scriptorium ? 'block' : 'none') + '">' +
      '<div class="ctrl-lab">Refine the craft · spend surplus Ore</div>' +
      '<div class="refine-row" data-tip="' + esc('<i>Practice compounds. Sink your surplus back into the work.</i><br>+5% to ALL Origins production per level. Repeatable.') + '">' +
      '<div class="rinfo"><div class="rname">Refine <span class="ncount" id="refineN"></span></div><div class="reff" id="refineEff"></div></div>' +
      '<button class="buy" id="refineBuy"></button></div></div></div>';
    // event card
    h += '<div class="card-event" id="commission"><img src="assets/era1-sigil.png" alt="" style="width:34px;height:34px;object-fit:contain">' +
      '<div class="cm-i"><div class="cm-name" id="cmName"></div><div class="cm-need" id="cmNeed"></div><div class="cm-timer"><i id="cmTimer"></i></div></div>' +
      '<div class="cm-acts"><button class="buy" id="cmYes"></button><button class="buy" id="cmNo">Decline</button></div></div>';
    return h;
  }

  function wire() {
    sync();
    if ($('inscribe')) $('inscribe').onclick = inscribe;
    if ($('quarry')) $('quarry').onclick = quarry;
    if ($('fabricate')) $('fabricate').onclick = fabricate;
    if ($('researchBtn')) $('researchBtn').onclick = function () { $('research').classList.toggle('show'); };
    if ($('hands')) $('hands').oninput = function (e) { E.lever = 1 - (+e.target.value / 100); };
    if ($('refineBuy')) $('refineBuy').onclick = function () { buy('refine'); };
    ['scriptorium', 'smelter', 'foundry', 'scribe', 'miner'].forEach(function (k) {
      var b = $('buy-' + k); if (b) b.onclick = function () { buy(k); };
      var p = $('pause-' + k); if (p) p.onclick = function () { E.paused[k] = !E.paused[k]; K.playSound('buy'); shell.requestRender(); };
    });
    // research drawer body
    var rb = buildResearchBody(); setHTML($('researchBody'), rb.html);
    rb.vis.forEach(function (n) { var b = $('dbuy-' + n.id); if (b) b.onclick = function () { doDisco(n); }; });
  }

  /* ---------- refresh (per-tick values only) ---------- */
  var costHave = function (k) { return S[k]; };
  function nodeRefresh(key, flows) {
    var nd = $('node-' + key); if (!nd) return;
    setTxt($('cnt-' + key), '×' + E[key]);
    setHTML($('rate-' + key), E[key] > 0 ? flows.map(function (f) { return '<span class="' + (f[0] === '+' ? 'up' : 'dn') + '">' + f[0] + fmt(f[1] * E[key]) + ' ' + f[2] + '</span>'; }).join('') : '<span style="color:var(--dimmer)">not built yet</span>');
    var b = $('buy-' + key); if (b) { setHTML(b, 'Build · ' + K.costHTML([[BUYS[key].res, unitCost(key)]], costHave)); var can = canBuy(key); setDis(b, !can); b.classList.toggle('ok', can); }
    var p = $('pause-' + key); if (p) p.classList.toggle('on', !!E.paused[key]);
    var starved = E[key] > 0 && !E.paused[key] && ((key === 'scriptorium' && S.marks < 0.5) || (key === 'smelter' && S.ore < 0.5) || (key === 'foundry' && (S.metal < 0.5 || S.knowledge < 0.5)));
    var cl = 'node' + (canBuy(key) ? ' can' : '') + (starved ? ' starved' : ''); if (nd.className !== cl) nd.className = cl;
  }
  function autoRefresh(key, yld, res) {
    setTxt($('cnt-' + key), '×' + E[key]); setTxt($('ar-' + key), '+' + fmt(E[key] * yld) + ' ' + res + '/s');
    var b = $('buy-' + key); if (b) { setHTML(b, '+1 · ' + K.costHTML([[BUYS[key].res, unitCost(key)]], costHave)); var can = canBuy(key); setDis(b, !can); b.classList.toggle('ok', can); }
  }
  function refreshResearch() {
    DISCO.forEach(function (n) {
      var b = $('dbuy-' + n.id); if (!b) return;
      var reqs = n.costs ? Object.keys(n.costs).map(function (k) { return [k, n.costs[k]]; }) : [[n.res, n.cost]];
      if (n.reqRes) for (var k in n.reqRes) reqs.push([k, n.reqRes[k]]);
      setHTML(b, 'Discover · ' + K.costHTML(reqs, costHave)); var can = canDisco(n); setDis(b, !can); b.classList.toggle('ok', can);
    });
  }

  function refresh() {
    sync(); var os = oStats();
    setTxt($('inscribeY'), '+' + fmt(os.inscribe) + ' marks'); setTxt($('quarryY'), '+' + fmt(os.quarry) + ' ore');
    ['marks', 'ore', 'knowledge', 'metal', 'silicon'].forEach(function (k) { setTxt($('stk-' + k), fmt(S[k])); K.connGlow(k, {}); });
    nodeRefresh('scriptorium', [['+', os.scrR, 'knowledge'], ['−', os.scrR, 'marks'], ['−', os.scrR * CFG.scriptoriumUpkeep, 'ore']]);
    nodeRefresh('smelter', [['+', os.smR, 'metal'], ['−', os.smR, 'ore'], ['−', os.smR * CFG.smelterUpkeep, 'knowledge']]);
    nodeRefresh('foundry', [['+', os.foR, 'silicon'], ['−', os.foR, 'metal'], ['−', os.foR, 'knowledge']]);
    autoRefresh('scribe', os.scribeY, 'marks'); autoRefresh('miner', os.minerY, 'ore');
    if (E.flags.o_scriptorium) {
      var rb = $('refineBuy'); if (rb) { setHTML(rb, 'Build · ' + K.costHTML([['ore', unitCost('refine')]], costHave)); var can = canBuy('refine'); setDis(rb, !can); rb.classList.toggle('ok', can); }
      setTxt($('refineN'), '×' + E.refine); setTxt($('refineEff'), '+' + Math.round(E.refine * CFG.refineBonus * 100) + '% to all production');
    }
    // event card
    var cm = $('commission');
    if (cm) {
      if (E.comm) {
        if (!cm.classList.contains('show')) cm.classList.add('show'); var def = CFG.comms[E.comm.i];
        setTxt($('cmName'), def.name);
        setHTML($('cmNeed'), 'give <b style="color:' + HUE[E.comm.res] + '">' + fmt(E.comm.need) + ' ' + E.comm.res + '</b> → <b>' + REWARD[def.reward] + '</b>');
        $('cmTimer').style.width = Math.max(0, (E.comm.t / CFG.commDur) * 100) + '%';
        var y = $('cmYes'); setHTML(y, 'Fulfill · ' + K.costHTML([[E.comm.res, E.comm.need]], costHave)); var okc = S[E.comm.res] >= E.comm.need; setDis(y, !okc); y.classList.toggle('ok', okc);
        if (!y._wired) { y.onclick = fulfillComm; $('cmNo').onclick = declineComm; y._wired = 1; }
      } else if (cm.classList.contains('show')) cm.classList.remove('show');
    }
    // goal
    if ($('siMeter')) $('siMeter').style.width = Math.min(100, (S.silicon / CFG.siliconGate) * 100) + '%';
    setTxt($('siLab'), E.flags.o_foundry ? fmt(S.silicon) + ' / ' + CFG.siliconGate + ' silicon' : 'unlock the Foundry to make Silicon');
    var fb = $('fabricate'), ready = S.silicon >= CFG.siliconGate && !E.done; setDis(fb, !ready); setTxt(fb, E.done ? 'FABRICATED ✓' : 'FABRICATE');
    var goalEl = $('goal');
    if (goalEl) {
      goalEl.classList.toggle('ready', ready);
      // the goal glow BUILDS as Silicon fills (exponential — turns on toward the end), then .ready pulses
      var prog = E.flags.o_foundry ? Math.min(1, S.silicon / CFG.siliconGate) : 0;
      var wake = Math.pow(prog, 1.7);
      if (goalEl._wake !== wake) { goalEl.style.setProperty('--wake', wake.toFixed(3)); goalEl._wake = wake; }
    }
    // when ready, the FABRICATE button morphs to the NEXT era's font (Symbolic VT323) — a taste of what's coming
    if (fb) { var ff = ready ? "'VT323', monospace" : ''; if (fb._ff !== ff) { fb.style.fontFamily = ff; fb.style.fontSize = ready ? '20px' : ''; fb.style.letterSpacing = ready ? '0.08em' : ''; fb._ff = ff; } }
    if ($('goalSub')) $('goalSub').textContent = E.flags.o_foundry ? 'reach ' + CFG.siliconGate + ' Silicon' : (E.flags.o_smelter ? 'first, learn to make Silicon (build the Foundry)' : 'first, learn to work materials');
    var canN = DISCO.filter(canDisco).length; var bdg = $('researchBadge'); if (bdg) { setTxt(bdg, String(canN)); bdg.style.display = canN ? 'inline-block' : 'none'; }
    refreshResearch();
  }

  /* ---------- fresh seed ---------- */
  function fresh(st) {
    st.marks = 0; st.ore = 0; st.knowledge = 0; st.metal = 0; st.silicon = 0;
    st.e1 = {
      scribe: 0, miner: 0, scriptorium: 0, smelter: 0, foundry: 0, refine: 0,
      disco: {}, flags: {}, paused: {}, lever: 0.5, age: 1,
      comm: null, commN: 0, commCool: CFG.commCool, commRec: 0, commForge: 0, commDone: 0, done: false
    };
  }

  return {
    id: 1, theme: 'theme-1', name: 'Origins', sub: 'from marks to matter', sigil: 'assets/era1-sigil.png',
    bed: 'assets/music-bone-loam.mp3', pool: ['marks', 'ore', 'knowledge', 'metal', 'silicon'],
    sound: { buy: { osc: 'triangle', f0: 880, f1: 300, g: 0.09, dur: 0.1 } },
    res: RES,
    phase: function () { sync(); return ['', 'Stone Age', 'Bronze Age', 'Silicon Age'][E.age] || 'Stone Age'; },
    fresh: fresh, produce: produce, build: build, wire: wire, refresh: refresh, railDefs: railDefs,
    hasDrawer: true, drawerTitle: 'RESEARCH · one-time discoveries',
    done: function () { sync(); return !!E.done; },
    // action seam — the same functions the wired buttons call (test autoplayer / dev tooling)
    acts: { inscribe: inscribe, quarry: quarry, buy: buy, canBuy: canBuy, unitCost: unitCost, DISCO: DISCO, canDisco: canDisco, doDisco: doDisco, fulfillComm: fulfillComm, fabricate: fabricate, oStats: oStats }
  };
}
if (typeof module !== 'undefined' && module.exports) module.exports = makeEraOrigins;

</script>
<script>
/* ==== inlined v3-kit/era-symbolic.js ==== */
/* ============================================================================
   ERA MODULE — Symbolic (era 2). Ported from emergence-v3-symbolic.html onto the
   shared shell + KIT. Re-homed: resources rules/inference/axioms live in the shared
   pool (S top-level); Symbolic mechanic state lives on S.e2; the Knowledge→Rules
   handoff is wired in open(). Factory: makeEraSymbolic(shell).
   ============================================================================ */
function makeEraSymbolic(shell) {
  var K = shell.KIT, $ = K.$, fmt = K.fmt, esc = K.esc, setTxt = K.setTxt, setHTML = K.setHTML, setDis = K.setDis;
  var S = shell.S, CFG = shell.CFG.e2;

  var RES = {
    rules: { hue: '#8dffb7', glyph: '§', flavor: 'Reasoning, written as explicit rules.' },
    inference: { hue: '#6fe6d8', glyph: '∴', flavor: 'Conclusions the rules can reach.' },
    axioms: { hue: '#ffcd6b', glyph: '⊢', flavor: 'Truths banked forever, kept across runs.' }
  };
  var HUE = { rules: RES.rules.hue, inference: RES.inference.hue, axioms: RES.axioms.hue };

  var TREE = [

  }

  /* ---------- the living scatter ---------- */
  var plotPulse = 0, drawPhase = 0;
  function drawScatter() {
    var cv = $('scatter'); if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'); if (!ctx || !ctx.arc) return;
    var w = cv.width = cv.clientWidth || 640, h = cv.height = cv.clientHeight || 250, pad = 22, gw = w - pad * 2, gh = h - pad * 2;
    var acc = E.accuracy, gap = E.gap, t = S.t || 0;
    var X = function (x) { return pad + x * gw; }, Y = function (y) { return h - pad - Math.max(0.02, Math.min(0.98, y)) * gh; };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(95,224,192,0.07)'; ctx.lineWidth = 1;
    for (var i = 1; i < 8; i++) { var gx = pad + gw * i / 8; ctx.beginPath(); ctx.moveTo(gx, pad); ctx.lineTo(gx, h - pad); ctx.stroke(); }
    for (var j = 1; j < 5; j++) { var gy = pad + gh * j / 5; ctx.beginPath(); ctx.moveTo(pad, gy); ctx.lineTo(w - pad, gy); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(95,224,192,0.28)'; ctx.beginPath(); ctx.moveTo(pad, pad - 6); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();

    var fn = function (x) { return 0.5 + 0.32 * Math.sin(x * Math.PI * 1.15 + 0.5 + drawPhase); };
    var fit = function (x) { return 0.5 + (fn(x) - 0.5) * acc + Math.sin(x * 42 + t * 2) * gap * 0.16 * acc; };
    var genRef = function (x) { return 0.5 + (fn(x) - 0.5) * Math.min(1, acc + 0.04); };
    if (ctx.setLineDash) ctx.setLineDash([5, 5]);
    ctx.beginPath(); for (var px = 0; px <= gw; px += 3) { var x0 = px / gw, cx0 = pad + px, cy0 = Y(genRef(x0)); px === 0 ? ctx.moveTo(cx0, cy0) : ctx.lineTo(cx0, cy0); }

  KIT.musicPlayEra(ERAS[S.era].bedKey ? ERAS[S.era].bedKey() : S.era); // set the bed at boot (the ♪ toggle was dead until the first era switch)
  document.addEventListener('pointerdown', function firstGesture() { KIT.musicEnsure(); document.removeEventListener('pointerdown', firstGesture); });
  render();
  if (offline) setTimeout(function () { offlineToast(offline); }, 600);
  setInterval(tick, CFG.tickMs);

  // expose a tiny bit for headless verification
  window.__EMG = { S: S, ERAS: ERAS, KIT: KIT, tick: tick, render: render, navTo: navTo, openEra: openEra, save: save, newGame: newGame, toggleSettings: toggleSettings, setPaused: setPaused };
})();
</script>
