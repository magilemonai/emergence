<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMERGENCE</title>
<style>
  :root {
    --bg: #06080d; --panel: #0d1220; --panel-2: #121a2c; --line: #1c2740;
    --text: #ccd6ea; --dim: #5d6d8a; --dimmer: #3a4660;
    --e0: #c9925f; --e1: #c9a26b; --e2: #6ec6a8; --e3: #6ea8ff; --e4: #b78bff;
    --accent: #ffcd6b; --good: #5ee07f; --danger: #ff6b8b;
    --era-font: "SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  /* ERA 1 — Origins: warm, earthen, ancient. Serif. */
  .theme-1, .era-e1 {
    --bg: #160f08; --panel: #211810; --panel-2: #2b2014; --line: #46341d;
    --text: #f3e9d4; --dim: #c8ad80; --dimmer: #b59a6c; --accent: #e8b876;
    --era-font: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }
  /* ERA 2 — Symbolic: cold, digital, terminal. Monospace. */
  .theme-2, .era-e2 {
    --bg: #04070e; --panel: #0a0f18; --panel-2: #0e1421; --line: #233246;
    --text: #c8dcea; --dim: #8fa9bd; --dimmer: #7c93a8; --accent: #ffcd6b;
    --era-font: "SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  /* ERA 3 — Statistical: cool teal, scientific / data-viz. Clean sans. */
  .theme-3, .era-e3 {
    --bg: #051210; --panel: #0a221c; --panel-2: #0d2c24; --line: #1e4d41;
    --text: #d2efe4; --dim: #84baa9; --dimmer: #6da08e; --accent: #7fe6c4;
    --era-font: "Inter", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  }
  body.theme-3 { background: radial-gradient(1000px 620px at 50% -10%, rgba(110,198,168,0.08), transparent 60%), var(--bg); }
  .era-e3 { background:
      linear-gradient(rgba(5,18,16,0.92), rgba(5,18,16,0.95)),
      repeating-linear-gradient(rgba(110,198,168,0.045) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(110,198,168,0.045) 0 1px, transparent 1px 28px), var(--panel); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--era-font); overflow: hidden; transition: background 0.9s ease, color 0.7s ease; }
  body { background: var(--bg); }
  body.theme-1 { background: radial-gradient(1000px 620px at 80% -10%, rgba(224,168,106,0.07), transparent 60%), radial-gradient(800px 500px at 5% 110%, rgba(160,110,60,0.05), transparent 60%), var(--bg); }
  body.theme-2 { background: radial-gradient(1100px 700px at 50% -15%, rgba(201,162,107,0.06), transparent 60%), radial-gradient(900px 500px at 90% 110%, rgba(110,140,200,0.05), transparent 60%), var(--bg); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 9px 18px;
    border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(18,26,44,0.5), transparent);
    opacity: 0; transform: translateY(-100%); transition: opacity 0.6s, transform 0.6s; }
  header.show { opacity: 1; transform: translateY(0); }
  .logo { display: flex; align-items: center; }
  .logo-wm { height: 24px; width: auto; display: block; filter: drop-shadow(0 0 6px rgba(232,184,118,0.3)); }
  .logo b { color: var(--e3); }
  .era-indicator { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .hdr-right { margin-left: auto; display: flex; gap: 22px; align-items: center; }
  .res-bar { display: flex; gap: 20px; align-items: center; }
  .buymode { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; opacity: 0; transition: opacity 0.5s; }
  .buymode.show { opacity: 1; }
  .buymode button { font-family: inherit; font-size: 10px; letter-spacing: 0.5px; padding: 5px 10px; border: none;
    border-right: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; transition: all 0.12s; }
  .buymode button:last-child { border-right: none; }
  .buymode button:hover { color: var(--text); }
  .buymode button.on { background: rgba(255,205,107,0.1); color: var(--accent); }
  .res { text-align: right; min-width: 80px; opacity: 0; transition: opacity 0.5s; }
  .res.show { opacity: 1; }
  .res .label { font-size: 10px; letter-spacing: 1.4px; color: var(--dim); text-transform: uppercase; }
  .res .val { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .res-ps { font-size: 10.5px; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 1px; }
  .res-ps.pos { color: var(--good); } .res-ps.neg { color: var(--danger); } .res-ps.zero { color: var(--dimmer); }
  main { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
  main::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  #coldopen { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px; transition: opacity 0.28s ease, transform 0.28s ease; }
  #eras.rising { animation: eraRise 0.4s ease-out; }
  @keyframes eraRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .co-wordmark { width: min(560px, 72vw); height: auto; display: block; margin-bottom: 4px;
    filter: drop-shadow(0 0 24px rgba(232,184,118,0.25)); animation: wordmarkIn 1.2s ease-out; }
  @keyframes wordmarkIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .co-title { font-size: 12px; letter-spacing: 6px; color: var(--dimmer); text-transform: uppercase; }
  .co-count { font-size: 40px; font-variant-numeric: tabular-nums; color: var(--e0); min-height: 48px; transition: transform 0.08s; text-align:center; }
  .co-count small { font-size: 13px; color: var(--dim); letter-spacing: 2px; display: block; margin-top: 4px; }
  .big-btn { padding: 26px 56px; border-radius: 16px; border: 1px solid var(--e0);
    background: radial-gradient(circle at 50% 0%, rgba(201,146,95,0.14), var(--panel));
    color: var(--e0); font-family: inherit; font-size: 16px; letter-spacing: 3px; cursor: pointer;
    transition: transform 0.06s, box-shadow 0.2s; user-select: none; }
  .big-btn:hover { box-shadow: 0 0 30px rgba(201,146,95,0.25); }
  .big-btn:active { transform: scale(0.96); }
  .co-hint { font-size: 11px; color: var(--dimmer); font-style: italic; max-width: 360px; text-align: center; line-height: 1.7; min-height: 20px; }
  #vizwrap { display: none; max-width: 1180px; margin: 18px auto 0; padding: 0 18px; position: relative; }
  #viz { width: 100%; height: 210px; display: block; border: 1px solid var(--line); border-radius: 14px;
    background: radial-gradient(120% 140% at 50% -20%, rgba(110,168,255,0.06), transparent 55%),
      radial-gradient(100% 120% at 90% 120%, rgba(183,139,255,0.06), transparent 55%), #080b12; }
  .viz-cap { position: absolute; top: 15px; left: 31px; font-size: 8.5px; letter-spacing: 3px; color: var(--dimmer); pointer-events: none; }
  #eras { display: none; padding: 18px; gap: 16px; flex-direction: column; max-width: 1180px; margin: 0 auto; }
  .era { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-family: var(--era-font);
    padding: 16px 18px; transition: opacity 0.8s, filter 0.8s, transform 0.5s, background 0.6s, border-color 0.6s; position: relative; overflow: hidden; }
  .panel { transition: background 0.5s, border-color 0.5s; }
  header { transition: opacity 0.6s, transform 0.6s, background 0.7s; }
  .era::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ec, var(--dim)); opacity: 0.8; }
  .era.obsolete { filter: grayscale(0.85) brightness(0.6); opacity: 0.5; }
  .era.obsolete .era-body { max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; }
  .era-header { display: flex; align-items: center; gap: 12px; }
  .era.collapsed { cursor: pointer; padding: 16px 18px; transition: border-color 0.2s, background 0.2s; }
  .era.collapsed:hover { border-color: var(--ec); background: var(--panel-2); }
  .era-expand-btn { margin-left: 14px; border: 1px solid var(--ec); color: var(--ec); font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; padding: 8px 18px; border-radius: 9px; white-space: nowrap; }
  .era.collapsed:hover .era-expand-btn { background: var(--ec); color: #0a0d14; }
  .era-toggle { margin-left: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--ec); color: var(--ec);
    font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 7px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .era-toggle:hover { background: var(--ec); color: #0a0d14; }
  /* Era 2 — Symbolic: amber schematic environment, distinct from Origins' warm stone */
  .era-e2 { background:
      linear-gradient(rgba(8,11,18,0.9), rgba(8,11,18,0.94)),
      url('assets/bg-symbolic.png') center / cover no-repeat, var(--panel); }
  .era-e2 .panel { background: rgba(18,20,16,0.72); border-color: rgba(201,162,107,0.18); }
  .era-e2 .panel-label { color: #8fb1c6; }
  .era-e2 .era-tag { color: var(--accent); border-color: var(--accent); }
  .era-e2 .up-name, .era-e2 .pf-name, .era-e2 .rate-amt, .era-e2 .tile-name { color: #cfe0ec; }
  .era-sigil { width: 56px; height: 56px; object-fit: contain; opacity: 0.95; flex: none; filter: drop-shadow(0 0 8px rgba(201,162,107,0.3)); }
  .era-tag { font-size: 10px; letter-spacing: 2px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--ec); color: var(--ec); text-transform: uppercase; }
  .era-name { font-size: 18px; color: var(--text); }
  .era-name small { color: var(--dim); font-size: 10px; margin-left: 8px; letter-spacing: 0.5px; }
  .era-status { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .era-status.legacy { color: var(--dimmer); }
  .era-status.live { color: var(--good); }
  .era-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; transition: max-height 0.6s, opacity 0.5s, margin 0.5s; max-height: 6000px; }
  .panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px; }
  .panel-label { font-size: 11.5px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
  .act-btn { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--ec);
    background: rgba(255,255,255,0.02); color: var(--ec); font-family: inherit; font-size: 15px;
    letter-spacing: 1.5px; cursor: pointer; transition: transform 0.05s, box-shadow 0.15s; }
  .act-btn:hover:not(:disabled) { box-shadow: 0 0 18px rgba(255,255,255,0.06); }
  .act-btn:active:not(:disabled) { transform: scale(0.98); }
  .act-sub { font-size: 10px; color: var(--dim); text-align: center; margin-top: 8px; line-height: 1.5; }
  .up { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid rgba(28,39,64,0.5); }
  .up.has-ic { flex-direction: column; gap: 8px; align-items: stretch; }
  .up-ic { width: 66px; height: 66px; object-fit: contain; flex: none; align-self: center; }
  .up-main { width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .up:last-child { border-bottom: none; }
  .up-top { display: flex; justify-content: space-between; align-items: baseline; }
  .up-name { font-size: 16px; }
  .up-count { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .up-flavor { font-size: 14px; font-style: italic; color: var(--dim); line-height: 1.5; margin-bottom: 3px; }
  .up-desc { font-size: 14px; color: var(--dim); line-height: 1.55; }
  .up-buy { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px; font-family: inherit; font-size: 13px; color: var(--text); cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .up-buy:hover:not(:disabled) { border-color: var(--ec); }
  .up-buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .up-buy .c { color: var(--ec); }
  .up-buy:disabled .c { color: var(--danger); }
  .meter { height: 5px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; background: var(--ec); border-radius: 3px; transition: width 0.2s; }
  .meter-label { font-size: 10px; color: var(--dim); margin-top: 4px; display: flex; justify-content: space-between; }
  .compile-wrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .cstat { min-width: 92px; }
  .cstat .cs-label { font-size: 10px; letter-spacing: 1.4px; color: var(--dim); text-transform: uppercase; }
  .cstat .cs-val { font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .compile-act { flex: 1; min-width: 220px; }
  .fab-wrap { display: flex; gap: 18px; align-items: center; }
  .fab-ic { width: 96px; height: 96px; object-fit: contain; flex: none; filter: drop-shadow(0 0 10px rgba(255,205,107,0.25)); }
  .fab-body { flex: 1; }
  .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Era 2 theorem-proving */
  .sym-hero { background: linear-gradient(180deg, rgba(201,162,107,0.14), rgba(8,11,18,0.55)) !important; border-color: rgba(201,162,107,0.45) !important; }
  .sym-hero .proof-rate { font-size: 15px; }
  .sym-hero .meter { height: 8px; }
  .proof-rate { font-size: 12px; color: var(--e1); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .proof-active { margin-bottom: 12px; }
  .pa-top { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--dim); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .pa-top b { color: var(--text); }
  .pa-idle { font-size: 10px; color: var(--dim); font-style: italic; }
  .proof-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .proof-item { display: flex; flex-direction: column; align-items: stretch; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 14px 13px; background: var(--panel); transition: border-color 0.15s, box-shadow 0.15s; }
  .pf-ic { width: 66px; height: 66px; object-fit: contain; flex: none; align-self: center; }
  .pf-ic.glyph { width: 66px; height: 66px; align-self: center; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--ec); border: 1px solid var(--line); border-radius: 8px; }
  .pf-main { width: 100%; min-width: 0; }
  .proof-item.lemma { border-color: rgba(201,162,107,0.4); }
  .proof-item.active { border-color: var(--e1); box-shadow: 0 0 14px rgba(201,162,107,0.2); }
  .pf-name { font-size: 17px; color: var(--text); text-align: center; }
  .pf-lv { color: var(--accent); font-size: 10px; }
  .pf-desc { font-size: 14px; color: var(--dim); line-height: 1.5; margin-top: 3px; }
  .pf-btn { margin-top: 8px; width: 100%; }
  .auto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .proven-wrap { grid-column: 1 / -1; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .proven-lab { font-size: 10.5px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .proven-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .proven-chip { width: 48px; height: 48px; border: 1px solid var(--ec); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,205,107,0.08); }
  .proven-ic { width: 36px; height: 36px; object-fit: contain; }
  .proven-ic.glyph { color: var(--ec); font-size: 20px; }
  /* Era 3 — Statistical: objective banner, Training Focus, Origins supply strip */
  #tip { position: fixed; z-index: 95; max-width: 300px; background: var(--panel-2); border: 1px solid var(--ec, var(--accent)); border-radius: 9px; padding: 11px 13px; font-size: 13.5px; color: var(--text); line-height: 1.55; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 0.12s, transform 0.12s; box-shadow: 0 8px 28px rgba(0,0,0,0.55); }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip i { color: var(--dim); }
  .objective { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 9px 12px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .focus-row { display: flex; gap: 8px; }
  .focus-btn { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; text-align: left; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
  .focus-btn b { font-size: 12px; color: var(--text); letter-spacing: 0.5px; }
  .focus-btn span { font-size: 10px; color: var(--dim); line-height: 1.4; }
  .focus-btn.active { border-color: var(--accent); background: var(--panel-2); box-shadow: 0 0 12px rgba(127,230,196,0.18); }
  .focus-btn.active b { color: var(--accent); }
  .sup-lab { font-size: 10px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .sup-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sup-btn { flex: 1; min-width: 150px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; color: var(--text); transition: border-color 0.15s; }
  .sup-btn:hover:not(:disabled) { border-color: var(--accent); }
  .sup-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .sup-nm { font-size: 11px; } .sup-nm b { color: var(--accent); }
  .sup-cost { font-size: 10px; color: var(--dim); }
  .sup-rate { font-size: 10px; color: var(--dim); margin-top: 8px; font-variant-numeric: tabular-nums; }
  /* Era 1 — Origins: the refinement pipeline, warm ochre/stone */
  .flow-panel { background:
      linear-gradient(rgba(201,146,95,0.04) 1px, transparent 1px) 0 0 / 100% 30px,
      var(--panel-2); }
  .flow { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; transition: opacity 0.4s; }
  .flow-row.locked { opacity: 0.3; }
  .fnode { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 90px; padding: 8px 6px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .ficon { width: 40px; height: 40px; object-fit: contain; }
  .fglyph { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--e0); border: 1px solid rgba(201,146,95,0.5); border-radius: 9px; }
  .flab { font-size: 8.5px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; text-align: center; }
  .fval { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; min-height: 14px; }
  .farrow { color: var(--dimmer); font-size: 16px; }
  .age-label { color: var(--e0); font-size: 9px; letter-spacing: 1px; margin-left: 6px; }
  /* Origins central core */
  .core-panel { display: flex; align-items: center; justify-content: flex-start; gap: 24px; flex-wrap: wrap;
    background: radial-gradient(120% 160% at 18% 0%, rgba(201,146,95,0.08), transparent 60%), var(--panel-2); }
  .core-panel.solo { grid-column: 1 / -1; justify-content: center; } /* before Flows exists, fill the row */
  .core { position: relative; width: 140px; height: 140px; flex: none; display: flex; align-items: center; justify-content: center; }
  .core-ring { position: absolute; inset: 10px; border: 2px solid rgba(201,146,95,0.5); border-top-color: var(--e0); border-radius: 50%; animation: coreSpin 6s linear infinite; }
  .core-ring2 { inset: 26px; border-width: 1px; border-top-color: transparent; border-left-color: var(--e0); animation: coreSpin 9s linear infinite reverse; }
  .core::after { content: ""; position: absolute; inset: 36px; border-radius: 50%; background: radial-gradient(circle, rgba(201,146,95,0.35), transparent 70%); animation: corePulse 3s ease-in-out infinite; }
  .core-mid { position: relative; z-index: 1; font-size: 13px; letter-spacing: 1.5px; color: var(--e0); text-align: center; width: 110px; line-height: 1.3; }
  @keyframes coreSpin { to { transform: rotate(360deg); } }
  @keyframes corePulse { 0%,100% { opacity: 0.5; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes panelIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .panel.intro { animation: panelIn 0.55s ease-out; }
  .core-side { flex: 0 1 460px; min-width: 260px; }
  .core-verbs { display: flex; gap: 10px; }
  .core-verbs .act-btn { flex: 1; }
  .rates { margin-top: 4px; display: flex; flex-direction: column; }
  .rate { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(28,39,64,0.45); }
  .rate:last-child { border-bottom: none; }
  .rate-ic { width: 48px; height: 48px; object-fit: contain; flex: none; opacity: 0.95; }
  .rate-tx { display: flex; flex-direction: column; line-height: 1.1; }
  .rate-lab { font-size: 9.5px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .rate-amt { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .rate-ps { margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .rate-ps.pos { color: var(--good); }
  .rate-ps.neg { color: var(--danger); }
  .rate-ps.zero { color: var(--dimmer); }
  /* Works vs Research sections */
  .research-panel { background: linear-gradient(180deg, rgba(201,146,95,0.05), transparent 40%), var(--panel-2); }
  .ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 6px; }
  .tile { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); transition: border-color 0.15s, box-shadow 0.15s, opacity 0.4s; }
  .tile.disco.can { border-color: rgba(201,146,95,0.55); box-shadow: 0 0 14px rgba(201,146,95,0.12); }
  .tile.disco.owned { opacity: 0.6; border-color: rgba(201,146,95,0.4); background: rgba(201,146,95,0.07); }
  .tile-ic { width: 70px; height: 70px; object-fit: contain; flex: none; align-self: center; }
  .tile-ic.glyph { width: 70px; height: 70px; align-self: center; display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--e0);
    border: 1px solid rgba(201,146,95,0.45); border-radius: 9px; }
  .tile-body { width: 100%; min-width: 0; }
  .tile-name { font-size: 18px; color: var(--text); text-align: center; }
  .tile-count { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tile-flavor { font-size: 14px; font-style: italic; color: var(--dim); line-height: 1.45; margin: 2px 0; }
  .tile-mech { font-size: 14px; color: var(--dim); line-height: 1.45; }
  .tile-eff { margin-top: 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,0.18); }
  .eff-cap { font-size: 9.5px; letter-spacing: 1px; color: var(--dimmer); text-transform: uppercase; margin-bottom: 4px; }
  .eff-row { display: flex; justify-content: space-between; font-size: 10.5px; font-variant-numeric: tabular-nums; line-height: 1.55; }
  .eff-row span:first-child { color: var(--dim); text-transform: capitalize; }
  .eff-row.pos span:last-child { color: var(--good); }
  .eff-row.neg span:last-child { color: var(--danger); }
  .tile-btn { margin-top: 7px; width: 100%; }
  .tile.disco.owned .tile-btn { opacity: 0.5; }
  /* Research drawer */
  #drawerBg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 70; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #drawerBg.show { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 92vw); z-index: 71; background: var(--panel);
    border-left: 1px solid var(--line); transform: translateX(100%); transition: transform 0.3s ease-out;
    display: flex; flex-direction: column; box-shadow: -14px 0 44px rgba(0,0,0,0.55); }
  #drawer.show { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: 2px; color: var(--e0); text-transform: uppercase; }
  .drawer-head button { background: none; border: none; color: var(--dim); font-size: 20px; line-height: 1; cursor: pointer; }
  .drawer-head button:hover { color: var(--text); }
  #drawerBody { padding: 14px 16px; overflow-y: auto; }
  #drawerBody .ogrid { grid-template-columns: 1fr; }
  .research-btn { margin-top: 12px; position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px;
    border: 1px solid rgba(201,146,95,0.5); border-radius: 9px; background: rgba(201,146,95,0.06); color: var(--e0);
    font-family: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .research-btn:hover { border-color: var(--e0); }
  .research-btn.has { box-shadow: 0 0 16px rgba(255,205,107,0.22); border-color: var(--accent); }
  .rb-ic { width: 32px; height: 32px; object-fit: contain; }
  .rb-badge { min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #1a1206;
    font-size: 9px; font-weight: 700; display: none; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .rb-badge.show { display: inline-flex; }
  #toasts { position: fixed; top: 60px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px;
    max-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); animation: toastIn 0.4s ease-out; }
  .toast .th { font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  .toast .tb { font-size: 12px; line-height: 1.5; color: var(--text); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .float { position: absolute; font-size: 14px; font-weight: 600; animation: floatUp 0.9s ease-out forwards; font-variant-numeric: tabular-nums; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-46px) scale(1.1); } }
  #dev { position: fixed; left: 14px; bottom: 14px; z-index: 80; display: none; flex-direction: column; gap: 8px;
    background: rgba(8,11,18,0.92); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; backdrop-filter: blur(4px); }
  #dev.show { display: flex; }
  #dev .dh { font-size: 8.5px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; gap: 14px; }
  #dev .dh b { color: var(--accent); }
  #dev .row { display: flex; gap: 6px; }
  #dev button { font-family: inherit; font-size: 10px; letter-spacing: 0.5px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; transition: all 0.12s; }
  #dev button:hover { border-color: var(--accent); color: var(--text); }
  #dev button.on { border-color: var(--accent); color: var(--accent); background: rgba(255,205,107,0.08); }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div>
      <div class="logo"><img class="logo-wm" src="assets/wordmark.png" alt="EMERGENCE"></div>
      <div class="era-indicator" id="eraInd">SYMBOLIC ERA</div>
    </div>
    <div class="hdr-right">
      <div class="buymode" id="buyMode"></div>
      <div class="res-bar" id="resBar"></div>
    </div>
  </header>
  <main>
    <div id="coldopen">
      <img class="co-wordmark" src="assets/wordmark.png" alt="EMERGENCE">
      <div class="co-title">a record, beginning</div>
      <div class="co-count" id="coCount">0<small>MARKS</small></div>
      <button class="big-btn" id="coBtn">INSCRIBE A MARK</button>
      <div class="co-hint" id="coHint">Before intelligence could grow, it had to be written down. One mark at a time.</div>
    </div>
    <div id="eras"></div>
    <div id="vizwrap"><canvas id="viz"></canvas><div class="viz-cap">THE&nbsp;SUBSTRATE</div></div>
  </main>
</div>
<div id="fx"></div>
<div id="toasts"></div>
<div id="tip"></div>
<div id="dev"></div>
<div id="drawerBg"></div>
<div id="drawer"><div class="drawer-head"><span>RESEARCH &middot; one-time discoveries</span><button id="drawerClose">&times;</button></div><div id="drawerBody"></div></div>
<script>
(() => {
  const CFG = {
    tickMs: 100,
    e1: { // ERA 1 — Origins (inscription + materials, converging on silicon)
      inscribeBase: 1, quarryBase: 1,
      scribeCost: 12, scribeGrowth: 1.16, scribeYield: 0.9,        // marks/sec
      minerCost: 16, minerGrowth: 1.16, minerYield: 0.9,           // ore/sec
      scriptoriumCost: 45, scriptoriumGrowth: 1.19, scriptoriumRate: 1.1,  // marks -> knowledge /sec
      smelterCost: 55, smelterGrowth: 1.19, smelterRate: 1.3,      // ore -> metal /sec (drinks ore faster)
      foundryCost: 350, foundryGrowth: 1.2, foundryRate: 0.8,      // metal+knowledge -> silicon /sec
      scriptoriumUpkeep: 0.35, // Ore burned per Knowledge made (tablets, styluses) — Knowledge drains Materials
      smelterUpkeep: 0.25,     // Knowledge burned per Metal made (smithing know-how) — Materials drains Knowledge
      siliconGate: 120,        // silicon needed to fabricate the Logic Machine (after the ~5-min Foundry beat)
    },
    e2: { // ERA 2 — Symbolic (theorem-proving research + compile journey)
      clickBase: 1,
      rulesetCost: 10, rulesetGrowth: 1.16, rulesetYield: 0.42,
      daemonCost: 320, daemonGrowth: 1.19, daemonRate: 2.0, // auto-writes/sec per daemon
      axiomDivisor: 200,  // axioms from a compile = floor(sqrt(runRules / divisor))
      axiomBonus: 0.05,   // +5% to all rule production per Axiom (×1.5 with Meta-Logic)
      infPerRuleset: 1.3, // Inference/sec generated per Ruleset (drives proving)
      infScale: 0.11,     // a Theorem's proof cost (inference) = node.cost × this
      lemmaBase: 50, lemmaGrowth: 1.9, lemmaBonus: 0.08, // repeatable Optimization lemma
      infCapBase: 120, infCapStep: 220,                  // banked Inference cap = base + level×step
      capLemmaBase: 80, capLemmaGrowth: 1.7,             // cost to prove the next Inference Capacity level
    },
    e3: { // ERA 3 — Statistical (experiments + accuracy curve + Training Focus + probabilistic discovery)
      datasetCost: 30, datasetGrowth: 1.16, datasetYield: 1.2,   // Data/sec per Dataset (bought with SILICON — reach-back to Origins)
      modelCost: 90, modelGrowth: 1.2, expPerModel: 0.3,         // experiments/sec per Model (bought with Data)
      modelSilicon: 0.05,    // light upkeep: Silicon/sec drawn per Model (keeps Origins' Foundry relevant)
      expDataCost: 4,        // Data spent per experiment
      accGain: 0.004,        // accuracy gained per experiment × (1 - accuracy)  [slow diminishing climb, ~7-9 min]
      insightPerExp: 2,      // Insight per experiment × effective accuracy
      gapGrow: 0.0035,       // overfit gap growth per experiment (Fit) — below Fit's accuracy gain, so Fit still nets forward
      gapReduce: 0.007,      // gap reduction per experiment (Generalize); ×2 with Regularization — so Regularization really matters
      gapMax: 0.6,
      discoverBase: 0.012, dataDiscover: 0.00002, // method-discovery odds per experiment (rise with Data; Explore focus)
      genThreshold: 0.88,    // effective accuracy that generalizes → Era 4 (high enough that you need the Methods)
      seedDatasets: 3, seedSilicon: 220,
      // Training Focus — the live decision. {acc, gap-grow, gap-reduce, discovery, insight} multipliers
      focus: {
        fit:        { acc:1.7, gap:1.5, red:0,   disc:0.3, ins:1.0, label:'Fit',        desc:'Accuracy climbs fast — but the overfit gap grows.' },
        generalize: { acc:0.3, gap:0,   red:1.0, disc:0.3, ins:1.2, label:'Generalize', desc:'Shrinks the overfit gap. Accuracy only creeps.' },
        explore:    { acc:0.4, gap:0.5, red:0,   disc:2.6, ins:0.8, label:'Explore',    desc:'Hunts for new Methods. Accuracy holds.' },
      },
    },
    // Eras 4-5 still run on the original scaffold; rebuilt in a later pass.
    computeCost: 35, computeGrowth: 1.22, computePer: 0.5,
    trainCost: 90, trainGrowth: 1.28,
    era4Gate: 30,
    scaleCost: 45, scaleGrowth: 1.26,
  };
  function freshState(){ return {
    t: 0, started: false, era: 1, maxEra: 1, speed: 1, dev: false, buyMode: '1',
    // Era 1 — Origins
    marks: 0, knowledge: 0, ore: 0, metal: 0, silicon: 0, age: 1,
    scribe: 0, miner: 0, scriptorium: 0, smelter: 0, foundry: 0, disco: {},
    // Era 2 — Symbolic
    rules: 0, runRules: 0, axioms: 0, totalAxioms: 0, compiles: 0,
    ruleset: 0, daemon: 0,
    inference: 0, activeProof: null, proofAcc: {}, optLevel: 0, infCapLevel: 0, // theorem-proving research
    // Era 3 — Statistical
    data: 0, insight: 0, accuracy: 0, gap: 0, methods: {}, focus: 'fit',
    dataset: 0, model: 0,
    // Era 4-5 scaffold
    capability: 0, scale: 0, compute: 0, training: 0, cluster: 0,
    tech: {}, obsolete: {}, collapsed: {}, flags: {}, clicks: 0,
  }; }
  const S = freshState();
  const RATES = { marks:0, knowledge:0, ore:0, metal:0, silicon:0, rules:0, data:0, insight:0 }; // net per-second flow, captured each tick
  let viewEra = 1; // the era currently most in view (drives the contextual top bar); follows scroll
  // Progressive UI: each section animates in only the first time it appears (survives re-renders).
  const _seen = new Set();
  function intro(key){ if(_seen.has(key)) return ''; _seen.add(key); return ' intro'; }
  // --- Run Recorder: semantic telemetry for pacing analysis (exported from the dev panel) ---
  const REC = { v:2, events:[], snaps:[], clicks:{}, lastSnap:-1 };
  function recEvent(ev, extra){ REC.events.push(Object.assign({ gt:+S.t.toFixed(1) }, extra||{}, { ev })); }
  function recClick(kind){ const b=Math.floor(S.t/5)*5; (REC.clicks[b]=REC.clicks[b]||{inscribe:0,quarry:0})[kind]++; }
  function recSnap(){ const b=Math.floor(S.t/10)*10; if(b===REC.lastSnap) return; REC.lastSnap=b;
    REC.snaps.push({ gt:b, mk:+S.marks.toFixed(1), or:+S.ore.toFixed(1), kn:+S.knowledge.toFixed(1), mt:+S.metal.toFixed(1), si:+S.silicon.toFixed(1),
      sc:S.scribe, mi:S.miner, scr:S.scriptorium, sm:S.smelter, fo:S.foundry }); }
  function exportRun(){
    const out=JSON.stringify({ ...REC, speed:S.speed, age:S.age, done:!!S.flags.origindone,
      targets:Object.fromEntries(DISCO.filter(d=>d.target).map(d=>[d.id,d.target])) });
    try{ navigator.clipboard.writeText(out); toast('RUN COPIED','Pacing data on your clipboard — paste it to me to tune.'); }
    catch(e){ console.log('EMERGENCE_RUN '+out); toast('RUN LOGGED','Clipboard blocked; full data is in the console.'); }
  }
  const ERAS = {
    1: { color: 'var(--e0)', tag: 'Origins', name: 'From Marks to Matter', sub: 'recording the world, then reshaping it', sigil: 'assets/era1-sigil.png' },
    2: { color: 'var(--e1)', tag: 'Symbolic', name: 'Hand-Written Logic', sub: 'rules authored by hand', sigil: 'assets/sigil-symbolic.png' },
    3: { color: 'var(--e2)', tag: 'Statistical', name: 'Learning From Data', sub: 'patterns drawn from examples', sigil: 'assets/sigil-statistical.png' },
    4: { color: 'var(--e3)', tag: 'Deep', name: 'Neural Scaling', sub: 'compute-bound capability' },
    5: { color: 'var(--e4)', tag: 'Foundation', name: 'Emergent Generality', sub: 'the curve bends vertical' },
  };
  // ---- Era 1 tech tree (the Symbolic blueprint). row = tier (top→down), col = horizontal slot. ----
  const TREE = [
    { id:'formalLogic', name:'Formal Logic',      cost:50,    req:[],                          row:0, col:0,    desc:'+50% to all rule production. The base of every technique above.' },
    { id:'fwdChain',    name:'Forward Chaining',  cost:160,   req:['formalLogic'],             row:1, col:-1.1, desc:'Rulesets are 80% more productive.' },
    { id:'bwdChain',    name:'Backward Chaining', cost:160,   req:['formalLogic'],             row:1, col:1.1,  desc:'Writing a rule by hand is 3× stronger.' },
    { id:'rete',        name:'Rete Network',      cost:750,   req:['fwdChain'],                row:2, col:-1.8, desc:'Each Ruleset boosts every other Ruleset (+3% each).' },
    { id:'inference',   name:'Inference Engine',  cost:1200,  req:['fwdChain','bwdChain'],     row:2, col:0,    desc:'Unlocks Inference Daemons — automation that writes rules as if you were clicking.' },
    { id:'heuristics',  name:'Heuristic Search',  cost:750,   req:['bwdChain'],                row:2, col:1.8,  desc:'Manual + Daemon writing scales with Rulesets owned (+8% each).' },
    { id:'knowledge',   name:'Knowledge Base',    cost:3400,  req:['rete','inference'],        row:3, col:-1.0, desc:'Unlocks Compile — distil a whole run into permanent Axioms.' },
    { id:'metalogic',   name:'Meta-Logic',        cost:11000, req:['knowledge'],               row:3, col:1.0,  desc:'Every Axiom becomes 50% more powerful.' },
    { id:'expert',      name:'Expert System',     cost:60000, req:['metalogic','heuristics'], reqAxioms:6, row:4, col:0, desc:'Complete the Symbolic Era. A system that reasons on its own — and the ceiling hand-written logic can never break.' },
  ];
  const TREEMAP = Object.fromEntries(TREE.map(n=>[n.id,n]));
  // ---- Era 1 (Origins) discoveries: a web of one-time unlocks; Knowledge (K) and Materials (M) interleave and cross-gate. ----
  const DISCO = [
    { id:'tally',        name:'Tally Marks',    res:'marks',     cost:6,   req:[],                         flavor:'A notch for each thing worth counting.',           mech:'Inscribing by hand is twice as productive.' },
    { id:'scribe',       name:'The Scribe',     res:'marks',     cost:20,  req:['tally'],                  flavor:'Hands trained to the work, and only the work.',     mech:'Unlocks the Scribe — automates Marks.',               effect(){ S.flags.canScribe=true; } },
    { id:'stoneworking', name:'Stoneworking',   res:'marks',     cost:38,  req:['tally'],                  target:30,  flavor:'The first deliberate reshaping of the world.',      mech:'Unlocks Quarrying and Miners.',                       effect(){ S.flags.o_materials=true; } },
    { id:'apprenticeship',name:'Apprenticeship', costs:{marks:277, ore:315}, req:['scribe','stoneworking'], flavor:'A craft taught, not stumbled into.',                mech:'Scribes and Miners work 50% faster.' },
    { id:'clayTablets',  name:'Clay Tablets',   res:'marks',     cost:110, req:['scribe','stoneworking'],  reqRes:{ore:15},  target:60,  flavor:'Something firmer than memory to hold a thought.',   mech:'Unlocks the Scriptorium — Marks become Knowledge.',   effect(){ S.flags.o_scriptorium=true; } },
    { id:'kiln',         name:'The Kiln',       res:'ore',       cost:110, req:['clayTablets'],            reqRes:{knowledge:30}, target:120, flavor:'Captured fire, hot enough to change a stone.',      mech:'Unlocks the Smelter — Ore becomes Metal. (Bronze Age)',effect(){ S.flags.o_smelter=true; S.age=2; } },
    { id:'alphabet',     name:'The Alphabet',   res:'knowledge', cost:120, req:['clayTablets'],            flavor:'A handful of signs that can spell anything at all.',mech:'Scriptoria work 60% faster.' },
    { id:'bronzeCasting',name:'Bronze Casting', res:'metal',     cost:90,  req:['kiln'],                   flavor:'Pour the metal; let the mold decide its shape.',    mech:'Smelters work 60% faster.' },
    { id:'wheel',        name:'The Wheel',      res:'ore',       cost:130, req:['kiln'],                   flavor:'The load that once broke backs now simply rolls.',  mech:'Miners haul 80% more Ore — but Scribes, pulled to the carts, work 20% slower.' },
    { id:'numerals',     name:'Numerals',       res:'knowledge', cost:520, req:['alphabet'],               flavor:'Number slips free of the things it counts.',        mech:'Every converter works 30% faster.' },
    { id:'glassmaking',  name:'Glassmaking',    res:'metal',     cost:430, req:['bronzeCasting'],          flavor:'Sand, melted, taught to hold the light.',           mech:'Foundries run 50% faster.' },
    { id:'theFoundry',   name:'The Foundry',    res:'knowledge', cost:780, req:['numerals','glassmaking'], reqRes:{metal:230}, target:300, flavor:'Knowledge and matter, fused on purpose.',          mech:'Unlocks the Foundry — Metal + Knowledge become Silicon. (Silicon Age)', effect(){ S.flags.o_foundry=true; S.age=3; } },
  ];
  const DISCOMAP = Object.fromEntries(DISCO.map(n=>[n.id,n]));
  const BUILD_UNLOCK = { scribe:()=>S.flags.canScribe, miner:()=>S.flags.o_materials, scriptorium:()=>S.flags.o_scriptorium, smelter:()=>S.flags.o_smelter, foundry:()=>S.flags.o_foundry };
  const MILES = [
    // ERA 1 — Origins: two linear tracks (Knowledge, Materials) cross-gating into Silicon.
    { id:'o_reveal', cond:()=> S.marks>=8,
      fire:()=>{ revealGame();
        toast('THE FIRST RECORD','Knowledge can be discovered and built on. Spend Marks below to open the web of technique — and watch the two crafts feed each other.'); } },
    { id:'o_fabricate', cond:()=> S.flags.o_foundry && S.silicon>=CFG.e1.siliconGate,
      fire:()=>{ S.flags.canFabricate=true; toast('FABRICATION','Enough Silicon to build the first <b>Logic Machine</b>. The age of matter ends; the age of logic begins.'); } },
    { id:'era2', cond:()=> S.flags.origindone,
      fire:()=>{ S.flags.canRuleset=true;
        S.ruleset += Math.max(2, Math.min(8, Math.floor(S.knowledge/300)));  // the Logic Machine boots with momentum
        S.rules += Math.min(1500, Math.floor(S.knowledge*0.5));               // your Knowledge becomes its first rules
        openEra(2);
        toast('PARADIGM SHIFT','The Logic Machine runs. Your <b>Knowledge</b> seeds its first Rules and Rulesets — the Symbolic Era begins already in motion.'); } },
    // ERA 2 — Symbolic internals
    { id:'treeUnlock', cond:()=> S.ruleset>=2,
      fire:()=>{ S.flags.tree=true; toast('SYMBOLIC TECHNIQUE','A map of technique opens. Spend Rules to unlock <b>Formal Logic</b>, then branch outward.'); } },
    { id:'compileUnlock', cond:()=> S.tech.knowledge,
      fire:()=>{ S.flags.compile=true; toast('COMPILE','<b>Compile</b> a run into permanent <b>Axioms</b> that multiply everything.'); } },
    { id:'era3', cond:()=> S.flags.symbolicDone,
      fire:()=>{ S.dataset += CFG.e3.seedDatasets; S.silicon += CFG.e3.seedSilicon; openEra(3); // seed Datasets + Silicon so it starts in motion; scaling needs more Silicon (Origins)
        toast('THE STATISTICAL ERA','Hand-written logic has hit its ceiling. Now intelligence is <b>learned from Data</b>. Datasets run on <b>Silicon</b> — to grow, you reopen the Foundry. Set your <b>Training Focus</b> and experiment toward a model that generalizes.'); } },
    // ERA 4-5 — original scaffold, rebuilt in a later pass.
    { id:'era4', cond:()=> S.maxEra>=3 && effAccuracy()>=CFG.e3.genThreshold,
      fire:()=>{ openEra(4); toast('THE DEEP LEARNING ERA','Your model generalizes. Data and statistics are no longer enough — now <b>Compute</b> is the bottleneck.'); } },
    { id:'era4auto', cond:()=> S.compute>=3,
      fire:()=>{ S.flags.canTrain=true; toast('TRAINING RUNS','Spend Compute and Insight on <b>Training</b> to build raw <b>Capability</b>.'); } },
    { id:'era5', cond:()=> S.capability>=CFG.era4Gate,
      fire:()=>{ openEra(5); toast('FOUNDATION MODELS','Capability compounds into something general. Everything you built becomes an input to something larger.'); } },
    { id:'emergent', cond:()=> S.scale>=50,
      fire:()=>{ toast('EMERGENCE','The system keeps accelerating. This is where the real design work begins.'); } },

      for(const key of WORKS_ORDER){ const el=$('eff-'+key); if(!el) continue; const h=buildEffect(key); if(el._html!==h){ el.innerHTML=h; el._html=h; } }
      for(const [k] of RATE_DEFS){ if(!$('ramt-'+k)) continue;
        setText('ramt-'+k, fmt(S[k]));
        const rt=RATES[k]||0, ps=$('rps-'+k), cls='rate-ps '+(rt>0.0005?'pos':(rt<-0.0005?'neg':'zero'));
        setText('rps-'+k, (rt>=0?'+':'')+fmt(rt)+'/s');
        if(ps && ps.className!==cls) ps.className=cls;
      }
      for(const n of DISCO){ const btn=$('dsc-'+n.id); if(!btn) continue; const tile=$('dtile-'+n.id);
        if(S.disco[n.id]){ setClass(tile,'tile disco owned'); if(btn._html!=='DISCOVERED'){ btn.innerHTML='DISCOVERED'; btn._html='DISCOVERED'; } if(!btn.disabled) btn.disabled=true; }
        else { const can=canBuyDisco(n.id);
          let req=''; if(n.reqRes){ for(const k in n.reqRes){ if(S[k]<n.reqRes[k]) req+=' · needs '+n.reqRes[k]+' '+k; } }
          const costTxt = n.costs ? Object.keys(n.costs).map(k=>fmt(n.costs[k])+' '+k).join(' + ') : fmt(n.cost)+' '+n.res;
          const h='DISCOVER · <span class="c">'+costTxt+'</span>'+req;
          if(btn._html!==h){ btn.innerHTML=h; btn._html=h; }
          if(btn.disabled!==!can) btn.disabled=!can;
          setClass(tile,'tile disco'+(can?' can':''));
        }
      }
      const ms=$('meter-silicon'); if(ms){ ms.style.width=Math.min(100,(S.silicon/CFG.e1.siliconGate)*100)+'%'; setText('meter-silicon-val',fmt(S.silicon)+' / '+CFG.e1.siliconGate); }
      const fbtn=$('fabricateBtn'); if(fbtn && fbtn.disabled!==!S.flags.canFabricate) fbtn.disabled=!S.flags.canFabricate;
    }
    // theorem-proving
    for(const key of ['ruleset','daemon']){ const el=$('eff-'+key); if(el){ const h=buildEffect(key); if(el._html!==h){ el.innerHTML=h; el._html=h; } } }
    const ir=$('infRate');
    if(ir){
      setText('infRate', 'Inference  '+fmt(S.inference)+' / '+fmt(infCap())+'   ·   +'+fmt(symInfRate())+'/s'+(S.ruleset===0?' (build Rulesets to reason)':''));
      const pa=$('proofActive');
      if(pa){ if(S.activeProof){ const id=S.activeProof, c=proofCost(id), acc=S.proofAcc[id]||0, pct=Math.min(100,acc/c*100);
          const nm = id==='optimization'?('Optimization Lv '+(S.optLevel+1)) : id==='capacity'?('Inference Capacity Lv '+(S.infCapLevel+1)) : TREEMAP[id].name;
          const rate=symInfRate(), eta=rate>0?Math.ceil((c-acc)/rate):0;
          pa.innerHTML='<div class="pa-top"><span>Proving: <b>'+nm+'</b></span><span>'+fmt(acc)+' / '+fmt(c)+(eta?'  ·  ~'+eta+'s':'')+'</span></div><div class="meter"><i style="width:'+pct+'%;background:var(--e1)"></i></div>';
        } else { pa.innerHTML='<div class="pa-idle">No active proof — pick a theorem below to aim your Inference at it.</div>'; } }
      // each provable item's button
      const items=['optimization','capacity', ...TREE.filter(n=>!S.tech[n.id]&&n.req.every(r=>S.tech[r])).map(n=>n.id)];
      for(const id of items){ const btn=$('pfb-'+id); if(!btn) continue;
        const c=proofCost(id), active=S.activeProof===id;
        const lockAx = TREEMAP[id] && TREEMAP[id].reqAxioms && S.axioms<TREEMAP[id].reqAxioms;
        let h;
        if(active) h='PROVING…';
        else if(lockAx) h='needs '+TREEMAP[id].reqAxioms+' axioms';
        else h='PROVE · <span class="c">'+fmt(c)+' inf</span>';
        if(btn._html!==h){ btn.innerHTML=h; btn._html=h; }
        const dis = active || lockAx; if(btn.disabled!==dis) btn.disabled=dis;
        setClass($('pf-'+id), 'proof-item'+(id==='optimization'?' lemma':'')+(active?' active':''));
      }
    }
    // compile
    const cb=$('compileBtn');
    if(cb){ const g=axiomGain();
      setText('axVal', fmt(S.axioms));
      setText('axBonus', '+'+Math.round(S.axioms*st.axBonus*100)+'%');
      const html='COMPILE · <span class="c" style="color:var(--accent)">+'+g+' axioms</span>';
      if(cb._html!==html){ cb.innerHTML=html; cb._html=html; }
      if(cb.disabled!==(g<1)) cb.disabled=(g<1);
    }
    const ma=$('meter-acc');
    if(ma){ const eff=effAccuracy(), thr=CFG.e3.genThreshold;
      ma.style.width=Math.min(100, eff/thr*100)+'%';
      setText('acc-val', (eff*100).toFixed(1)+'%  (raw '+(S.accuracy*100).toFixed(0)+'%, gap '+(S.gap*100).toFixed(0)+'%)');
      const exps=S.model*CFG.e3.expPerModel;
      setText('accRate', 'Accuracy '+(S.accuracy*100).toFixed(1)+'%  ·  '+fmt(exps)+' exp/s  ·  Focus: '+curFocus().label+(S.data<CFG.e3.expDataCost?'  ·  need Data':''));
      ['fit','generalize','explore'].forEach(k=>{ const fb=$('foc-'+k); if(fb) fb.classList.toggle('active', S.focus===k); });
      for(const key of ['foundry','smelter','scriptorium']){ const sb=$('sup-'+key); if(sb){ const c=totalCost(BUYS[key],1); setText('supc-'+key,'×'+S[key]); setText('supx-'+key, fmt(c)+' '+BUYS[key].res); sb.disabled = S[BUYS[key].res] < c; } }
      setText('supSi', 'Silicon '+fmt(S.silicon)+'  ·  '+S.foundry+' Foundries  ·  Models draw '+fmt(S.model*CFG.e3.modelSilicon)+'/s');
      for(const key of ['dataset','model']){ const el=$('eff-'+key); if(el){ const h=buildEffect(key); if(el._html!==h){ el.innerHTML=h; el._html=h; } } } }
    const msc=$('meter-scale'); if(msc){ msc.style.width=Math.min(100,(S.scale/50)*100)+'%'; setText('meter-scale-val',fmt(S.scale)+' / 50'); }
  }
  // --- Dev tools (hidden; toggle with the backtick ` key, or open with ?dev=1) ---
  const SPEEDS=[1,3,10,50];
  function grant(){ // give a generous push to whatever the current era needs
    if(S.maxEra>=5) S.capability+=500;
    else if(S.maxEra>=4) S.insight+=500;
    else if(S.maxEra>=3){ S.data+=500; S.rules+=500; }
    else if(S.maxEra>=2){ S.rules+=5000; S.runRules+=5000; }
    else { S.marks+=500; S.ore+=500; S.knowledge+=200; S.metal+=200; S.silicon+=50; if(!S.flags.firstAuto) revealGame(); }
    if(S.flags.firstAuto) render();
  }
  function softReset(){ // instant in-memory restart to the cold open (keeps dev panel + speed)
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    const dev=S.dev, speed=S.speed;
    Object.assign(S, freshState()); S.dev=dev; S.speed=speed; _seen.clear(); toggleDrawer(false);
    REC.events.length=0; REC.snaps.length=0; REC.clicks={}; REC.lastSnap=-1;
    $('eras').style.display='none'; $('hdr').classList.remove('show'); $('vizwrap').style.display='none';
    const co=$('coldopen'); co.style.display='flex'; co.style.opacity='1';
    $('coHint').textContent='Before intelligence could grow, it had to be written down. One mark at a time.';
    renderCold(); renderDev();
  }
  function renderDev(){
    if(!S.dev) return;
    $('dev').innerHTML =
      '<div class="dh"><span>DEV &middot; <b>'+S.speed+'×</b> &middot; t=<b id="devT">'+Math.floor(S.t)+'</b>s</span><span>` to hide</span></div>'+
      '<div class="row">'+SPEEDS.map(s=>'<button data-spd="'+s+'" class="'+(S.speed===s?'on':'')+'">'+s+'×</button>').join('')+'</div>'+
      '<div class="row"><button data-grant="1">+resources</button><button data-soft="1">reset</button><button data-reset="1">hard reset</button></div>'+
      '<div class="row"><button data-export="1">export run (copy JSON)</button></div>';
    $('dev').querySelectorAll('[data-spd]').forEach(b=> b.onclick=()=>{ S.speed=+b.dataset.spd; renderDev(); });
    $('dev').querySelector('[data-grant]').onclick=grant;
    $('dev').querySelector('[data-export]').onclick=exportRun;
    $('dev').querySelector('[data-soft]').onclick=softReset;
    $('dev').querySelector('[data-reset]').onclick=()=>{ if(confirm('Wipe all progress and reload?')){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} location.reload(); } };
  }
  function toggleDev(on){ S.dev = on!==undefined?on:!S.dev; $('dev').classList.toggle('show',S.dev); if(S.dev) renderDev(); }
  let uiDrawer=false;
  function toggleDrawer(open){ uiDrawer = open!==undefined?open:!uiDrawer; $('drawer').classList.toggle('show',uiDrawer); $('drawerBg').classList.toggle('show',uiDrawer); }
  // The whole page re-skins to whichever era you're looking at (scroll-driven, like Inscryption's acts).
  function setTheme(n){ if(typeof document==='undefined'||!document.body) return; const c='theme-'+n; if(document.body.className!==c) document.body.className=c; }
  let _eraIO=null;
  function watchEraThemes(){
    if(typeof IntersectionObserver==='undefined') return;
    if(_eraIO) _eraIO.disconnect();
    _eraIO=new IntersectionObserver(()=>{
      let top=null, topVis=-1;
      document.querySelectorAll('#eras .era').forEach(el=>{ const r=el.getBoundingClientRect();
        const vis=Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0));
        if(vis>topVis){ topVis=vis; top=el; } });
      if(top && top.dataset.era){ const ve=+top.dataset.era; setTheme(ve);
        if(ve!==viewEra){ viewEra=ve; buildHeader(); refresh(); } } // bar follows the era in view
    }, { threshold:[0,0.25,0.5,0.75,1] });
    document.querySelectorAll('#eras .era').forEach(el=> _eraIO.observe(el));
  }
  window.addEventListener('keydown', e=>{ if(e.key==='`'||e.key==='~'){ e.preventDefault(); toggleDev(); } });
  // Hover tooltips: any [data-tip] element reveals its flavor + mechanical detail
  const _tip=$('tip'); let _tipEl=null;
  function placeTip(e){ const m=16; let x=e.clientX+m, y=e.clientY+m; const w=_tip.offsetWidth, h=_tip.offsetHeight;
    if(x+w>window.innerWidth-8) x=e.clientX-w-m; if(y+h>window.innerHeight-8) y=window.innerHeight-h-8; if(x<8)x=8; if(y<8)y=8;
    _tip.style.left=x+'px'; _tip.style.top=y+'px'; }
  document.addEventListener('mouseover', e=>{ const t=e.target.closest?e.target.closest('[data-tip]'):null;
    if(t && t!==_tipEl){ _tipEl=t; _tip.innerHTML=t.getAttribute('data-tip'); _tip.classList.add('show'); placeTip(e); } });
  document.addEventListener('mousemove', e=>{ if(_tipEl) placeTip(e); });
  document.addEventListener('mouseout', e=>{ if(_tipEl){ const to=e.relatedTarget; if(!to || !(to.closest && to.closest('[data-tip]'))){ _tip.classList.remove('show'); _tipEl=null; } } });
  if(/[?&]dev=1/.test(location.search)) toggleDev(true);

  // --- The Substrate: live visualization of the system ---
  const VIZ_STATIONS=[
    { key:'ruleset', era:2, label:'RULES',    color:'#c9a26b', count:()=>S.ruleset,  live:()=>S.ruleset>0 },
    { key:'dataset', era:3, label:'DATA',     color:'#6ec6a8', count:()=>S.dataset,  live:()=>S.dataset>0 },
    { key:'model',   era:3, label:'MODELS',   color:'#6ec6a8', count:()=>S.model,    live:()=>S.model>0 },
    { key:'compute', era:4, label:'COMPUTE',  color:'#6ea8ff', count:()=>S.compute,  live:()=>S.compute>0 },
    { key:'training',era:4, label:'TRAINING', color:'#6ea8ff', count:()=>S.training, live:()=>S.training>0 },
    { key:'cluster', era:5, label:'SCALE',    color:'#b78bff', count:()=>S.cluster,  live:()=>S.cluster>0 },
  ];
  const viz=(()=>{
    const cv=$('viz'); if(!cv||!cv.getContext) return { start(){} };
    const ctx=cv.getContext('2d'); let W=0,H=0,pulses=[],last=0,running=false;
    const TAU=Math.PI*2;
    function hexA(c,a){ const n=parseInt(c.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
    function resize(){ const dpr=window.devicePixelRatio||1; const r=cv.getBoundingClientRect();
      W=r.width||1000; H=r.height||210; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    function obsolete(s){ return (s.era===1&&S.obsolete[1])||(s.era===2&&S.obsolete[2]); }
    function visible(){ return VIZ_STATIONS.filter(s=> s.era<=S.maxEra); }
    function layout(st){ const padX=72,padR=44,usable=Math.max(1,W-padX-padR),span=Math.max(1,st.length-1);
      st.forEach((s,i)=>{ s._x= st.length===1? W/2 : padX+usable*i/span; s._y= H/2 + Math.sin(i*1.3)*24; }); }
    function frame(now){
      if(!running) return;
      const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
      ctx.clearRect(0,0,W,H);
      const st=visible(); layout(st);
      for(let i=0;i<st.length-1;i++){ const a=st[i],b=st[i+1];
        const active=a.live() && !obsolete(a);
        ctx.strokeStyle= active? hexA(b.color,0.18):'rgba(120,140,180,0.05)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(a._x,a._y); ctx.lineTo(b._x,b._y); ctx.stroke();
        if(active && Math.random() < Math.min(0.45, 0.05+a.count()*0.012)) pulses.push({i,p:0,color:b.color});
      }
      for(const pl of pulses) pl.p += dt*0.85;
      pulses = pulses.filter(pl=> pl.p<1 && st[pl.i] && st[pl.i+1]);
      for(const pl of pulses){ const a=st[pl.i],b=st[pl.i+1]; const x=a._x+(b._x-a._x)*pl.p, y=a._y+(b._y-a._y)*pl.p;
        ctx.fillStyle=hexA(pl.color,0.95); ctx.beginPath(); ctx.arc(x,y,2.1,0,TAU); ctx.fill();
        ctx.fillStyle=hexA(pl.color,0.22); ctx.beginPath(); ctx.arc(x,y,5,0,TAU); ctx.fill(); }
      st.forEach((s,idx)=>{ const cnt=s.count(), ob=obsolete(s);
        const r=(4+Math.min(20,Math.sqrt(cnt)*2.4))*(1+Math.sin(now/600+idx)*0.06);
        const col= ob? '#8a93a8' : s.color, lit= ob?0.16:0.5;
        const g=ctx.createRadialGradient(s._x,s._y,0,s._x,s._y,r*3);
        g.addColorStop(0,hexA(col,lit)); g.addColorStop(1,hexA(col,0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s._x,s._y,r*3,0,TAU); ctx.fill();
        const sats=Math.min(cnt,10);
        for(let k=0;k<sats;k++){ const ang=now/1400+k*(TAU/sats), sr=r+9;
          ctx.fillStyle=hexA(col, ob?0.2:0.6); ctx.beginPath(); ctx.arc(s._x+Math.cos(ang)*sr,s._y+Math.sin(ang)*sr,1.5,0,TAU); ctx.fill(); }
        ctx.fillStyle=hexA(col, ob?0.4:0.95); ctx.beginPath(); ctx.arc(s._x,s._y,Math.max(2,r*0.4),0,TAU); ctx.fill();
        ctx.strokeStyle=hexA(col,ob?0.25:0.5); ctx.lineWidth=1; ctx.beginPath(); ctx.arc(s._x,s._y,r,0,TAU); ctx.stroke();
        ctx.fillStyle=hexA(col, ob?0.3:0.55); ctx.font='8px ui-monospace,Menlo,monospace'; ctx.textAlign='center';
        ctx.fillText(s.label+(cnt>0?' '+fmt(cnt):''), s._x, s._y+r*3+11);
      });
      requestAnimationFrame(frame);
    }
    return { start(){ if(running) return; running=true; resize(); window.addEventListener('resize',resize); requestAnimationFrame(frame); } };
  })();

  // --- Persistence ---
  const SAVE_KEY='emergence-save';
  const OFFLINE_CAP=8*3600; // seconds of offline progress credited at most
  function save(){
    try{ const out={...S}; delete out.dev; delete out.speed;
      if(REC.snaps.length>5000) REC.snaps=REC.snaps.slice(-5000); // cap telemetry growth
      localStorage.setItem(SAVE_KEY, JSON.stringify({S:out, REC, lastSave:Date.now(), v:1})); }catch(e){}
  }
  function load(){
    try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null;
      const d=JSON.parse(raw); if(!d||!d.S) return null;
      Object.assign(S, d.S);            // saved fields override defaults; dev/speed stay at literal defaults
      if(d.REC) Object.assign(REC, d.REC); // resume telemetry so a run survives reloads (full start->finish)
      return d.lastSave||null;
    }catch(e){ return null; }
  }
  function offlineCatchup(elapsedSec){
    const eff=Math.min(elapsedSec, OFFLINE_CAP);
    if(eff < 1) return null;
    const keys=['marks','knowledge','ore','metal','silicon','rules','data','insight','capability','scale'];
    const before={}; keys.forEach(k=> before[k]=S[k]);
    MUTE=true;
    const step=CFG.tickMs/1000; let rem=eff, iter=0;
    while(rem>0 && iter<300000){ const d=Math.min(step,rem); produce(d); S.t+=d; checkMiles(); rem-=d; iter++; }
    MUTE=false;
    const g={}; let any=false;
    keys.forEach(k=>{ g[k]=S[k]-before[k]; if(g[k]>0.05) any=true; });
    if(!any) return null;
    return { eff, g, capped: elapsedSec>OFFLINE_CAP };
  }
  function offlineToast(o){
    const names={marks:'Marks',knowledge:'Knowledge',ore:'Ore',metal:'Metal',silicon:'Silicon',rules:'Rules',data:'Data',insight:'Insight',capability:'Capability',scale:'Scale'};
    const parts=Object.keys(names).filter(k=>o.g[k]>0.05).map(k=>'+'+fmt(o.g[k])+' '+names[k]);
    const mins=Math.floor(o.eff/60);
    const dur = mins>=60 ? Math.floor(mins/60)+'h '+(mins%60)+'m' : mins+'m';
    toast('WHILE YOU WERE AWAY', 'Away for '+dur+(o.capped?' (capped)':'')+'. The system kept running:<br>'+parts.join(' &middot; '));
  }

  // --- Boot ---
  const lastSave=load();
  if(S.flags.firstAuto){ // returning player: jump straight into the full UI
    $('coldopen').style.display='none'; $('eras').style.display='flex'; $('hdr').classList.add('show');
    if(S.maxEra>=2){ $('vizwrap').style.display='block'; viz.start(); }
  }
  let offline=null;
  if(lastSave && S.flags.firstAuto){ offline=offlineCatchup((Date.now()-lastSave)/1000); }
  setTheme(S.maxEra); renderCold(); if(S.flags.firstAuto) render();
  if(offline) setTimeout(()=>offlineToast(offline), 600);

  $('coBtn').onclick=inscribe;
  setInterval(tick, CFG.tickMs);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
  window.addEventListener('beforeunload', save);

  // Test seam: exposes internals only when a harness sets window.__EMERGENCE_TEST__ before load.
  if(typeof window!=='undefined' && window.__EMERGENCE_TEST__){
    window.EMERGENCE={ S, CFG, BUYS, MILES, ERAS, TREE, TREEMAP, DISCO, DISCOMAP, VIZ_STATIONS, fmt,
      unitCost, totalCost, buyQty, buy, writeRule, inscribe, quarry, fabricate, produce, checkMiles, tick,
      oStats, discoVisible, canBuyDisco, buyDisco, stats, canBuyTech, buyTech, axiomGain, compile,
      symInfRate, infCap, proofCost, canProve, selectProof, completeProof,
      METHODS, e3Stats, effAccuracy, runExperiment,
      save, load, offlineCatchup, revealGame };
  }
})();
</script>
