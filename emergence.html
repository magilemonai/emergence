<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMERGENCE</title>
<style>
  :root {
    --bg: #06080d; --panel: #0d1220; --panel-2: #121a2c; --line: #1c2740;
    --text: #ccd6ea; --dim: #5d6d8a; --dimmer: #3a4660;
    --e0: #c9925f; --e1: #c9a26b; --e2: #6ec6a8; --e3: #6ea8ff; --e4: #b78bff;
    --accent: #ffcd6b; --good: #5ee07f; --danger: #ff6b8b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace; overflow: hidden; }
  body { background:
      radial-gradient(1100px 600px at 75% -10%, rgba(110,168,255,0.05), transparent 60%),
      radial-gradient(900px 500px at 5% 110%, rgba(183,139,255,0.05), transparent 60%),
      var(--bg); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 9px 18px;
    border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(18,26,44,0.5), transparent);
    opacity: 0; transform: translateY(-100%); transition: opacity 0.6s, transform 0.6s; }
  header.show { opacity: 1; transform: translateY(0); }
  .logo { font-weight: 700; letter-spacing: 4px; font-size: 14px; }
  .logo b { color: var(--e3); }
  .era-indicator { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .hdr-right { margin-left: auto; display: flex; gap: 22px; align-items: center; }
  .res-bar { display: flex; gap: 20px; align-items: center; }
  .buymode { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; opacity: 0; transition: opacity 0.5s; }
  .buymode.show { opacity: 1; }
  .buymode button { font-family: inherit; font-size: 10px; letter-spacing: 0.5px; padding: 5px 10px; border: none;
    border-right: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; transition: all 0.12s; }
  .buymode button:last-child { border-right: none; }
  .buymode button:hover { color: var(--text); }
  .buymode button.on { background: rgba(255,205,107,0.1); color: var(--accent); }
  .res { text-align: right; min-width: 80px; opacity: 0; transition: opacity 0.5s; }
  .res.show { opacity: 1; }
  .res .label { font-size: 8.5px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; }
  .res .val { font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  main { flex: 1; overflow-y: auto; padding: 0; min-height: 0; }
  main::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  #coldopen { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px; transition: opacity 0.8s; }
  .co-title { font-size: 12px; letter-spacing: 6px; color: var(--dimmer); text-transform: uppercase; }
  .co-count { font-size: 40px; font-variant-numeric: tabular-nums; color: var(--e0); min-height: 48px; transition: transform 0.08s; text-align:center; }
  .co-count small { font-size: 13px; color: var(--dim); letter-spacing: 2px; display: block; margin-top: 4px; }
  .big-btn { padding: 26px 56px; border-radius: 16px; border: 1px solid var(--e0);
    background: radial-gradient(circle at 50% 0%, rgba(201,146,95,0.14), var(--panel));
    color: var(--e0); font-family: inherit; font-size: 16px; letter-spacing: 3px; cursor: pointer;
    transition: transform 0.06s, box-shadow 0.2s; user-select: none; }
  .big-btn:hover { box-shadow: 0 0 30px rgba(201,146,95,0.25); }
  .big-btn:active { transform: scale(0.96); }
  .co-hint { font-size: 11px; color: var(--dimmer); font-style: italic; max-width: 360px; text-align: center; line-height: 1.7; min-height: 20px; }
  #vizwrap { display: none; max-width: 1180px; margin: 18px auto 0; padding: 0 18px; position: relative; }
  #viz { width: 100%; height: 210px; display: block; border: 1px solid var(--line); border-radius: 14px;
    background: radial-gradient(120% 140% at 50% -20%, rgba(110,168,255,0.06), transparent 55%),
      radial-gradient(100% 120% at 90% 120%, rgba(183,139,255,0.06), transparent 55%), #080b12; }
  .viz-cap { position: absolute; top: 15px; left: 31px; font-size: 8.5px; letter-spacing: 3px; color: var(--dimmer); pointer-events: none; }
  #eras { display: none; padding: 18px; gap: 16px; flex-direction: column; max-width: 1180px; margin: 0 auto; }
  .era { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    padding: 16px 18px; transition: opacity 0.8s, filter 0.8s, transform 0.5s; position: relative; overflow: hidden; }
  .era::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ec, var(--dim)); opacity: 0.8; }
  .era.obsolete { filter: grayscale(0.85) brightness(0.6); opacity: 0.5; }
  .era.obsolete .era-body { max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; }
  .era-header { display: flex; align-items: center; gap: 12px; }
  .era-sigil { width: 30px; height: 30px; object-fit: contain; opacity: 0.92; flex: none; filter: drop-shadow(0 0 6px rgba(201,162,107,0.25)); }
  .era-tag { font-size: 9px; letter-spacing: 2px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--ec); color: var(--ec); text-transform: uppercase; }
  .era-name { font-size: 15px; color: var(--text); }
  .era-name small { color: var(--dim); font-size: 10px; margin-left: 8px; letter-spacing: 0.5px; }
  .era-status { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .era-status.legacy { color: var(--dimmer); }
  .era-status.live { color: var(--good); }
  .era-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; transition: max-height 0.6s, opacity 0.5s, margin 0.5s; max-height: 800px; }
  .panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 13px; }
  .panel-label { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
  .act-btn { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--ec);
    background: rgba(255,255,255,0.02); color: var(--ec); font-family: inherit; font-size: 12px;
    letter-spacing: 1.5px; cursor: pointer; transition: transform 0.05s, box-shadow 0.15s; }
  .act-btn:hover:not(:disabled) { box-shadow: 0 0 18px rgba(255,255,255,0.06); }
  .act-btn:active:not(:disabled) { transform: scale(0.98); }
  .act-sub { font-size: 10px; color: var(--dim); text-align: center; margin-top: 8px; line-height: 1.5; }
  .up { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid rgba(28,39,64,0.5); }
  .up:last-child { border-bottom: none; }
  .up-top { display: flex; justify-content: space-between; align-items: baseline; }
  .up-name { font-size: 12px; }
  .up-count { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .up-flavor { font-size: 10px; font-style: italic; color: #8a7a66; line-height: 1.45; margin-bottom: 3px; }
  .up-desc { font-size: 10px; color: var(--dim); line-height: 1.5; }
  .up-buy { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px; font-family: inherit; font-size: 10.5px; color: var(--text); cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .up-buy:hover:not(:disabled) { border-color: var(--ec); }
  .up-buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .up-buy .c { color: var(--ec); }
  .up-buy:disabled .c { color: var(--danger); }
  .meter { height: 5px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; background: var(--ec); border-radius: 3px; transition: width 0.2s; }
  .meter-label { font-size: 9px; color: var(--dim); margin-top: 4px; display: flex; justify-content: space-between; }
  /* Era 1 — the Symbolic blueprint: a logic-circuit tech tree in amber */
  .tree-panel { background:
      linear-gradient(rgba(201,162,107,0.04) 1px, transparent 1px) 0 0 / 100% 26px,
      linear-gradient(90deg, rgba(201,162,107,0.04) 1px, transparent 1px) 0 0 / 26px 100%,
      var(--panel-2); }
  .tree { position: relative; width: 100%; margin-top: 8px; }
  .tree-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tl { stroke: var(--line); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .tl-live { stroke: rgba(201,162,107,0.4); stroke-dasharray: 3 3; }
  .tl-on { stroke: var(--e1); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .tree-node { position: absolute; transform: translate(-50%,-50%); width: 124px; padding: 8px 7px; text-align: center;
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; user-select: none; }
  .tree-node .tn-name { font-size: 10.5px; letter-spacing: 0.5px; color: var(--dim); }
  .tree-node .tn-cost { font-size: 8.5px; letter-spacing: 0.5px; margin-top: 3px; color: var(--dimmer); }
  .tree-node.locked { opacity: 0.38; cursor: not-allowed; }
  .tree-node.avail { border-color: rgba(201,162,107,0.45); }
  .tree-node.avail .tn-name { color: var(--text); }
  .tree-node.avail.can { border-color: var(--e1); box-shadow: 0 0 16px rgba(201,162,107,0.18); }
  .tree-node.avail.can .tn-cost { color: var(--e1); }
  .tree-node.avail:not(.can) .tn-cost { color: var(--danger); }
  .tree-node.owned { border-color: var(--e1); background: rgba(201,162,107,0.12); cursor: default; }
  .tree-node.owned .tn-name, .tree-node.owned .tn-cost { color: var(--e1); }
  .tree-node:hover:not(.locked):not(.owned) { background: var(--panel-2); }
  .compile-wrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .cstat { min-width: 92px; }
  .cstat .cs-label { font-size: 8.5px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; }
  .cstat .cs-val { font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .compile-act { flex: 1; min-width: 220px; }
  .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Era 1 — Origins: the refinement pipeline, warm ochre/stone */
  .flow-panel { background:
      linear-gradient(rgba(201,146,95,0.04) 1px, transparent 1px) 0 0 / 100% 30px,
      var(--panel-2); }
  .flow { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; transition: opacity 0.4s; }
  .flow-row.locked { opacity: 0.3; }
  .fnode { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 90px; padding: 8px 6px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .ficon { width: 40px; height: 40px; object-fit: contain; }
  .fglyph { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--e0); border: 1px solid rgba(201,146,95,0.5); border-radius: 9px; }
  .flab { font-size: 8.5px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; text-align: center; }
  .fval { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; min-height: 14px; }
  .farrow { color: var(--dimmer); font-size: 16px; }
  .age-label { color: var(--e0); font-size: 9px; letter-spacing: 1px; margin-left: 6px; }
  /* Origins central core */
  .core-panel { display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: radial-gradient(120% 160% at 18% 0%, rgba(201,146,95,0.08), transparent 60%), var(--panel-2); }
  .core { position: relative; width: 116px; height: 116px; flex: none; display: flex; align-items: center; justify-content: center; }
  .core-ring { position: absolute; inset: 8px; border: 2px solid rgba(201,146,95,0.5); border-top-color: var(--e0); border-radius: 50%; animation: coreSpin 6s linear infinite; }
  .core-ring2 { inset: 22px; border-width: 1px; border-top-color: transparent; border-left-color: var(--e0); animation: coreSpin 9s linear infinite reverse; }
  .core::after { content: ""; position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle, rgba(201,146,95,0.35), transparent 70%); animation: corePulse 3s ease-in-out infinite; }
  .core-mid { position: relative; z-index: 1; font-size: 9px; letter-spacing: 1.5px; color: var(--e0); text-align: center; width: 70px; line-height: 1.3; }
  @keyframes coreSpin { to { transform: rotate(360deg); } }
  @keyframes corePulse { 0%,100% { opacity: 0.5; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
  .core-side { flex: 1; min-width: 260px; }
  .core-verbs { display: flex; gap: 10px; }
  .core-verbs .act-btn { flex: 1; }
  .rates { margin-top: 4px; display: flex; flex-direction: column; }
  .rate { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(28,39,64,0.45); }
  .rate:last-child { border-bottom: none; }
  .rate-ic { width: 26px; height: 26px; object-fit: contain; flex: none; opacity: 0.9; }
  .rate-tx { display: flex; flex-direction: column; line-height: 1.1; }
  .rate-lab { font-size: 8px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .rate-amt { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .rate-ps { margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .rate-ps.pos { color: var(--good); }
  .rate-ps.neg { color: var(--danger); }
  .rate-ps.zero { color: var(--dimmer); }
  /* Works vs Research sections */
  .research-panel { background: linear-gradient(180deg, rgba(201,146,95,0.05), transparent 40%), var(--panel-2); }
  .ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 6px; }
  .tile { display: flex; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); transition: border-color 0.15s, box-shadow 0.15s, opacity 0.4s; }
  .tile.disco.can { border-color: rgba(201,146,95,0.55); box-shadow: 0 0 14px rgba(201,146,95,0.12); }
  .tile.disco.owned { opacity: 0.6; border-color: rgba(201,146,95,0.4); background: rgba(201,146,95,0.07); }
  .tile.disco.timed { border-style: dashed; border-color: rgba(201,146,95,0.3); }
  .tile.disco.timed .tile-btn { letter-spacing: 1px; }
  .tile-ic { width: 42px; height: 42px; object-fit: contain; flex: none; }
  .tile-ic.glyph { display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--e0);
    border: 1px solid rgba(201,146,95,0.45); border-radius: 9px; }
  .tile-body { flex: 1; min-width: 0; }
  .tile-name { font-size: 12px; color: var(--text); }
  .tile-count { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tile-flavor { font-size: 9.5px; font-style: italic; color: #8a7a66; line-height: 1.4; margin: 2px 0; }
  .tile-mech { font-size: 9.5px; color: var(--dim); line-height: 1.4; }
  .tile-eff { font-size: 10px; color: var(--e0); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tile-btn { margin-top: 7px; width: 100%; }
  .tile.disco.owned .tile-btn { opacity: 0.5; }
  #toasts { position: fixed; top: 60px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px;
    max-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); animation: toastIn 0.4s ease-out; }
  .toast .th { font-size: 9px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  .toast .tb { font-size: 12px; line-height: 1.5; color: var(--text); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .float { position: absolute; font-size: 14px; font-weight: 600; animation: floatUp 0.9s ease-out forwards; font-variant-numeric: tabular-nums; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-46px) scale(1.1); } }
  #dev { position: fixed; left: 14px; bottom: 14px; z-index: 80; display: none; flex-direction: column; gap: 8px;
    background: rgba(8,11,18,0.92); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; backdrop-filter: blur(4px); }
  #dev.show { display: flex; }
  #dev .dh { font-size: 8.5px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; gap: 14px; }
  #dev .dh b { color: var(--accent); }
  #dev .row { display: flex; gap: 6px; }
  #dev button { font-family: inherit; font-size: 10px; letter-spacing: 0.5px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; transition: all 0.12s; }
  #dev button:hover { border-color: var(--accent); color: var(--text); }
  #dev button.on { border-color: var(--accent); color: var(--accent); background: rgba(255,205,107,0.08); }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div>
      <div class="logo"><b>&#9670;</b> EMERGENCE</div>
      <div class="era-indicator" id="eraInd">SYMBOLIC ERA</div>
    </div>
    <div class="hdr-right">
      <div class="buymode" id="buyMode"></div>
      <div class="res-bar" id="resBar"></div>
    </div>
  </header>
  <main>
    <div id="coldopen">
      <div class="co-title">a record, beginning</div>
      <div class="co-count" id="coCount">0<small>MARKS</small></div>
      <button class="big-btn" id="coBtn">INSCRIBE A MARK</button>
      <div class="co-hint" id="coHint">Before intelligence could grow, it had to be written down. One mark at a time.</div>
    </div>
    <div id="vizwrap"><canvas id="viz"></canvas><div class="viz-cap">THE&nbsp;SUBSTRATE</div></div>
    <div id="eras"></div>
  </main>
</div>
<div id="fx"></div>
<div id="toasts"></div>
<div id="dev"></div>
<script>
(() => {
  const CFG = {
    tickMs: 100,
    e1: { // ERA 1 — Origins (inscription + materials, converging on silicon)
      inscribeBase: 1, quarryBase: 1,
      scribeCost: 12, scribeGrowth: 1.17, scribeYield: 0.42,       // marks/sec
      minerCost: 16, minerGrowth: 1.17, minerYield: 0.42,          // ore/sec
      scriptoriumCost: 60, scriptoriumGrowth: 1.19, scriptoriumRate: 0.7,  // marks -> knowledge /sec
      smelterCost: 80, smelterGrowth: 1.19, smelterRate: 0.7,      // ore -> metal /sec
      foundryCost: 700, foundryGrowth: 1.2, foundryRate: 0.5,      // metal+knowledge -> silicon /sec
      scriptoriumUpkeep: 0.35, // Ore burned per Knowledge made (tablets, styluses) — Knowledge drains Materials
      smelterUpkeep: 0.25,     // Knowledge burned per Metal made (smithing know-how) — Materials drains Knowledge
      siliconGate: 150,        // silicon needed to fabricate the Logic Machine (after the 5-min Foundry gate)
    },
    e2: { // ERA 2 — Symbolic (the tech-tree + compile journey, ~5-6 min)
      clickBase: 1,
      rulesetCost: 10, rulesetGrowth: 1.16, rulesetYield: 0.42,
      daemonCost: 320, daemonGrowth: 1.19, daemonRate: 2.0, // auto-writes/sec per daemon
      axiomDivisor: 380,  // axioms from a compile = floor(sqrt(runRules / divisor))
      axiomBonus: 0.05,   // +5% to all rule production per Axiom (×1.5 with Meta-Logic)
    },
    // Later eras still run on the original scaffold; rebuilt in a later pass.
    datasetCost: 50, datasetGrowth: 1.2, datasetYield: 0.4,
    modelCost: 120, modelGrowth: 1.25,
    era3Gate: 40,
    computeCost: 35, computeGrowth: 1.22, computePer: 0.5,
    trainCost: 90, trainGrowth: 1.28,
    era4Gate: 30,
    scaleCost: 45, scaleGrowth: 1.26,
  };
  function freshState(){ return {
    t: 0, started: false, era: 1, maxEra: 1, speed: 1, dev: false, buyMode: '1',
    // Era 1 — Origins
    marks: 0, knowledge: 0, ore: 0, metal: 0, silicon: 0, age: 1,
    scribe: 0, miner: 0, scriptorium: 0, smelter: 0, foundry: 0, disco: {},
    // Era 2 — Symbolic
    rules: 0, runRules: 0, axioms: 0, totalAxioms: 0, compiles: 0,
    ruleset: 0, daemon: 0,
    // Era 3+ scaffold
    insight: 0, data: 0, capability: 0, scale: 0,
    dataset: 0, model: 0, compute: 0, training: 0, cluster: 0,
    tech: {}, obsolete: {}, flags: {}, clicks: 0,
  }; }
  const S = freshState();
  const RATES = { marks:0, knowledge:0, ore:0, metal:0, silicon:0 }; // net per-second flow, captured each tick
  const ERAS = {
    1: { color: 'var(--e0)', tag: 'Origins', name: 'From Marks to Matter', sub: 'recording the world, then reshaping it', sigil: 'assets/era1-sigil.png' },
    2: { color: 'var(--e1)', tag: 'Symbolic', name: 'Hand-Written Logic', sub: 'rules authored by hand', sigil: 'assets/sigil-symbolic.png' },
    3: { color: 'var(--e2)', tag: 'Statistical', name: 'Learning From Data', sub: 'patterns drawn from examples' },
    4: { color: 'var(--e3)', tag: 'Deep', name: 'Neural Scaling', sub: 'compute-bound capability' },

  // --- Era 1 (Origins): derived rates from owned discoveries, manual verbs, discoveries, fabrication ---

    if(S.scribe>0) S.marks += S.scribe*os.scribeY*dt;
    if(S.miner>0)  S.ore   += S.miner*os.minerY*dt;
    // Scriptorium: Marks -> Knowledge, but each unit also burns Ore (tablets). Throttled by whichever runs short.

      let out=Math.min(S.marks, S.scriptorium*os.scrR*dt);

  }
  // A line of flavor (the feeling) above each building's literal mechanical description.
  const FLAVOR = {
    scribe:'A trained hand that never tires of the work.',
    scriptorium:'Where loose marks are copied, ordered, and made to mean something.',
    miner:'Picks against the rock face, hour after hour.',
    smelter:'Fire coaxes metal out of plain stone.',
    foundry:'A recipe and a furnace, together making something the world had never held.',
    ruleset:'Logic that begets more logic.',
    daemon:'A patient process that keeps working while you look away.',
    dataset:'The world, written down in numbers.',
    model:'It stops being told the answer and starts guessing it.',
    compute:'Raw thinking, measured by the ton.',
    training:'Ten thousand mistakes, each one slightly smaller.',
    cluster:'Enough machines that the whole begins to exceed its parts.',
  };
  const RESFLAVOR = {
    marks:'The first attempt to hold a thought in place.',
    knowledge:'Marks made meaningful.',
    ore:'The world before we reshaped it.',
    metal:'Stone, disciplined by fire.',
    silicon:'Sand, taught to carry thought.',
    rules:'Intelligence spelled out by hand, one clause at a time.',
    axioms:'Truths kept across every reset.',
    data:'Experience, stored for the machine to study.',
    insight:'The pattern beneath the noise.',
    capability:'What the system can actually do.',
    scale:'The point where more becomes different.',
  };
  function eraUpgrade(key, name, desc){
    const fl = FLAVOR[key] ? '<div class="up-flavor">'+FLAVOR[key]+'</div>' : '';
    return '<div class="up"><div class="up-top"><div class="up-name">'+name+'</div><div class="up-count" id="cnt-'+key+'"></div></div>'+
      fl+'<div class="up-desc">'+desc+'</div><button class="up-buy" data-buy="'+key+'" id="buy-'+key+'"></button></div>';
  }
  function eraShell(n, obsolete, body){
    const e=ERAS[n];
    return '<div class="era '+(obsolete?'obsolete':'')+'" style="--ec:'+e.color+'"><div class="era-header">'+
      (e.sigil?'<img class="era-sigil" src="'+e.sigil+'" alt="">':'')+
      '<span class="era-tag">'+e.tag+
      '</span><span class="era-name">'+e.name+'<small>'+e.sub+'</small></span><span class="era-status" id="status-'+n+'"></span></div><div class="era-body">'+body+'</div></div>';
  }
  function nodePos(n){ return { x: 50 + n.col*14, y: 34 + n.row*58 }; }
  const TREE_H = 34 + 4*58 + 30; // rows 0..4
  function buildTree(){
    let lines='';
    for(const n of TREE){ const p=nodePos(n);
      for(const r of n.req){ const pr=nodePos(TREEMAP[r]); const on=S.tech[n.id]&&S.tech[r], live=S.tech[r];
        lines += '<line x1="'+pr.x+'" y1="'+pr.y+'" x2="'+p.x+'" y2="'+p.y+'" class="tl'+(on?' tl-on':(live?' tl-live':''))+'"/>'; } }
    let nodes='';
    for(const n of TREE){ const p=nodePos(n);
      nodes += '<div class="tree-node" data-tech="'+n.id+'" id="tn-'+n.id+'" title="'+n.desc+'" style="left:'+p.x+'%;top:'+p.y+'px">'+
        '<div class="tn-name">'+n.name+'</div><div class="tn-cost" id="tnc-'+n.id+'"></div></div>'; }
    return '<svg class="tree-svg" viewBox="0 0 100 '+TREE_H+'" preserveAspectRatio="none">'+lines+'</svg>'+nodes;
  }
  function buildCompile(){
    return '<div class="compile-wrap">'+
      '<div class="cstat"><div class="cs-label">Axioms</div><div class="cs-val" id="axVal" style="color:var(--accent)"></div></div>'+
      '<div class="cstat"><div class="cs-label">Production bonus</div><div class="cs-val" id="axBonus"></div></div>'+
      '<div class="compile-act"><button class="act-btn" id="compileBtn"></button><div class="act-sub" id="compileSub">Resets Rules, Rulesets and Daemons. Technique and Axioms stay.</div></div>'+
    '</div>';
  }
  function buildSymbolic(){ // ERA 2
    let prod = eraUpgrade('ruleset','Ruleset','Writes rules automatically. The first thing that works without you.');
    if(S.tech.inference) prod += eraUpgrade('daemon','Inference Daemon','Fires the write action for you. Everything that makes a click stronger makes a Daemon stronger.');
    let body =
      '<div class="panel"><div class="panel-label">Manual Authoring</div><button class="act-btn" id="ruleBtn2">WRITE A RULE</button><div class="act-sub" id="manualSub"></div></div>'+
      '<div class="panel"><div class="panel-label">Automation</div>'+(S.flags.canRuleset?prod:'<div class="up-desc">Keep writing...</div>')+'</div>';
    if(S.flags.tree) body += '<div class="panel tree-panel" style="grid-column:1/-1"><div class="panel-label">Symbolic Technique</div><div class="tree" style="height:'+TREE_H+'px" id="tree">'+buildTree()+'</div></div>';
    if(S.flags.compile && !S.flags.symbolicDone) body += '<div class="panel" style="grid-column:1/-1"><div class="panel-label">Compile &amp; Axioms</div>'+buildCompile()+'</div>';
    return eraShell(2, false, body);
  }
  // ---- ERA 1 (Origins): a central core + a discovery grid (Knowledge & Materials interleaved) + a quiet flow diagram ----
  // Buildings shown in the grid: their display name + literal mechanic. Flavor comes from FLAVOR[key].
  const OBUILD = {
    scribe:{ name:'Scribe', mech:'Automates Marks.' },
    miner:{ name:'Miner', mech:'Automates Ore.' },
    scriptorium:{ name:'Scriptorium', mech:'Marks → Knowledge. Also burns Ore for tablets — throttles if either runs short.' },
    smelter:{ name:'Smelter', mech:'Ore → Metal. Also burns Knowledge for the craft — competes with the Foundry.' },
    foundry:{ name:'Foundry', mech:'Metal + Knowledge → Silicon.' },
  };
  // Icons we have art for today; the rest fall back to a glyph until the icon set lands.
  const BICON = { scribe:'assets/icon-scribe.png', miner:'assets/icon-miner.png', scriptorium:'assets/icon-scriptorium.png', smelter:'assets/icon-crucible.png', foundry:'assets/icon-foundry.png' };
  const DICON = { tally:'assets/icon-marks.png', scribe:'assets/icon-scribe.png', stoneworking:'assets/icon-ore.png', clayTablets:'assets/disco-clay.png', kiln:'assets/icon-crucible.png', alphabet:'assets/disco-alphabet.png', bronzeCasting:'assets/icon-ingot.png', numerals:'assets/disco-numerals.png', glassmaking:'assets/icon-silicon.png', theFoundry:'assets/icon-foundry.png', wheel:'assets/disco-wheel.png' };
  function tileIcon(src){ return src ? '<img class="tile-ic" src="'+src+'">' : '<div class="tile-ic glyph">&#9670;</div>'; }
  // What one more of this building adds per second (production, and the upkeep it newly draws).
  function buildEffect(key){
    const os=oStats(), e=CFG.e1;
    if(key==='scribe') return '+'+fmt(os.scribeY)+' marks/s each';
    if(key==='miner') return '+'+fmt(os.minerY)+' ore/s each';
    if(key==='scriptorium') return '+'+fmt(os.scrR)+' knowledge/s, −'+fmt(os.scrR*e.scriptoriumUpkeep)+' ore/s each';
    if(key==='smelter') return '+'+fmt(os.smR)+' metal/s, −'+fmt(os.smR*e.smelterUpkeep)+' knowledge/s each';
    if(key==='foundry') return '+'+fmt(os.foR)+' silicon/s, −'+fmt(os.foR)+' metal & knowledge/s each';
    return '';
  }
  function buildTile(type, key){
    if(type==='build'){
      const b=OBUILD[key], fl=FLAVOR[key]?'<div class="tile-flavor">'+FLAVOR[key]+'</div>':'';
      return '<div class="tile build" id="btile-'+key+'">'+tileIcon(BICON[key]||'')+
        '<div class="tile-body"><div class="tile-name">'+b.name+' <span class="tile-count" id="cnt-'+key+'"></span></div>'+
        fl+'<div class="tile-mech">'+b.mech+'</div><div class="tile-eff" id="eff-'+key+'"></div>'+
        '<button class="up-buy tile-btn" data-buy="'+key+'" id="buy-'+key+'"></button></div></div>';
    }
    const n=DISCOMAP[key];
    return '<div class="tile disco" id="dtile-'+key+'">'+tileIcon(DICON[key]||'')+
      '<div class="tile-body"><div class="tile-name">'+n.name+'</div>'+
      '<div class="tile-flavor">'+n.flavor+'</div><div class="tile-mech">'+n.mech+'</div>'+
      '<button class="up-buy tile-btn" data-disco="'+key+'" id="dsc-'+key+'"></button></div></div>';
  }
  const WORKS_ORDER = ['scribe','miner','scriptorium','smelter','foundry'];
  function buildWorks(){
    let html='';
    for(const key of WORKS_ORDER){ if(BUILD_UNLOCK[key]()) html += buildTile('build', key); }
    return html ? '<div class="ogrid">'+html+'</div>' : '<div class="up-desc">Make a discovery to unlock something to build.</div>';
  }
  function buildResearch(){
    let html='';
    for(const n of DISCO){ if(discoVisible(n.id)) html += buildTile('disco', n.id); }
    return '<div class="ogrid">'+html+'</div>';
  }
  const RATE_DEFS = [
    ['marks','Marks','assets/icon-marks.png', ()=>true],
    ['knowledge','Knowledge','assets/icon-knowledge.png', ()=>true],
    ['ore','Ore','assets/icon-ore.png', ()=>S.flags.o_materials],
    ['metal','Metal','assets/icon-ingot.png', ()=>S.flags.o_smelter],
    ['silicon','Silicon','assets/icon-silicon.png', ()=>S.flags.o_foundry],
  ];
  function buildRates(){
    let html='';
    for(const [k,lab,icon,show] of RATE_DEFS){ if(!show()) continue;
      html += '<div class="rate"><img class="rate-ic" src="'+icon+'"><div class="rate-tx"><div class="rate-lab">'+lab+'</div>'+
        '<div class="rate-amt" id="ramt-'+k+'"></div></div><div class="rate-ps" id="rps-'+k+'"></div></div>';
    }
    return '<div class="rates">'+html+'</div>';
  }
  function buildCore(){
    return '<div class="panel core-panel">'+
      '<div class="core"><div class="core-ring"></div><div class="core-ring core-ring2"></div><div class="core-mid" id="coreAge">STONE AGE</div></div>'+
      '<div class="core-side">'+
        '<div class="core-verbs"><button class="act-btn" id="inscribeBtn">INSCRIBE A MARK</button>'+
          (S.flags.o_materials?'<button class="act-btn" id="quarryBtn">QUARRY ORE</button>':'')+'</div>'+
      '</div></div>';
  }
  function buildRatesPanel(){
    return '<div class="panel rates-panel"><div class="panel-label">Flows · per second</div>'+buildRates()+'</div>';
  }
  function fnode(label, icon, id){
    return '<div class="fnode" id="'+id+'">'+
      (icon?'<img class="ficon" src="'+icon+'">':'<div class="fglyph">&#9670;</div>')+
      '<div class="flab">'+label+'</div></div>';
  }
  function buildFlow(){
    const A='<div class="farrow">&rarr;</div>', P='<div class="farrow">+</div>';
    return '<div class="flow">'+
      '<div class="flow-row" id="frow-k">'+fnode('Marks','assets/icon-marks.png','fn-marks')+A+fnode('Scriptorium','assets/icon-scriptorium.png','fn-scriptorium')+A+fnode('Knowledge','assets/icon-knowledge.png','fn-knowledge')+'</div>'+
      '<div class="flow-row" id="frow-m">'+fnode('Ore','assets/icon-ore.png','fn-ore')+A+fnode('Smelter','assets/icon-crucible.png','fn-smelter')+A+fnode('Metal','assets/icon-ingot.png','fn-metal')+'</div>'+
      '<div class="flow-row flow-converge" id="frow-f">'+fnode('Knowledge','assets/icon-knowledge.png','fn-ck')+P+fnode('Metal','assets/icon-ingot.png','fn-cm')+A+fnode('Foundry','assets/icon-foundry.png','fn-foundry2')+A+fnode('Silicon','assets/icon-silicon.png','fn-silicon')+A+fnode('Logic Machine','','fn-logic')+'</div>'+
    '</div>';
  }
  function buildOrigins(){ // ERA 1
    let body = buildCore() + buildRatesPanel(); // core (left) + Flows side panel (right)
    body += '<div class="panel ogrid-panel" style="grid-column:1/-1"><div class="panel-label">Works · build &amp; rebuild <span class="age-label" id="ageLabel"></span></div>'+buildWorks()+'</div>';
    body += '<div class="panel ogrid-panel research-panel" style="grid-column:1/-1"><div class="panel-label">Research · one-time discoveries</div>'+buildResearch()+'</div>';
    body += '<div class="panel flow-panel" style="grid-column:1/-1"><div class="panel-label">The Chain · what feeds what</div>'+buildFlow()+'</div>';
    if(S.flags.o_foundry){
      body += '<div class="panel" style="grid-column:1/-1"><div class="panel-label">Fabrication</div>'+
        '<div class="meter"><i id="meter-silicon" style="background:var(--accent)"></i></div>'+
        '<div class="meter-label"><span>Silicon toward the Logic Machine</span><span id="meter-silicon-val"></span></div>'+
        '<button class="act-btn" id="fabricateBtn" style="margin-top:12px">FABRICATE THE LOGIC MACHINE</button></div>';
    }
    return eraShell(1, false, body);
  }
  function buildEras(){
    let html = buildOrigins();
    if(S.maxEra>=2) html += buildSymbolic();
    if(S.maxEra>=3) html += eraShell(3, S.obsolete[3],
      '<div class="panel"><div class="panel-label">Data Pipeline</div>'+eraUpgrade('dataset','Dataset','Generates raw Data over time. Bought with Rules.')+
        '<div class="meter"><i id="meter-data" style="background:var(--e2)"></i></div><div class="meter-label"><span>Data buffer</span><span id="meter-data-val"></span></div></div>'+
      '<div class="panel"><div class="panel-label">Models</div>'+(S.flags.canModel?eraUpgrade('model','Statistical Model','Consumes Data, produces Insight. Patterns replace hand-written rules.'):'<div class="up-desc">Gather Data first...</div>')+'</div>');
    if(S.maxEra>=4) html += eraShell(4, S.obsolete[4],
      '<div class="panel"><div class="panel-label">Compute Supply</div>'+eraUpgrade('compute','Compute Node','The new bottleneck. More nodes, stronger training runs.')+'</div>'+
      '<div class="panel"><div class="panel-label">Training</div>'+(S.flags.canTrain?eraUpgrade('training','Training Run','Consumes Insight + Compute to produce raw Capability.'):'<div class="up-desc">Build Compute first...</div>')+'</div>');
    if(S.maxEra>=5) html += eraShell(5, false,
      '<div class="panel"><div class="panel-label">Scaling</div>'+eraUpgrade('cluster','Cluster','Turns Capability into Scale. Everything below feeds this.')+'</div>'+
      '<div class="panel"><div class="panel-label">Emergence</div><div class="up-desc" style="line-height:1.7">At sufficient Scale, behavior appears that no single component was designed to produce. This is the frontier - and the end of this prototype\'s authored content.</div><div class="meter"><i id="meter-scale" style="background:var(--e4)"></i></div><div class="meter-label"><span>Toward emergence</span><span id="meter-scale-val"></span></div></div>');
    return html;
  }
  function render(){ // structural rebuild — only on unlocks, era changes, or buy-mode change
    if(!S.flags.firstAuto) return;
    buildHeader();
    $('eras').innerHTML = buildEras();
    const rb=$('ruleBtn2'); if(rb) rb.onclick=writeRule;
    const ib=$('inscribeBtn'); if(ib) ib.onclick=inscribe;
    const qb=$('quarryBtn'); if(qb) qb.onclick=quarry;
    const fb=$('fabricateBtn'); if(fb) fb.onclick=fabricate;
    document.querySelectorAll('button[data-buy]').forEach(b=> b.onclick=e=>buy(e.currentTarget.dataset.buy));
    document.querySelectorAll('[data-disco]').forEach(b=> b.onclick=e=>buyDisco(e.currentTarget.dataset.disco));
    document.querySelectorAll('[data-tech]').forEach(b=> b.onclick=e=>buyTech(e.currentTarget.dataset.tech));
    const cb=$('compileBtn'); if(cb) cb.onclick=compile;
    refresh();
  }
  function upLabel(key){ // {can, html} for a buy button under the current buy mode
    const b=BUYS[key], mode=S.buyMode;
    if(mode==='max'){ const qty=buyQty(key), can=qty>0, c=totalCost(b, can?qty:1);
      return { can, html:'BUILD'+(can?' &times;'+qty:' MAX')+' &middot; <span class="c">'+fmt(c)+' '+b.res+'</span>' }; }
    const qty=(mode==='10')?10:1, c=totalCost(b,qty), can=S[b.res]>=c;
    return { can, html:'BUILD'+(qty>1?' &times;'+qty:'')+' &middot; <span class="c">'+fmt(c)+' '+b.res+'</span>' };
  }
  function setText(id,txt){ const el=$(id); if(el && el.textContent!==txt) el.textContent=txt; }
  function setStatus(n, live){ const el=$('status-'+n); if(!el) return;
    if(S.obsolete[n]){ el.textContent='LEGACY'; el.className='era-status legacy'; return; }
    const txt= live?'● RUNNING':'ACTIVE', cls='era-status'+(live?' live':'');
    if(el.textContent!==txt) el.textContent=txt; if(el.className!==cls) el.className=cls; }
  function setClass(el, cls){ if(el && el.className!==cls) el.className=cls; }
  function refresh(){ // cheap per-tick value update; the DOM (and your buttons) stay put
    if(!S.flags.firstAuto) return;
    setText('eraInd', ERAS[S.maxEra].tag.toUpperCase()+' ERA');
    for(const d of RES_DEFS) setText('rv-'+d.k, fmt(S[d.k]));
    for(const key in BUYS){ const cnt=$('cnt-'+key); if(!cnt) continue;
      setText('cnt-'+key, 'x'+S[key]);
      const btn=$('buy-'+key), st=upLabel(key);
      if(btn._html!==st.html){ btn.innerHTML=st.html; btn._html=st.html; }
      if(btn.disabled!==!st.can) btn.disabled=!st.can;
    }
    const st=stats();
    setText('manualSub', '+'+fmt(st.click)+' rules · the original verb');
    setStatus(1,S.scribe>0||S.miner>0); setStatus(2,S.ruleset>0||S.daemon>0); setStatus(3,S.model>0); setStatus(4,S.training>0); setStatus(5,S.cluster>0);
    // Era 1 — Origins live values
    if(S.maxEra===1){
      setText('coreAge', ['','STONE AGE','BRONZE AGE','SILICON AGE'][S.age]||'');
      for(const key of WORKS_ORDER){ if($('eff-'+key)) setText('eff-'+key, buildEffect(key)); }
      for(const [k] of RATE_DEFS){ if(!$('ramt-'+k)) continue;
        setText('ramt-'+k, fmt(S[k]));
        const rt=RATES[k]||0, ps=$('rps-'+k), cls='rate-ps '+(rt>0.0005?'pos':(rt<-0.0005?'neg':'zero'));
        setText('rps-'+k, (rt>=0?'+':'')+fmt(rt)+'/s');
        if(ps && ps.className!==cls) ps.className=cls;
      }
      for(const n of DISCO){ const btn=$('dsc-'+n.id); if(!btn) continue; const tile=$('dtile-'+n.id);
        if(S.disco[n.id]){ setClass(tile,'tile disco owned'); if(btn._html!=='DISCOVERED'){ btn.innerHTML='DISCOVERED'; btn._html='DISCOVERED'; } if(!btn.disabled) btn.disabled=true; }
        else { const can=canBuyDisco(n.id);
          let h;
          if(n.reqTime && S.t < n.reqTime){
            const r=Math.ceil(n.reqTime-S.t); h='IN '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
          } else {
            let req=''; if(n.reqRes){ for(const k in n.reqRes){ if(S[k]<n.reqRes[k]) req+=' · needs '+n.reqRes[k]+' '+k; } }
            h='DISCOVER · <span class="c">'+fmt(n.cost)+' '+n.res+'</span>'+req;
          }
          if(btn._html!==h){ btn.innerHTML=h; btn._html=h; }
          if(btn.disabled!==!can) btn.disabled=!can;
          setClass(tile,'tile disco'+(can?' can':'')+(n.reqTime&&S.t<n.reqTime?' timed':''));
        }
      }
      setClass($('frow-m'),'flow-row'+(S.flags.o_materials?'':' locked'));
      setClass($('frow-f'),'flow-row flow-converge'+(S.flags.o_foundry?'':' locked'));
      const ms=$('meter-silicon'); if(ms){ ms.style.width=Math.min(100,(S.silicon/CFG.e1.siliconGate)*100)+'%'; setText('meter-silicon-val',fmt(S.silicon)+' / '+CFG.e1.siliconGate); }
      const fbtn=$('fabricateBtn'); if(fbtn && fbtn.disabled!==!S.flags.canFabricate) fbtn.disabled=!S.flags.canFabricate;
    }
    // tech tree
    for(const n of TREE){ const el=$('tn-'+n.id); if(!el) continue;
      const owned=S.tech[n.id], prereq=n.req.every(r=>S.tech[r]);
      let state='locked', cost='LOCKED';
      if(owned){ state='owned'; cost='OWNED'; }
      else if(prereq){ const afford=canBuyTech(n.id); state='avail'+(afford?' can':''); cost=fmt(n.cost)+' rules'+(n.reqAxioms&&S.axioms<n.reqAxioms?' · '+n.reqAxioms+' axioms':''); }
      setClass(el,'tree-node '+state); setText('tnc-'+n.id, cost);
    }
    // compile
    const cb=$('compileBtn');
    if(cb){ const g=axiomGain();
      setText('axVal', fmt(S.axioms));
      setText('axBonus', '+'+Math.round(S.axioms*st.axBonus*100)+'%');
      const html='COMPILE · <span class="c" style="color:var(--accent)">+'+g+' axioms</span>';
      if(cb._html!==html){ cb.innerHTML=html; cb._html=html; }
      if(cb.disabled!==(g<1)) cb.disabled=(g<1);
    }
    const md=$('meter-data'); if(md){ md.style.width=Math.min(100,(S.data/(Math.max(1,S.model)*10))*100)+'%'; setText('meter-data-val',fmt(S.data)); }
    const msc=$('meter-scale'); if(msc){ msc.style.width=Math.min(100,(S.scale/50)*100)+'%'; setText('meter-scale-val',fmt(S.scale)+' / 50'); }
  }
  // --- Dev tools (hidden; toggle with the backtick ` key, or open with ?dev=1) ---
  const SPEEDS=[1,3,10,50];
  function grant(){ // give a generous push to whatever the current era needs
    if(S.maxEra>=5) S.capability+=500;
    else if(S.maxEra>=4) S.insight+=500;
    else if(S.maxEra>=3){ S.data+=500; S.rules+=500; }
    else if(S.maxEra>=2){ S.rules+=5000; S.runRules+=5000; }
    else { S.marks+=500; S.ore+=500; S.knowledge+=200; S.metal+=200; S.silicon+=50; if(!S.flags.firstAuto) revealGame(); }
    if(S.flags.firstAuto) render();
  }
  function softReset(){ // instant in-memory restart to the cold open (keeps dev panel + speed)
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    const dev=S.dev, speed=S.speed;
    Object.assign(S, freshState()); S.dev=dev; S.speed=speed;
    $('eras').style.display='none'; $('hdr').classList.remove('show'); $('vizwrap').style.display='none';
    const co=$('coldopen'); co.style.display='flex'; co.style.opacity='1';
    $('coHint').textContent='Before intelligence could grow, it had to be written down. One mark at a time.';
    renderCold(); renderDev();
  }
  function renderDev(){
    if(!S.dev) return;
    $('dev').innerHTML =
      '<div class="dh"><span>DEV &middot; <b>'+S.speed+'×</b> &middot; t=<b id="devT">'+Math.floor(S.t)+'</b>s</span><span>` to hide</span></div>'+
      '<div class="row">'+SPEEDS.map(s=>'<button data-spd="'+s+'" class="'+(S.speed===s?'on':'')+'">'+s+'×</button>').join('')+'</div>'+
      '<div class="row"><button data-grant="1">+resources</button><button data-soft="1">reset</button><button data-reset="1">hard reset</button></div>';
    $('dev').querySelectorAll('[data-spd]').forEach(b=> b.onclick=()=>{ S.speed=+b.dataset.spd; renderDev(); });
    $('dev').querySelector('[data-grant]').onclick=grant;
    $('dev').querySelector('[data-soft]').onclick=softReset;
    $('dev').querySelector('[data-reset]').onclick=()=>{ if(confirm('Wipe all progress and reload?')){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} location.reload(); } };
  }
  function toggleDev(on){ S.dev = on!==undefined?on:!S.dev; $('dev').classList.toggle('show',S.dev); if(S.dev) renderDev(); }
  window.addEventListener('keydown', e=>{ if(e.key==='`'||e.key==='~'){ e.preventDefault(); toggleDev(); } });
  if(/[?&]dev=1/.test(location.search)) toggleDev(true);

  // --- The Substrate: live visualization of the system ---
  const VIZ_STATIONS=[
    { key:'ruleset', era:2, label:'RULES',    color:'#c9a26b', count:()=>S.ruleset,  live:()=>S.ruleset>0 },
    { key:'dataset', era:3, label:'DATA',     color:'#6ec6a8', count:()=>S.dataset,  live:()=>S.dataset>0 },
    { key:'model',   era:3, label:'MODELS',   color:'#6ec6a8', count:()=>S.model,    live:()=>S.model>0 },
    { key:'compute', era:4, label:'COMPUTE',  color:'#6ea8ff', count:()=>S.compute,  live:()=>S.compute>0 },
    { key:'training',era:4, label:'TRAINING', color:'#6ea8ff', count:()=>S.training, live:()=>S.training>0 },
    { key:'cluster', era:5, label:'SCALE',    color:'#b78bff', count:()=>S.cluster,  live:()=>S.cluster>0 },
  ];
  const viz=(()=>{
    const cv=$('viz'); if(!cv||!cv.getContext) return { start(){} };
    const ctx=cv.getContext('2d'); let W=0,H=0,pulses=[],last=0,running=false;
    const TAU=Math.PI*2;
    function hexA(c,a){ const n=parseInt(c.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
    function resize(){ const dpr=window.devicePixelRatio||1; const r=cv.getBoundingClientRect();
      W=r.width||1000; H=r.height||210; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    function obsolete(s){ return (s.era===1&&S.obsolete[1])||(s.era===2&&S.obsolete[2]); }
    function visible(){ return VIZ_STATIONS.filter(s=> s.era<=S.maxEra); }
    function layout(st){ const padX=72,padR=44,usable=Math.max(1,W-padX-padR),span=Math.max(1,st.length-1);
      st.forEach((s,i)=>{ s._x= st.length===1? W/2 : padX+usable*i/span; s._y= H/2 + Math.sin(i*1.3)*24; }); }
    function frame(now){
      if(!running) return;
      const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
      ctx.clearRect(0,0,W,H);
      const st=visible(); layout(st);
      for(let i=0;i<st.length-1;i++){ const a=st[i],b=st[i+1];
        const active=a.live() && !obsolete(a);
        ctx.strokeStyle= active? hexA(b.color,0.18):'rgba(120,140,180,0.05)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(a._x,a._y); ctx.lineTo(b._x,b._y); ctx.stroke();
        if(active && Math.random() < Math.min(0.45, 0.05+a.count()*0.012)) pulses.push({i,p:0,color:b.color});
      }
      for(const pl of pulses) pl.p += dt*0.85;
      pulses = pulses.filter(pl=> pl.p<1 && st[pl.i] && st[pl.i+1]);
      for(const pl of pulses){ const a=st[pl.i],b=st[pl.i+1]; const x=a._x+(b._x-a._x)*pl.p, y=a._y+(b._y-a._y)*pl.p;
        ctx.fillStyle=hexA(pl.color,0.95); ctx.beginPath(); ctx.arc(x,y,2.1,0,TAU); ctx.fill();
        ctx.fillStyle=hexA(pl.color,0.22); ctx.beginPath(); ctx.arc(x,y,5,0,TAU); ctx.fill(); }
      st.forEach((s,idx)=>{ const cnt=s.count(), ob=obsolete(s);
        const r=(4+Math.min(20,Math.sqrt(cnt)*2.4))*(1+Math.sin(now/600+idx)*0.06);
        const col= ob? '#8a93a8' : s.color, lit= ob?0.16:0.5;
        const g=ctx.createRadialGradient(s._x,s._y,0,s._x,s._y,r*3);
        g.addColorStop(0,hexA(col,lit)); g.addColorStop(1,hexA(col,0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s._x,s._y,r*3,0,TAU); ctx.fill();
        const sats=Math.min(cnt,10);
        for(let k=0;k<sats;k++){ const ang=now/1400+k*(TAU/sats), sr=r+9;
          ctx.fillStyle=hexA(col, ob?0.2:0.6); ctx.beginPath(); ctx.arc(s._x+Math.cos(ang)*sr,s._y+Math.sin(ang)*sr,1.5,0,TAU); ctx.fill(); }
        ctx.fillStyle=hexA(col, ob?0.4:0.95); ctx.beginPath(); ctx.arc(s._x,s._y,Math.max(2,r*0.4),0,TAU); ctx.fill();
        ctx.strokeStyle=hexA(col,ob?0.25:0.5); ctx.lineWidth=1; ctx.beginPath(); ctx.arc(s._x,s._y,r,0,TAU); ctx.stroke();
        ctx.fillStyle=hexA(col, ob?0.3:0.55); ctx.font='8px ui-monospace,Menlo,monospace'; ctx.textAlign='center';
        ctx.fillText(s.label+(cnt>0?' '+fmt(cnt):''), s._x, s._y+r*3+11);
      });
      requestAnimationFrame(frame);
    }
    return { start(){ if(running) return; running=true; resize(); window.addEventListener('resize',resize); requestAnimationFrame(frame); } };
  })();

  // --- Persistence ---
  const SAVE_KEY='emergence-save';
  const OFFLINE_CAP=8*3600; // seconds of offline progress credited at most
  function save(){
    try{ const out={...S}; delete out.dev; delete out.speed;
      localStorage.setItem(SAVE_KEY, JSON.stringify({S:out, lastSave:Date.now(), v:1})); }catch(e){}
  }
  function load(){
    try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null;
      const d=JSON.parse(raw); if(!d||!d.S) return null;
      Object.assign(S, d.S);            // saved fields override defaults; dev/speed stay at literal defaults
      return d.lastSave||null;
    }catch(e){ return null; }
  }
  function offlineCatchup(elapsedSec){
    const eff=Math.min(elapsedSec, OFFLINE_CAP);
    if(eff < 1) return null;
    const keys=['marks','knowledge','ore','metal','silicon','rules','data','insight','capability','scale'];
    const before={}; keys.forEach(k=> before[k]=S[k]);
    MUTE=true;
    const step=CFG.tickMs/1000; let rem=eff, iter=0;
    while(rem>0 && iter<300000){ const d=Math.min(step,rem); produce(d); S.t+=d; checkMiles(); rem-=d; iter++; }
    MUTE=false;
    const g={}; let any=false;
    keys.forEach(k=>{ g[k]=S[k]-before[k]; if(g[k]>0.05) any=true; });
    if(!any) return null;
    return { eff, g, capped: elapsedSec>OFFLINE_CAP };
  }
  function offlineToast(o){
    const names={marks:'Marks',knowledge:'Knowledge',ore:'Ore',metal:'Metal',silicon:'Silicon',rules:'Rules',data:'Data',insight:'Insight',capability:'Capability',scale:'Scale'};
    const parts=Object.keys(names).filter(k=>o.g[k]>0.05).map(k=>'+'+fmt(o.g[k])+' '+names[k]);
    const mins=Math.floor(o.eff/60);
    const dur = mins>=60 ? Math.floor(mins/60)+'h '+(mins%60)+'m' : mins+'m';
    toast('WHILE YOU WERE AWAY', 'Away for '+dur+(o.capped?' (capped)':'')+'. The system kept running:<br>'+parts.join(' &middot; '));
  }

  // --- Boot ---
  const lastSave=load();
  if(S.flags.firstAuto){ // returning player: jump straight into the full UI
    $('coldopen').style.display='none'; $('eras').style.display='flex'; $('hdr').classList.add('show');
    if(S.maxEra>=2){ $('vizwrap').style.display='block'; viz.start(); }
  }
  let offline=null;
  if(lastSave && S.flags.firstAuto){ offline=offlineCatchup((Date.now()-lastSave)/1000); }
  renderCold(); if(S.flags.firstAuto) render();
  if(offline) setTimeout(()=>offlineToast(offline), 600);

  $('coBtn').onclick=inscribe;
  setInterval(tick, CFG.tickMs);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
  window.addEventListener('beforeunload', save);

  // Test seam: exposes internals only when a harness sets window.__EMERGENCE_TEST__ before load.
  if(typeof window!=='undefined' && window.__EMERGENCE_TEST__){
    window.EMERGENCE={ S, CFG, BUYS, MILES, ERAS, TREE, TREEMAP, DISCO, DISCOMAP, VIZ_STATIONS, fmt,
      unitCost, totalCost, buyQty, buy, writeRule, inscribe, quarry, fabricate, produce, checkMiles, tick,
      oStats, discoVisible, canBuyDisco, buyDisco, stats, canBuyTech, buyTech, axiomGain, compile,
      save, load, offlineCatchup, revealGame };
  }
})();
</script>
